/* O "valor de cada parcela" é só um valor PADRÃO, usado pra pré-preencher
   o pagamento, cada parcela paga pode ter sido por um valor diferente
   (pagamento personalizado), guardado em p.valor. Pagamentos que não se
   encaixam em nenhuma parcela específica ficam em rec.pagamentosExtras. */
function recStatus(rec){
  const total = rec.nParcelas || rec.parcelas.length || 1;
  const entrada = rec.valorEntrada||0;
  // Se o contrato está isento de taxa administrativa, o cliente não deve
  // mais essa fatia, o valor "devido de verdade" (usado pra calcular o
  // que falta pagar) é o contrato menos a taxa administrativa isentada,
  // não o valor total original (que só serve como registro histórico de
  // quanto foi vendido).
  const valorContratoDevido = rec.isentoTaxaAdm ? Math.max(0, rec.valorContrato - (rec.txAdm||0)) : rec.valorContrato;
  const restante = Math.max(0, valorContratoDevido - entrada);
  const valorParcela = total>0 ? restante/total : 0; // valor "padrão", só para pré-preencher o pagamento
  const parcelasInfo = rec.parcelas.map(p=>({
    numero: p.numero, pago: !!p.pago, data: p.data,
    valor: p.pago ? valorEfetivoParcela(p, {valorParcela}) : valorParcela
  }));
  const pagas = rec.parcelas.filter(p=>p.pago).length;
  const valorPagoParcelas = parcelasInfo.filter(p=>p.pago).reduce((a,p)=>a+p.valor,0);
  const extras = rec.pagamentosExtras || [];
  const valorPagoExtras = extras.reduce((a,e)=>a+(e.valor||0),0);
  const valorPago = entrada + valorPagoParcelas + valorPagoExtras;
  const valorPendente = Math.max(0, valorContratoDevido - valorPago);
  // Para PAGAR a próxima parcela: o saldo real dividido pelas parcelas em
  // aberto (valorParcela é só o padrão histórico usado em parcelas antigas
  // sem valor, e pode passar do saldo depois de congelamentos/isenção).
  const abertas = rec.parcelas.filter(p=>!p.pago).length;
  const valorSugeridoProxima = abertas>0 ? valorPendente/abertas : 0;
  return { valorParcela, valorSugeridoProxima, parcelasInfo, pagas, total, valorPago, valorPendente, quitada: valorPendente<=0.005, entrada, extras, valorContratoDevido };
}
/* "Atrasada" = ainda não quitada e já passou mais de 30 dias desde a venda.
   A planilha não guarda data de vencimento por parcela, então esta é uma
   estimativa razoável (não uma data de vencimento contratual exata).
   O "hoje" usado nesse cálculo passa a ser o ÚLTIMO DIA do período
   selecionado na tela (ou hoje de verdade, se esse dia ainda não chegou)
  , assim, escolher um mês passado mostra a situação REAL daquele mês,
   em vez de sempre misturar com o que está em aberto agora. */
const DIAS_TOLERANCIA_ATRASO = 30;
function referenceDateForFilter(filter){
  if(!filter || filter.granularity==='all') return todayISO();
  const { end } = periodRange(filter);
  const ultimoDia = new Date(end); ultimoDia.setDate(ultimoDia.getDate()-1);
  const ultimoDiaISO = toLocalISODate(ultimoDia);
  return ultimoDiaISO < todayISO() ? ultimoDiaISO : todayISO();
}
function diasAtraso(rec, refDateISO){
  const st = recStatus(rec);
  if(st.quitada) return 0;
  const inicio = new Date(rec.dataVenda+'T00:00:00');
  const ref = new Date((refDateISO||todayISO())+'T00:00:00');
  const dias = Math.floor((ref - inicio) / 86400000);
  return dias > DIAS_TOLERANCIA_ATRASO ? dias : 0;
}
function recorrenciasAtrasadas(filter){
  const ref = referenceDateForFilter(filter);
  return STATE.recurrences
    .map(r=>({ r, dias: diasAtraso(r, ref) }))
    .filter(x=>x.dias > 0)
    .sort((a,b)=>b.dias-a.dias)
    .map(x=>x.r);
}
function saleStatus(sale){
  const valorPendente = Math.max(0, (sale.valorTotal||0) - (sale.valorPago||0));
  return { valorPendente, quitada: sale.pagamentoIntegral || valorPendente<=0.005 };
}
function taxaComissao(){ return STATE.meta.taxaComissao!=null ? STATE.meta.taxaComissao : 0.10; }

// Parcelas antigas importadas podem estar marcadas como pagas com valor 0.
// Zero não é um recebimento válido; nesse caso usamos o valor contratual
// padrão, exatamente como já fazemos quando o valor está ausente (null).
function valorEfetivoParcela(parcela, statusRecorrencia){
  const valorInformado = Number(parcela && parcela.valor);
  return valorInformado > 0 ? valorInformado : statusRecorrencia.valorParcela;
}
function parcelaComValorEstimado(parcela){ return !!(parcela && parcela.pago && !(Number(parcela.valor) > 0)); }
function arred4(n){ return Math.round(n*10000)/10000; }
/* O valor PADRÃO de uma parcela depende do contrato atual (contrato −
   entrada) ÷ nº de parcelas. Parcela paga sem valor gravado herdava esse
   padrão, então editar o contrato ou desfazer a entrada mudava o valor de
   parcelas pagas meses atrás. Antes de qualquer mudança dessas, o valor que
   estava a ser mostrado fica gravado na parcela. */
function congelarValoresParcelasPagas(rec){
  const st = recStatus(rec);
  let mudou = false;
  rec.parcelas.forEach(p=>{
    if(parcelaComValorEstimado(p) && st.valorParcela > 0.005){ p.valor = arred4(st.valorParcela); mudou = true; }
  });
  return mudou;
}
/* Marca parcelas como pagas SEMPRE com valor gravado (o padrão do momento). */
function registrarPagamentoParcelas(rec, numeros, data){
  const st = recStatus(rec);
  const valor = st.valorSugeridoProxima > 0.005 ? arred4(st.valorSugeridoProxima) : null; // saldo real; nunca 0 (CHECK valor > 0)
  rec.parcelas.forEach(p=>{
    if(numeros.includes(p.numero) && !p.pago){ p.pago = true; p.data = data; p.valor = valor; }
  });
}
/* Aplica a edição de uma recorrência sem reescrever o passado: congela os
   valores já pagos e não deixa reduzir parcelas abaixo de uma já paga. */
function aplicarEdicaoRecorrencia(rec, campos){
  const nNovo = Number(campos.nParcelas)||1;
  const ultimaPaga = rec.parcelas.filter(p=>p.pago).reduce((m,p)=>Math.max(m, p.numero), 0);
  if(nNovo < ultimaPaga){
    return { erro:`A parcela ${ultimaPaga} já está paga, não dá para reduzir para ${nNovo} parcela(s). Se esse pagamento estiver errado, desfaça-o primeiro.` };
  }
  congelarValoresParcelasPagas(rec);
  let parcelas = rec.parcelas.slice().sort((a,b)=>a.numero-b.numero);
  if(nNovo > parcelas.length){ for(let i=parcelas.length; i<nNovo; i++) parcelas.push({numero:i+1, data:null, pago:false}); }
  else if(nNovo < parcelas.length){ parcelas = parcelas.slice(0, nNovo); }
  parcelas.forEach((p,i)=>{ p.numero = i+1; });
  Object.assign(rec, campos, { nParcelas:nNovo, parcelas });
  return { ok:true };
}

// O IVA guardado na recorrência é o IVA total do serviço. Cada recebimento
// reconhece somente a fração correspondente desse valor.
function ivaProporcionalRecorrencia(rec, valorRecebido){
  const valorContrato = Number(rec.valorContrato)||0;
  if(valorContrato<=0 || valorRecebido<=0) return 0;
  return (Number(rec.iva)||0) * (valorRecebido/valorContrato);
}

function componentesServicoParaTotal(servico, valorTotal){
  if(!servico) return { honorarioBase:valorTotal, iva:0, txAdm:0 };
  const baseOriginal = Number(servico.honorarioBase)||0;
  const ivaOriginal = Number(servico.iva)||0;
  const txAdm = Math.min(Number(servico.txAdm)||0, valorTotal);
  const subtotalOriginal = baseOriginal + ivaOriginal;
  const fator = subtotalOriginal>0 ? Math.max(0, valorTotal-txAdm)/subtotalOriginal : 0;
  return { honorarioBase:baseOriginal*fator, iva:ivaOriginal*fator, txAdm };
}

function componentesFinanceirosConferem(valorTotal, honorarioBase, iva, txAdm){
  return Math.abs(valorTotal - (honorarioBase + iva + txAdm)) <= 0.02;
}

/* ---------------------------------------------------------------
   COMISSÃO, regra de negócio (revisada):
   O IVA descontado NUNCA é um percentual fixo sobre o valor recebido ,
   vem do valor de IVA já configurado para aquele serviço específico no
   Catálogo de Serviços (Configurações), guardado em cada venda/recorrência
   no momento da venda, e é descontado proporcionalmente ao quanto foi
   efetivamente pago (para pagamentos parciais).
   1) Venda integral (avulsa, sem recorrência): retira-se o IVA do
      serviço (proporcional ao pago), e a comissão é a taxa de comissão
      sobre o que sobra.
   2) Entrada de uma recorrência: mesma regra da venda integral ,
      só desconta o IVA do serviço (proporcional à entrada), comissão
      sobre o líquido.
   3) Parcelas de uma recorrência (marcadas manualmente como pagas):
      desconta o IVA do serviço (proporcional à parcela) E a fatia
      diluída da taxa administrativa do contrato (taxa administrativa
      total ÷ nº de parcelas), e a comissão é a taxa de comissão sobre
      o que sobra.
   --------------------------------------------------------------- */
function comissaoSale(sale){
  const valorPago = sale.valorPago||0;
  const frac = sale.valorTotal>0 ? valorPago/sale.valorTotal : 0;
  const ivaReal = (sale.iva||0)*frac;
  const liquido = Math.max(0, valorPago - ivaReal);
  return liquido * taxaComissao();
}
function comissaoRecorrencia(rec){
  const st = recStatus(rec);
  const rate = taxaComissao();
  let total = 0;
  if(rec.valorEntrada > 0){
    const ivaReal = ivaProporcionalRecorrencia(rec, rec.valorEntrada);
    total += Math.max(0, rec.valorEntrada - ivaReal) * rate;
  }
  const txAdmPorParcela = (rec.isentoTaxaAdm || st.total<=0) ? 0 : (rec.txAdm||0) / st.total;
  rec.parcelas.forEach(p=>{
    if(p.pago){
      const valorReal = valorEfetivoParcela(p, st);
      const ivaReal = ivaProporcionalRecorrencia(rec, valorReal);
      const liquido = valorReal - ivaReal - txAdmPorParcela;
      total += Math.max(0, liquido) * rate;
    }
  });
  (rec.pagamentosExtras||[]).forEach(ex=>{
    const ivaReal = ivaProporcionalRecorrencia(rec, ex.valor||0);
    total += Math.max(0, (ex.valor||0) - ivaReal) * rate;
  });
  return total;
}

function computeSellerStats(sellerId, filter){
  filter = filter || {granularity:'all'};
  const events = buildEvents().filter(e=>e.vendedorId===sellerId && inPeriodOrAll(e.date, filter));
  const valorFaturado = events.reduce((a,e)=>a+e.valor,0);
  const comissao = events.reduce((a,e)=>a+e.comissao,0);

  const sales = STATE.sales.filter(s=>s.vendedorId===sellerId && inPeriodOrAll(s.data, filter));
  const recs = STATE.recurrences.filter(r=>r.vendedorId===sellerId && inPeriodOrAll(r.dataVenda, filter));
  let valorPendente=0, deals=0;
  // idem: vendas já contabilizadas via recorrência não somam pendente nem
  // contam como negócio à parte, é a mesma recorrência, já contada abaixo.
  sales.filter(s=>!s.jaContabilizadoViaRecorrencia).forEach(s=>{ valorPendente+=saleStatus(s).valorPendente; deals++; });
  recs.forEach(r=>{ valorPendente+=recStatus(r).valorPendente; deals++; });
  // "Valor vendido" = tudo que o vendedor gerou no período, recorrência ou não:
  // vendas integrais (excluindo as que só existem pra "espelhar" uma recorrência,
  // senão contaria o mesmo contrato duas vezes) + o valor de contrato de TODA
  // recorrência (mesmo as criadas direto no sistema, sem venda espelhada).
  const valorVendido = sales.filter(s=>!s.jaContabilizadoViaRecorrencia).reduce((a,s)=>a+(s.valorTotal||0),0)
                      + recs.reduce((a,r)=>a+(r.valorContrato||0),0);
  const seller = sellerById(sellerId) || {};
  const funil = sumFunilDiario(seller, filter);
  const temFunilDiario = Object.keys(seller.funilDiario||{}).length > 0;
  // Totais manuais antigos (sem data) só valem para "Total histórico".
  const tudo = !filter || filter.granularity==='all';
  const conversas = temFunilDiario ? funil.conversas : (tudo ? (seller.conversasIniciadas||0) : 0);
  const novosContatos = temFunilDiario ? funil.leadsQualificados : (tudo ? (seller.novosContatos||0) : 0);
  const fechamentosManual = tudo ? (seller.fechamentosManual||0) : 0;
  const taxaConversao = conversas>0 ? (fechamentosManual||deals)/conversas : null;
  return {
    valorFaturado, valorPendente, comissao, deals, valorVendido,
    ticketMedio: deals>0 ? valorFaturado/deals : 0,
    conversas, novosContatos, fechamentosManual, taxaConversao, funil, temFunilDiario,
    recorrenciaAtiva: recs.filter(r=>!recStatus(r).quitada).reduce((a,r)=>a+recStatus(r).valorPendente,0),
    nSales: sales.length, nRecs: recs.length
  };
}

/* Mesmas 4 métricas do topo, mas escopadas a um período (mês/semana/dia) ,
   usa a data de origem da venda/recorrência para decidir o que entra. */
function computeGlobalForPeriod(filter){
  const salesIn = STATE.sales.filter(s=>inPeriodOrAll(s.data, filter));
  const recsIn = STATE.recurrences.filter(r=>inPeriodOrAll(r.dataVenda, filter));
  let valorPendente=0, recorrenciaAtivaValor=0;
  // vendas marcadas jaContabilizadoViaRecorrencia são o MESMO negócio de uma
  // recorrência (a entrada dela), contar o pendente das duas ao mesmo tempo
  // duplicava o valor. Só a recorrência entra no pendente nesses casos.
  salesIn.filter(s=>!s.jaContabilizadoViaRecorrencia).forEach(s=>{ valorPendente += saleStatus(s).valorPendente; });
  recsIn.forEach(r=>{
    const st = recStatus(r);
    valorPendente += st.valorPendente;
    if(!st.quitada) recorrenciaAtivaValor += st.valorPendente;
  });
  const valorFaturado = buildEvents().filter(e=>inPeriodOrAll(e.date, filter)).reduce((a,e)=>a+e.valor,0);
  // "Valor vendido" = tudo que foi gerado no período: vendas integrais
  // (excluindo as que só espelham uma recorrência, senão duplicaria) + o
  // valor de contrato de TODA recorrência, mesmo as sem venda espelhada.
  const valorVendido = salesIn.filter(s=>!s.jaContabilizadoViaRecorrencia).reduce((a,s)=>a+(s.valorTotal||0),0)
                      + recsIn.reduce((a,r)=>a+(r.valorContrato||0),0);
  // Venda-espelho e a recorrência dela são UM fechamento só.
  const fechamentos = salesIn.filter(s=>!s.jaContabilizadoViaRecorrencia).length + recsIn.length;
  // Conversas vêm só do funil diário do período. O total manual antigo
  // (conversasIniciadas) só vale para "Total histórico"; num mês sem funil
  // preenchido a taxa fica sem valor, em vez de usar um número inventado.
  const tudo = !filter || filter.granularity==='all';
  let conversas = 0;
  // todos os vendedores (inclusive inativos), igual aos fechamentos
  STATE.sellers.forEach(s=>{
    const c = sumFunilDiario(s, filter).conversas;
    conversas += c || (tudo && !Object.keys(s.funilDiario||{}).length ? (s.conversasIniciadas||0) : 0);
  });
  const taxaConversao = conversas>0 ? fechamentos/conversas : null;
  const meta = STATE.meta.valorMeta || 0;
  return {
    valorFaturado, valorVendido, valorPendente, recorrenciaAtivaValor, taxaConversao, fechamentos, conversas,
    nRecsAbertas: recsIn.filter(r=>!recStatus(r).quitada).length,
    metaPct: meta>0 ? valorVendido/meta : 0,
    metaRestante: Math.max(0, meta - valorVendido)
  };
}

function inPeriodOrAll(dateStr, filter){
  if(!filter || filter.granularity==='all') return true;
  if(!dateStr) return false;
  const {start,end} = periodRange(filter);
  const d = new Date(dateStr+'T00:00:00');
  return d>=start && d<end;
}
function computeTaxes(filter){
  const events = buildEvents().filter(e=>inPeriodOrAll(e.date, filter));
  const ivaDevido = events.reduce((a,e)=>a+e.ivaValor,0);
  const txAdmDevido = events.reduce((a,e)=>a+e.txAdmValor,0);
  return { ivaDevido, txAdmDevido, total: ivaDevido+txAdmDevido, events };
}
function normNomeCusto(s){ return (s||'').trim().toUpperCase(); }

/* CUSTOS FIXOS, regra do escritório (definida pelo gestor em 24/09/2026):
   - um custo fixo lançado no mês N repete em N+1, N+2... como custo padrão,
     usando sempre o lançamento mais recente com aquele nome;
   - um lançamento com vencimento no próprio mês substitui a repetição
     naquele mês;
   - só conta como pago quando é marcado, e guarda a data REAL do pagamento
     (mesmo que tenha sido pago depois do vencimento);
   - excluir a partir de um mês M grava fimEm = M no lançamento que estava a
     repetir: some de M em diante e os meses anteriores ficam como estavam;
     só volta a repetir se for relançado manualmente.
   custosFixosDoMes() é a FONTE ÚNICA: a lista de Custos fixos, os cards, o
   Resumo, o Registro, o Extrato e o lucro saem todos daqui, por isso não
   podem mais discordar entre si. Custos variáveis nunca repetem. */
function mesDe(dataISO){ return dataISO ? String(dataISO).slice(0,7) : null; }
function custosFixosDoMes(monthKey){
  const porNome = new Map();
  STATE.costs.forEach(c=>{
    if(c.categoria!=='FIXO' || !c.vencimento) return;
    const k = normNomeCusto(c.nome);
    if(!porNome.has(k)) porNome.set(k, []);
    porNome.get(k).push(c);
  });
  const out = [];
  porNome.forEach(arr=>{
    arr.sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
    const exatos = arr.filter(c=>mesDe(c.vencimento)===monthKey);
    if(exatos.length){
      // Pagamento marcado na repetição de um lançamento anterior, num mês
      // que já tem lançamento próprio: não soma de novo, só fica sinalizado.
      const ignorados = arr.filter(c=>mesDe(c.vencimento) < monthKey && costPagoNoMes(c, monthKey)).map(c=>c.id);
      exatos.forEach((c,i)=>out.push(Object.assign({}, c, {
        _mes: monthKey,
        _dataPagamento: c.pago ? (c.dataPagamento||c.vencimento) : null,
        _valorPago: c.pago ? (Number(c.valor)||0) : 0,
        _duplicado: exatos.length>1,
        _pagamentoIgnorado: (i===0 && ignorados.length) ? ignorados : null
      })));
      return;
    }
    const anteriores = arr.filter(c=>mesDe(c.vencimento) < monthKey);
    if(!anteriores.length) return;
    const base = anteriores[anteriores.length-1];
    if(base.fimEm && base.fimEm <= monthKey) return; // repetição interrompida a partir de fimEm
    const reg = registoPagamentoNoMes(base, monthKey);
    out.push(Object.assign({}, base, {
      vencimento: projetarVencimentoNoMes(base.vencimento, monthKey),
      pago: reg.pago,
      _mes: monthKey,
      _dataPagamento: reg.pago ? reg.data : null,
      _valorPago: reg.pago ? reg.valor : 0,
      _projetado: true
    }));
  });
  return out;
}
function projetarVencimentoNoMes(vencimentoOriginal, monthKey){
  const dia = Math.min(Number(vencimentoOriginal.slice(8,10)), daysInMonth(monthKey));
  return `${monthKey}-${String(dia).padStart(2,'0')}`;
}
/* Pagamento de uma repetição (mês projetado). Aceita o formato antigo
   (true/false) e o atual ({pago, data, valor}). O valor pago fica guardado
   no próprio registo, pra que mudar o valor do custo depois não reescreva
   meses já pagos. Registos antigos sem data usam o vencimento projetado. */
function registoPagamentoNoMes(cost, monthKey){
  const r = cost.pagoPorMes && cost.pagoPorMes[monthKey];
  if(r==null || r===false) return { pago:false };
  if(typeof r!=='object') return { pago:true, data:projetarVencimentoNoMes(cost.vencimento, monthKey), valor:Number(cost.valor)||0 };
  if(!r.pago) return { pago:false };
  return { pago:true, data: r.data || projetarVencimentoNoMes(cost.vencimento, monthKey), valor: r.valor!=null ? Number(r.valor)||0 : Number(cost.valor)||0 };
}
function costPagoNoMes(cost, monthKey){ return registoPagamentoNoMes(cost, monthKey).pago; }
/* Meses de competência a considerar pra um filtro: o próprio mês, ou (para
   dia/semana/total) do primeiro custo fixo até ao último mês relevante. */
function mesesDeCompetencia(filter){
  if(filter && filter.granularity==='month') return [filter.anchor.slice(0,7)];
  const vencs = STATE.costs.filter(c=>c.categoria==='FIXO' && c.vencimento).map(c=>mesDe(c.vencimento)).sort();
  if(!vencs.length) return [];
  let fim = [todayISO().slice(0,7), vencs[vencs.length-1], filter && filter.anchor ? filter.anchor.slice(0,7) : ''].sort().pop();
  const out = [];
  let [y,m] = vencs[0].split('-').map(Number);
  while(true){
    const mk = `${y}-${String(m).padStart(2,'0')}`;
    if(mk > fim) break;
    out.push(mk);
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}
function novoIdCusto(){
  let id;
  do { id = 'cst-'+Date.now()+'-'+Math.random().toString(36).slice(2,6); } while(STATE.costs.some(c=>c.id===id));
  return id;
}
/* Ações sobre custos. mes = mês que está a ser visto na tela (YYYY-MM) ou
   null. Devolvem {ok:true} ou {erro:'mensagem'}; quem chama grava. */
function marcarCustoPago(costId, mes, dataPagamento){
  const c = STATE.costs.find(x=>x.id===costId);
  if(!c) return { erro:'Custo não encontrado.' };
  const data = dataPagamento || todayISO();
  if(c.categoria==='FIXO' && mes && c.vencimento && mes!==mesDe(c.vencimento)){
    if(!c.pagoPorMes) c.pagoPorMes = {};
    c.pagoPorMes[mes] = { pago:true, data, valor:Number(c.valor)||0 };
  } else {
    c.pago = true; c.dataPagamento = data;
  }
  return { ok:true };
}
function desmarcarCustoPago(costId, mes){
  const c = STATE.costs.find(x=>x.id===costId);
  if(!c) return { erro:'Custo não encontrado.' };
  if(c.categoria==='FIXO' && mes && c.vencimento && mes!==mesDe(c.vencimento)){
    if(!c.pagoPorMes) c.pagoPorMes = {};
    c.pagoPorMes[mes] = { pago:false };
  } else {
    c.pago = false; c.dataPagamento = null;
  }
  return { ok:true };
}
function salvarEdicaoCusto(costId, mes, campos){
  const c = STATE.costs.find(x=>x.id===costId);
  if(!c) return { erro:'Custo não encontrado.' };
  const { nome, valor, categoria } = campos;
  let vencimento = campos.vencimento || null;
  const mesOrigem = mesDe(c.vencimento);
  if(c.categoria==='FIXO' && mes && mesOrigem && mes!==mesOrigem){
    // Editar uma REPETIÇÃO: vira um lançamento novo a partir deste mês. O
    // lançamento original (e todos os meses anteriores) fica intacto.
    vencimento = vencimento || projetarVencimentoNoMes(c.vencimento, mes);
    if(mesDe(vencimento)!==mes) return { erro:'A data de vencimento tem de ficar dentro do mês que está a editar ('+mes+').' };
    const reg = registoPagamentoNoMes(c, mes);
    const novo = { id:novoIdCusto(), nome, valor, categoria, vencimento, pago:!!reg.pago, dataPagamento: reg.pago ? reg.data : null };
    if(c.pagoPorMes && c.pagoPorMes[mes]!=null) delete c.pagoPorMes[mes];
    // Mudou de nome ou deixou de ser fixo: o nome antigo para de repetir aqui
    // (senão os dois ficariam a repetir juntos).
    if(categoria!=='FIXO' || normNomeCusto(nome)!==normNomeCusto(c.nome)) c.fimEm = mes;
    STATE.costs.push(novo);
    return { ok:true, id:novo.id };
  }
  if(mesOrigem && vencimento && mesDe(vencimento)!==mesOrigem){
    return { erro:'Este lançamento é de '+mesOrigem+', a data de vencimento tem de ficar nesse mês. Para mudar a partir de outro mês, edite a repetição nesse mês.' };
  }
  // Congela o valor dos meses já pagos pela repetição deste lançamento,
  // pra que a mudança de valor valha só daqui pra frente.
  Object.entries(c.pagoPorMes||{}).forEach(([mk, r])=>{
    const reg = registoPagamentoNoMes(c, mk);
    if(reg.pago && (typeof r!=='object' || r.valor==null)) c.pagoPorMes[mk] = { pago:true, data:reg.data, valor:reg.valor };
  });
  const nomeAntigo = c.nome, eraFixo = c.categoria==='FIXO';
  Object.assign(c, { nome, valor, categoria, vencimento: vencimento || c.vencimento });
  // Renomear (ou deixar de ser fixo) no próprio mês: o nome antigo não pode
  // voltar a repetir a partir de um lançamento mais antigo.
  if(eraFixo && mesOrigem && (categoria!=='FIXO' || normNomeCusto(nome)!==normNomeCusto(nomeAntigo))) interromperAnteriorMesmoNome(nomeAntigo, mesOrigem);
  return { ok:true, id:c.id };
}
/* Interrompe (fimEm = mes) o lançamento mais antigo com este nome que
   voltaria a repetir a partir de "mes", se não houver outro lançamento do
   mesmo nome nesse mês. */
function interromperAnteriorMesmoNome(nome, mes){
  const mesmoNome = STATE.costs.filter(x=>x.categoria==='FIXO' && x.vencimento && normNomeCusto(x.nome)===normNomeCusto(nome));
  if(mesmoNome.some(x=>mesDe(x.vencimento)===mes)) return;
  const anteriores = mesmoNome.filter(x=>mesDe(x.vencimento) < mes).sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
  const base = anteriores[anteriores.length-1];
  if(base && (!base.fimEm || base.fimEm > mes)) base.fimEm = mes;
}
function excluirCusto(costId, mes){
  const c = STATE.costs.find(x=>x.id===costId);
  if(!c) return { erro:'Custo não encontrado.' };
  const mesOrigem = mesDe(c.vencimento);
  if(c.categoria==='FIXO' && mes && mesOrigem && mes > mesOrigem){
    c.fimEm = mes; // interrompe a repetição de "mes" em diante; o passado fica
    return { ok:true, modo:'interrompido' };
  }
  const pagosDepois = Object.keys(c.pagoPorMes||{}).filter(mk=>(!mesOrigem || mk > mesOrigem) && costPagoNoMes(c, mk)).sort();
  if(pagosDepois.length){
    return { erro:'Este custo tem pagamentos registados em meses seguintes ('+pagosDepois.join(', ')+'). Para não apagar esse histórico, exclua-o a partir do mês seguinte ao último pagamento.' };
  }
  STATE.costs = STATE.costs.filter(x=>x.id!==costId);
  // Excluir o lançamento do próprio mês também interrompe a repetição: sem
  // isto, um lançamento mais antigo com o mesmo nome voltaria a repetir a
  // partir deste mês. (Se ainda houver outro lançamento do mesmo nome neste
  // mês, era só um duplicado: o custo continua.)
  if(c.categoria==='FIXO' && mesOrigem) interromperAnteriorMesmoNome(c.nome, mesOrigem);
  return { ok:true, modo:'apagado' };
}
/* Custos fixos do mês atual, vencidos e ainda pendentes, mostrados como
   aviso na Visão Geral, com botão de pagar ali mesmo. */
function custosFixosAtrasados(filter){
  const ref = referenceDateForFilter(filter);
  return custosFixosDoMes(ref.slice(0,7)).filter(c=>!c.pago && c.vencimento && c.vencimento < ref);
}
function diasAtrasoCusto(c, refDateISO){
  const d1 = new Date(c.vencimento+'T00:00:00'), d2 = new Date((refDateISO||todayISO())+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}

function computeCosts(filter){
  let list;
  if(filter && filter.granularity==='month'){
    const monthKey = filter.anchor.slice(0,7);
    const variaveisDoMes = STATE.costs.filter(c=>c.categoria==='VARIÁVEL' && mesDe(c.vencimento || c.dataPagamento)===monthKey);
    list = [...custosFixosDoMes(monthKey), ...variaveisDoMes];
  } else {
    // Mesmo critério dos cards: repetições de cada mês do período (pelo
    // vencimento projetado) + variáveis pela data de referência.
    const fixos = [];
    mesesDeCompetencia(filter).forEach(mk=>custosFixosDoMes(mk).forEach(c=>{ if(inPeriodOrAll(c.vencimento, filter)) fixos.push(c); }));
    const variaveis = STATE.costs.filter(c=>c.categoria==='VARIÁVEL' && inPeriodOrAll(c.vencimento || c.dataPagamento, filter));
    list = [...fixos, ...variaveis];
  }
  const fixos = list.filter(c=>c.categoria==='FIXO');
  const variaveis = list.filter(c=>c.categoria==='VARIÁVEL');
  /* "fixos"/"variaveis"/"list" continuam com TODOS os lançamentos do
     período (pagos e pendentes, por data de vencimento), é o que a
     tela de gestão de Custos Fixos/Variáveis precisa pra mostrar e
     deixar editar mesmo o que ainda não foi pago.
     Já os TOTAIS dos cards seguem o mesmo regime de caixa (data real
     de pagamento) que Resumo, Extrato e Registro já usam, assim os
     mesmos números aparecem em qualquer canto do Financeiro, sem
     depender de vencimento vs. pagamento de fato. */
  const despesasPagas = linhasFinanceiras(filter).filter(l=>l.categoria==='Despesa');
  const totalFixos = despesasPagas.filter(l=>l.tipo==='Custo fixo').reduce((a,l)=>a+l.valor,0);
  const totalVariaveis = despesasPagas.filter(l=>l.tipo==='Custo variável').reduce((a,l)=>a+l.valor,0);
  return { list, fixos, variaveis, totalFixos, totalVariaveis, total: totalFixos+totalVariaveis, totalPago: totalFixos+totalVariaveis };
}
function computeLucro(filter){
  const events = buildEvents().filter(e=>inPeriodOrAll(e.date, filter));
  const recebido = events.reduce((a,e)=>a+e.valor,0);
  const tax = computeTaxes(filter);
  const costs = computeCosts(filter);
  return recebido - tax.total - costs.totalPago;
}


function ranking(filter){
  return activeSellers().map(s=>({ seller:s, stats: computeSellerStats(s.id, filter) })).sort((a,b)=>b.stats.valorFaturado - a.stats.valorFaturado);
}

/* Detalhamento do "Valor Vendido": quanto veio de vendas pagas à vista
   (integrais) x quanto veio de recorrências (contratado), e quantas
   parcelas de recorrência já foram pagas x quantas ainda estão em aberto ,
   sellerId null = todos os vendedores. */
function computeVendasBreakdown(filter, sellerId){
  const salesIn = STATE.sales.filter(s=> (!sellerId || s.vendedorId===sellerId) && inPeriodOrAll(s.data, filter));
  const recsIn = STATE.recurrences.filter(r=> (!sellerId || r.vendedorId===sellerId) && inPeriodOrAll(r.dataVenda, filter));
  // Mesmo critério do card "Valor vendido": toda venda que não é espelho
  // de uma recorrência (assim os dois subcards somam exatamente o card).
  const integrais = salesIn.filter(s=>!s.jaContabilizadoViaRecorrencia);
  const valorIntegrais = integrais.reduce((a,s)=>a+(s.valorTotal||0),0);
  const valorRecorrencias = recsIn.reduce((a,r)=>a+(r.valorContrato||0),0);
  /* "Parcelas pagas no período" tem que olhar a DATA DO PAGAMENTO de
     cada parcela, de QUALQUER recorrência do vendedor, não só das que
     começaram nesse período — senão, pagar hoje a parcela de um
     contrato antigo nunca aparecia em lugar nenhum. "Parcelas em
     aberto" já é a situação atual (sem período, porque uma parcela
     pendente não tem data pra filtrar por). */
  const todasRecsDoVendedor = STATE.recurrences.filter(r=> !sellerId || r.vendedorId===sellerId);
  let parcelasPagas=0, parcelasAbertas=0;
  todasRecsDoVendedor.forEach(r=>{ r.parcelas.forEach(p=>{
    if(p.pago){ if(inPeriodOrAll(p.data, filter)) parcelasPagas++; }
    else parcelasAbertas++;
  }); });
  return { nIntegrais: integrais.length, valorIntegrais, nRecorrencias: recsIn.length, valorRecorrencias, parcelasPagas, parcelasAbertas };
}
function renderVendasSubcards(filter, sellerId){
  const b = computeVendasBreakdown(filter, sellerId);
  return `
  <div class="cards" style="margin-top:-10px;">
    <div class="card"><div class="lbl">Vendas avulsas (sem recorrência)</div><div class="val">${fmtEUR(b.valorIntegrais)}</div><div class="sub">${b.nIntegrais} venda(s)</div></div>
    <div class="card"><div class="lbl">Vendas recorrentes (contratado)</div><div class="val">${fmtEUR(b.valorRecorrencias)}</div><div class="sub">${b.nRecorrencias} contrato(s)</div></div>
    <div class="card"><div class="lbl">Parcelas pagas</div><div class="val good">${b.parcelasPagas}</div><div class="sub">pagas no período, de qualquer contrato</div></div>
    <div class="card"><div class="lbl">Parcelas em aberto</div><div class="val bad">${b.parcelasAbertas}</div><div class="sub">situação atual, ainda não pagas</div></div>
  </div>`;
}

/* Linha a linha de tudo que compõe a comissão de um vendedor no período ,
   mesma matemática de comissaoSale/comissaoRecorrencia, calculada de novo
   aqui pra mostrar exatamente quanto foi descontado de cada recebimento. */
function comissaoBreakdownEvents(sellerId, filter){
  const rate = taxaComissao();
  const linhas = [];
  STATE.sales.filter(s=>s.vendedorId===sellerId && !s.jaContabilizadoViaRecorrencia && (s.valorPago||0)>0 && s.data && inPeriodOrAll(s.data, filter)).forEach(s=>{
    const frac = s.valorTotal>0 ? s.valorPago/s.valorTotal : 0;
    const ivaDesc = (s.iva||0)*frac;
    const liquido = Math.max(0, s.valorPago - ivaDesc);
    linhas.push({ date:s.data, cliente:s.cliente, tipo:'Venda', recebido:s.valorPago, ivaDesc, txAdmDesc:0, liquido, comissao: liquido*rate });
  });
  // Importante: cada evento (entrada/parcela/pagamento personalizado) é
  // filtrado pela PRÓPRIA data dele contra o período, não pela data da
  // venda original da recorrência. Uma parcela paga vários meses depois
  // de uma recorrência antiga tem que aparecer no mês em que foi PAGA,
  // exatamente como já acontece no cálculo oficial (buildEvents). Filtrar
  // pela data da venda deixava essa parcela de fora do detalhamento.
  STATE.recurrences.filter(r=>r.vendedorId===sellerId).forEach(r=>{
    const st = recStatus(r);
    if((r.valorEntrada||0)>0 && r.dataVenda && inPeriodOrAll(r.dataVenda, filter)){
      const ivaDesc = ivaProporcionalRecorrencia(r, r.valorEntrada);
      const liquido = Math.max(0, r.valorEntrada - ivaDesc);
      linhas.push({ date:r.dataVenda, cliente:r.cliente, tipo:'Entrada', recebido:r.valorEntrada, ivaDesc, txAdmDesc:0, liquido, comissao: liquido*rate });
    }
    const txAdmPorParcela = (r.isentoTaxaAdm || st.total<=0) ? 0 : (r.txAdm||0)/st.total;
    r.parcelas.forEach(p=>{
      if(p.pago && p.data && inPeriodOrAll(p.data, filter)){
        const valorReal = valorEfetivoParcela(p, st);
        const ivaDesc = ivaProporcionalRecorrencia(r, valorReal);
        const liquido = Math.max(0, valorReal - ivaDesc - txAdmPorParcela);
        linhas.push({ date: p.data, cliente:r.cliente, tipo:'Parcela '+p.numero+(r.isentoTaxaAdm?' (isento tx. adm.)':''), recebido: valorReal, ivaDesc, txAdmDesc:txAdmPorParcela, liquido, comissao: liquido*rate });
      }
    });
    (r.pagamentosExtras||[]).forEach(ex=>{
      if(!ex.data || !inPeriodOrAll(ex.data, filter)) return;
      const ivaDesc = ivaProporcionalRecorrencia(r, ex.valor||0);
      const liquido = Math.max(0, (ex.valor||0) - ivaDesc);
      linhas.push({ date: ex.data, cliente:r.cliente, tipo:'Pagamento personalizado', recebido: ex.valor||0, ivaDesc, txAdmDesc:0, liquido, comissao: liquido*rate });
    });
  });
  return linhas.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function abrirComissaoDetalhe(sellerId, filter){
  const seller = sellerById(sellerId);
  const linhas = comissaoBreakdownEvents(sellerId, filter);
  const totalRecebido = linhas.reduce((a,l)=>a+l.recebido,0);
  const totalComissao = linhas.reduce((a,l)=>a+l.comissao,0);
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal" style="max-width:860px;">
    <div class="modal-head"><h3>Como a comissão de ${seller?seller.nome:'-'} foi calculada</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field-hint" style="margin-bottom:14px;">
        <strong>Venda integral (avulsa, paga de uma vez):</strong> desconta-se o IVA real daquele serviço (Configurações → Catálogo de serviços) do valor recebido, a comissão é ${fmtPct(taxaComissao())} sobre o que sobra.<br>
        <strong>Entrada, parcela ou pagamento de recorrência:</strong> desconta-se a parte do IVA do serviço proporcional ao valor recebido (ex.: recebeu metade do contrato, desconta metade do IVA do serviço). Nas parcelas, desconta-se também a fatia da taxa administrativa do contrato (dividida pelo nº de parcelas), a menos que o contrato esteja marcado como isento. A comissão é ${fmtPct(taxaComissao())} sobre o que sobra.
      </div>
      ${linhas.length ? `<div style="max-height:50vh;overflow:auto;"><table><thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Recebido</th><th>IVA descontado</th><th>Tx adm. descontada</th><th>Líquido</th><th>Comissão</th></tr></thead>
      <tbody>${linhas.map(l=>`<tr><td>${fmtDate(l.date)}</td><td>${l.cliente}</td><td><span class="chip neutral">${l.tipo}</span></td><td class="tnum">${fmtEUR(l.recebido)}</td><td class="tnum">${fmtEUR(l.ivaDesc)}</td><td class="tnum">${fmtEUR(l.txAdmDesc)}</td><td class="tnum">${fmtEUR(l.liquido)}</td><td class="tnum"><strong>${fmtEUR(l.comissao)}</strong></td></tr>`).join('')}</tbody></table></div>
      <div class="block-head" style="border-top:1px solid var(--line);margin-top:2px;background:var(--surface-2);"><span>Total recebido: <strong>${fmtEUR(totalRecebido)}</strong></span><span>Total comissão: <strong>${fmtEUR(totalComissao)}</strong></span></div>`
      : `<div class="empty">Nenhum recebimento nesse período.</div>`}
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Fechar</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
}

function renderLoginScreen(mode, extra){
  mode = mode || 'signin';
  const card = document.getElementById('loginCard');
  document.getElementById('shell').classList.remove('visible');
  document.getElementById('loginScreen').classList.add('visible');

  if(mode==='signin'){
    card.innerHTML = `

      <p class="sub">Inicie sessão com o e-mail e a senha da sua conta.</p>

      <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="Digite a senha" autocomplete="current-password"></div>
      <div id="loginError" style="color:var(--bad);font-size:12.5px;margin:-6px 0 12px;display:none;"></div>
      <button class="btn gold" id="btnLogin" style="width:100%;justify-content:center;">Entrar</button>
      <p class="sub" style="margin-top:14px;font-size:11.5px;">Não tem conta? <a href="#" id="linkPedirAcesso">Peça acesso aqui</a>.</p>
    `;
    const emailInput = document.getElementById('loginEmail');
    const passInput = document.getElementById('loginPass');
    const errBox = document.getElementById('loginError');
    const btnLogin = document.getElementById('btnLogin');
    const tryEnter = async ()=>{
      errBox.style.display = 'none';
      btnLogin.disabled = true; btnLogin.textContent = 'A entrar…';
      const { data, error } = await supa.auth.signInWithPassword({
        email: emailInput.value.trim(), password: passInput.value
      });
      if(error || !data.session){
        errBox.textContent = 'E-mail ou senha incorretos.';
        errBox.style.display = 'block';
        btnLogin.disabled = false; btnLogin.textContent = 'Entrar';
        passInput.value = ''; passInput.focus();
        return;
      }
      const profile = await resolveProfile();
      if(!profile){
        errBox.textContent = 'Login válido, mas sem perfil configurado, peça ao gestor para o adicionar em "profiles".';
        errBox.style.display = 'block';
        btnLogin.disabled = false; btnLogin.textContent = 'Entrar';
        await supa.auth.signOut();
        return;
      }
      if(profile.status==='pending'){ await supa.auth.signOut(); renderLoginScreen('pending'); return; }
      if(profile.status==='rejected'){ await supa.auth.signOut(); renderLoginScreen('rejected'); return; }
      STATE.role = profile.role;
      STATE.myOwnSellerId = profile.sellerId;
      STATE.myEmail = profile.email;
      await bootAfterLogin();
    };
    btnLogin.onclick = tryEnter;
    [emailInput, passInput].forEach(el=> el.addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); }));
    document.getElementById('linkPedirAcesso').onclick = (e)=>{ e.preventDefault(); renderLoginScreen('signup'); };
    emailInput.focus();

  } else if(mode==='signup'){
    card.innerHTML = `
      <h2>Pedir acesso</h2>
      <p class="sub">Preencha os seus dados. Sua conta fica <strong>pendente</strong> até o gestor aprovar, você só consegue entrar depois disso.</p>
      <div class="field"><label>Nome</label><input type="text" id="suNome" placeholder="O seu nome"></div>
      <div class="field"><label>E-mail</label><input type="email" id="suEmail" placeholder="voce@exemplo.com" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="suSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
      <div class="field"><label>Confirmar senha</label><input type="password" id="suSenha2" placeholder="Repita a senha" autocomplete="new-password"></div>
      <div id="suError" style="color:var(--bad);font-size:12.5px;margin:-6px 0 12px;display:none;"></div>
      <button class="btn gold" id="btnSignup" style="width:100%;justify-content:center;">Pedir acesso</button>
      <p class="sub" style="margin-top:14px;font-size:11.5px;"><a href="#" id="linkVoltarLogin">&larr; Voltar para o login</a></p>
    `;
    document.getElementById('linkVoltarLogin').onclick = (e)=>{ e.preventDefault(); renderLoginScreen('signin'); };
    document.getElementById('btnSignup').onclick = async ()=>{
      const errBox = document.getElementById('suError');
      errBox.style.display = 'none';
      const nome = document.getElementById('suNome').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const senha = document.getElementById('suSenha').value;
      const senha2 = document.getElementById('suSenha2').value;
      if(!nome || !email || !senha){ errBox.textContent = 'Preencha todos os campos.'; errBox.style.display='block'; return; }
      if(senha.length < 6){ errBox.textContent = 'A senha precisa de pelo menos 6 caracteres.'; errBox.style.display='block'; return; }
      if(senha !== senha2){ errBox.textContent = 'As senhas não coincidem.'; errBox.style.display='block'; return; }
      const btn = document.getElementById('btnSignup');
      btn.disabled = true; btn.textContent = 'A enviar…';
      const { data, error } = await supa.auth.signUp({ email, password: senha });
      if(error || !data.user){
        errBox.textContent = error && error.message==='User already registered' ? 'Já existe uma conta com este e-mail.' : (error ? error.message : 'Não consegui criar a conta.');
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Pedir acesso';
        return;
      }
      if(!data.session){
        // Projeto exige confirmação por e-mail, o pedido não pode ficar
        // pendente do lado do gestor até essa confirmação acontecer.
        errBox.textContent = 'Conta criada, mas este projeto exige confirmar o e-mail antes de continuar, confirme e depois tente entrar normalmente. Se você é o gestor, desligue "Confirm email" em Authentication → Providers no Supabase pra evitar isso no futuro.';
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Pedir acesso';
        return;
      }
      const { error: profErr } = await supa.from('profiles').insert({ id: data.user.id, nome, email, status:'pending' });
      await supa.auth.signOut();
      if(profErr){
        errBox.textContent = 'A conta foi criada, mas não consegui registar o pedido, avise o gestor: ' + profErr.message;
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Pedir acesso';
        return;
      }
      renderLoginScreen('pending');
    };
    document.getElementById('suNome').focus();

  } else if(mode==='pending'){
    card.innerHTML = `
      <h2>Pedido enviado</h2>
      <p class="sub">O seu acesso está <strong>a aguardar aprovação do gestor</strong>. Assim que for aprovado, você já consegue entrar com o e-mail e a senha que definiu.</p>
      <button class="btn ghost" id="btnVoltarLogin2" style="width:100%;justify-content:center;">&larr; Voltar para o login</button>
    `;
    document.getElementById('btnVoltarLogin2').onclick = ()=> renderLoginScreen('signin');

  } else if(mode==='rejected'){
    card.innerHTML = `
      <h2>Acesso não aprovado</h2>
      <p class="sub">O seu pedido de acesso não foi aprovado. Fale diretamente com o gestor do escritório.</p>
      <button class="btn ghost" id="btnVoltarLogin3" style="width:100%;justify-content:center;">&larr; Voltar para o login</button>
    `;
    document.getElementById('btnVoltarLogin3').onclick = ()=> renderLoginScreen('signin');
  }
}
/* Corrige um bug real: marcar um mês PROJETADO de um custo fixo como pago
   gravava a data de HOJE em vez da data daquela mês específico, fazendo
   o valor "sumir" do mês certo e inflar o mês em que o clique aconteceu.
   Esta migração recalcula a data certa (vencimento projetado daquele mês)
   pra cada registro já gravado em pagoPorMes, uma vez só. */
async function applyCorrecaoDatasCustosProjetados(){
  if(STATE.meta.corrigiuDatasCustosProjetadosEm) return;
  let mudou = false;
  STATE.costs.forEach(c=>{
    if(c.categoria!=='FIXO' || !c.pagoPorMes || !c.vencimento) return;
    Object.entries(c.pagoPorMes).forEach(([mesKey, reg])=>{
      if(!reg || typeof reg!=='object' || !reg.pago) return;
      const dataCerta = projetarVencimentoNoMes(c.vencimento, mesKey);
      if(reg.data !== dataCerta){ reg.data = dataCerta; mudou = true; }
    });
  });
  if(mudou){ await persist('costs'); }
  STATE.meta.corrigiuDatasCustosProjetadosEm = todayISO();
  await persist('meta');
}
/* Roda as migracoes de dados uma vez so - so o gestor tem permissao de

/* Mantém o sistema "vivo": se a aba ficar aberta e a data virar (meia-noite,
   troca de mês), os filtros que estavam acompanhando "hoje"/"este mês"
   avançam sozinhos, sem precisar recarregar a página. Só avança um filtro
   se ele ainda estava no dia/mês antigo, se o utilizador tiver navegado
   manualmente para outro período, isso não é mexido. */
let _liveWatcherStarted = false;
function startLiveDateWatcher(){
  if(_liveWatcherStarted) return;
  _liveWatcherStarted = true;
  let lastToday = todayISO();
  setInterval(()=>{
    const nowToday = todayISO();
    if(nowToday===lastToday) return;
    const lastMonth = lastToday.slice(0,7), nowMonth = nowToday.slice(0,7);
    if(STATE.periodFilter.anchor===lastMonth) STATE.periodFilter.anchor = nowMonth;
    if(STATE.financeiroFilter.anchor===lastMonth) STATE.financeiroFilter.anchor = nowMonth;
    if(STATE.clientesFilter.anchor===lastMonth) STATE.clientesFilter.anchor = nowMonth;
    if(STATE.salesFilter.anchor===lastToday) STATE.salesFilter.anchor = nowToday;
    if(STATE.extratoData===lastToday) STATE.extratoData = nowToday;
    lastToday = nowToday;
    if(STATE.role) renderAll();
  }, 60000);
}

  document.getElementById('loginScreen').classList.remove('visible');
  document.getElementById('shell').classList.add('visible');
  STATE.view = STATE.role==='colaborador' ? 'my-panel' : 'overview';

/* Efetuar pagamento de uma recorrência direto da Visão Geral, sem precisar
   ir até Recorrências achar o cliente. Marca a(s) parcela(s) escolhida(s)
   como pagas, com a data informada, como é o MESMO campo `parcelas` que
   alimenta Financeiro (impostos), comissão e faturamento em todo o resto do
   sistema, não precisa de nenhuma conexão extra: o lançamento já aparece em
   tudo automaticamente assim que salva. */
/* Modal único de lançamento de pagamento, usado tanto pra pagar uma
   parcela específica (valor já vem preenchido, só confirma ou edita)
   quanto pro "Pagamento personalizado" (valor em branco, o gestor decide
   quanto). Os dois caminhos terminam no mesmo lugar: o valor entra no
   Faturamento/comissão/Extrato do dia normalmente. */
function abrirPagamentoModal(recId, parcelaNumero){
  const rec = STATE.recurrences.find(r=>r.id===recId);
  if(!rec) return;
  const st = recStatus(rec);
  const personalizado = parcelaNumero==null;
  const valorSugerido = personalizado ? '' : st.valorSugeridoProxima.toFixed(2);
  const hoje = todayISO();
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal">
    <div class="modal-head"><h3>${personalizado ? 'Pagamento personalizado' : 'Efetuar pagamento, Parcela '+parcelaNumero}, ${rec.cliente}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field-hint" style="margin-bottom:14px;">Pendente total do contrato: <strong>${fmtEUR(st.valorPendente)}</strong>${!personalizado?` · valor sugerido desta parcela: <strong>${fmtEUR(st.valorSugeridoProxima)}</strong>`:''}</div>
      <div class="field"><label>Valor pago (€)</label><input type="number" id="pgValor" min="0.01" step="0.01" value="${valorSugerido}" placeholder="${personalizado?'Quanto o cliente pagou':''}"></div>
      <div class="field"><label>Data do pagamento</label><input type="date" id="pgData" value="${hoje}"></div>
      <div id="pgAviso" style="display:none;color:var(--bad);font-size:12.5px;margin-top:-6px;"></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Confirmar pagamento</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  document.getElementById('mSave').onclick = async ()=>{
    const valor = Number(document.getElementById('pgValor').value)||0;
    const data = document.getElementById('pgData').value || hoje;
    const aviso = document.getElementById('pgAviso');
    if(valor<=0){ aviso.textContent = 'Informe um valor maior que zero.'; aviso.style.display='block'; return; }
    const btnSave = document.getElementById('mSave');
    if(valor > st.valorPendente + 0.01 && !btnSave.dataset.confirmouExcesso){
      // Antes o aviso aparecia mas gravava no mesmo clique; agora exige confirmação.
      aviso.textContent = `Esse valor é maior que o pendente do contrato (${fmtEUR(st.valorPendente)}). Confira; se estiver certo, clique de novo em "Confirmar mesmo assim".`;
      aviso.style.display='block';
      btnSave.dataset.confirmouExcesso = '1';
      btnSave.textContent = 'Confirmar mesmo assim';
      return;
    }
    if(!personalizado && !rec.parcelas.find(x=>x.numero===parcelaNumero)) return;
    if(!travarBotao(btnSave)) return; // evita pagamento duplicado por duplo clique
    const ok = await salvarAlteracao(rec, ()=>{
      if(personalizado){
        if(!rec.pagamentosExtras) rec.pagamentosExtras = [];
        rec.pagamentosExtras.push({ id:'pgx-'+Date.now(), data, valor });
      } else {
        const p = rec.parcelas.find(x=>x.numero===parcelaNumero);
        p.pago = true; p.valor = valor; p.data = data;
      }
    }, ()=>persistRecorrencia(rec), 'o pagamento NÃO foi gravado');
    if(ok) showSuccessToast('Pagamento registado com sucesso!');
    closeModal(); renderAll();
  };
}
/* Marca a parcela pendente mais antiga de uma recorrência como paga,
   com o valor padrão dela e a data de hoje, usada pela ação em lote
   do alerta de recorrências atrasadas, pra não precisar abrir um
   modal pra cada uma quando se quer só bater o registro rápido. */
async function marcarProximaParcelaComoPaga(rec){
  const p = rec.parcelas.find(x=>!x.pago);
  if(!p) return;
  await salvarAlteracao(rec, ()=>registrarPagamentoParcelas(rec, [p.numero], todayISO()),
    ()=>persistRecorrencia(rec), 'o pagamento de '+rec.cliente+' NÃO foi gravado');
}
function abrirPagamentoRecorrenciaModal(recId){

      ${pendentes.length ? `

        ${pendentes.map(p=>`
          <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <input type="checkbox" class="pgParcelaChk" value="${p.numero}" ${p.numero===pendentes[0].numero?'checked':''}> Parcela ${p.numero}, ${fmtEUR(st.valorSugeridoProxima)}
          </label>`).join('')}
      </div>
      <div class="field"><label>Data do pagamento</label><input type="date" id="pgData" value="${hoje}"></div>
      ` : `<div class="empty">Sem parcelas pendentes, este contrato já está quitado.</div>`}
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave" ${!pendentes.length?'disabled':''}>Confirmar pagamento</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  const btnSave = document.getElementById('mSave');
  if(btnSave) btnSave.onclick = async ()=>{
    const data = document.getElementById('pgData').value || hoje;
    const selecionadas = Array.from(document.querySelectorAll('.pgParcelaChk:checked')).map(el=>Number(el.value));
    if(!selecionadas.length){ alert('Selecione ao menos uma parcela.'); return; }
    if(!travarBotao(btnSave)) return;
    const ok = await salvarAlteracao(rec, ()=>registrarPagamentoParcelas(rec, selecionadas, data), // grava também o valor de cada parcela
      ()=>persistRecorrencia(rec), 'o pagamento NÃO foi gravado');
    if(ok) showSuccessToast('Pagamento registado com sucesso!');
    closeModal();
    renderAll();
  };
}

/* Gráfico de linhas simples em SVG puro, sem biblioteca, usado tanto na
   evolução de entradas x saídas quanto no percentual de vendas por
   vendedor ao longo do tempo. */
let _chartIdSeq = 0;
function svgMultiLineChart(months, series){
  if(!months.length) return `<div class="empty">Sem dados ainda.</div>`;
  const chartId = 'lc'+(_chartIdSeq++);
  const W = 640, H = 220, padL = 40, padR = 14, padT = 14, padB = 26;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const baseline = padT+innerH;
  const allVals = series.flatMap(s=>months.map(m=>s.values[m]||0));
  const maxV = Math.max(...allVals, 1);
  const x = i => padL + (months.length<=1?innerW/2:(i/(months.length-1))*innerW);
  const y = v => padT + innerH - (maxV>0 ? (v/maxV)*innerH : 0);
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const yy = padT+innerH-f*innerH;
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const defs = `<defs>${series.map((s,i)=>`
    <linearGradient id="${chartId}-g${i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${s.color}" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0.02"/>
    </linearGradient>`).join('')}</defs>`;
  const areasSvg = series.map((s,i)=>{
    const linePts = months.map((m,idx)=>`${x(idx)},${y(s.values[m]||0)}`).join(' L ');
    return `<path d="M ${x(0)},${baseline} L ${linePts} L ${x(months.length-1)},${baseline} Z" fill="url(#${chartId}-g${i})" stroke="none"/>`;
  }).join('');
  const linesSvg = series.map(s=>{
    const pts = months.map((m,i)=>`${x(i)},${y(s.values[m]||0)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
  }).join('');
  const dotsSvg = series.map(s=> months.map((m,i)=>`<circle cx="${x(i)}" cy="${y(s.values[m]||0)}" r="3" fill="${s.color}"/>`).join('')).join('');
  const step = Math.max(1, Math.ceil(months.length/8));
  const labelsSvg = months.map((m,i)=> i%step===0 ? `<text x="${x(i)}" y="${H-8}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${monthLabel(m).split(' de ')[0].slice(0,3)}</text>` : '').join('');
  const seriesAttr = JSON.stringify(series.map(s=>({label:s.label, color:s.color, fmt:s.fmtType||'eur', values: months.map(m=>s.values[m]||0)}))).replace(/'/g,'&apos;');
  const monthsAttr = JSON.stringify(months.map(monthLabel)).replace(/'/g,'&apos;');
  return `<div class="linechart-wrap" data-lc-months='${monthsAttr}' data-lc-series='${seriesAttr}' data-lc-padl="${padL}" data-lc-innerw="${innerW}" style="position:relative;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" class="linechart-svg">
      ${defs}${gridLines}${areasSvg}${linesSvg}${dotsSvg}
      <line class="lc-hoverline" x1="0" y1="${padT}" x2="0" y2="${baseline}" stroke="var(--wine)" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
      ${labelsSvg}
    </svg>
    <div class="lc-tooltip" style="display:none;"></div>
  </div>
    <div style="display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px;">${series.map(s=>`<span style="font-size:11px;color:var(--ink-soft);"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.color};margin-right:5px;"></span>${s.label}</span>`).join('')}</div>`;
}
/* Percentual de vendas por vendedor: quanto cada um representa do total
   vendido da empresa, mês a mês (baseado em Valor Vendido = vendas
   integrais + contrato de recorrências, igual ao resto do sistema). */
function evolucaoPercentualVendedores(){
  const sellers = activeSellers();
  const meses = new Set();
  const porVendedorMes = {};
  sellers.forEach(s=>{ porVendedorMes[s.id] = {}; });
  STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia && s.data).forEach(s=>{
    const mk = s.data.slice(0,7); meses.add(mk);
    if(porVendedorMes[s.vendedorId]) porVendedorMes[s.vendedorId][mk] = (porVendedorMes[s.vendedorId][mk]||0)+(s.valorTotal||0);
  });
  STATE.recurrences.filter(r=>r.dataVenda).forEach(r=>{
    const mk = r.dataVenda.slice(0,7); meses.add(mk);
    if(porVendedorMes[r.vendedorId]) porVendedorMes[r.vendedorId][mk] = (porVendedorMes[r.vendedorId][mk]||0)+(r.valorContrato||0);
  });
  const mesesOrdenados = [...meses].sort();
  const totalPorMes = {};
  mesesOrdenados.forEach(mk=>{ totalPorMes[mk] = sellers.reduce((a,s)=>a+(porVendedorMes[s.id][mk]||0),0); });
  const pct = {};
  sellers.forEach(s=>{
    pct[s.id] = {};
    mesesOrdenados.forEach(mk=>{ pct[s.id][mk] = totalPorMes[mk]>0 ? (porVendedorMes[s.id][mk]||0)/totalPorMes[mk]*100 : 0; });
  });
  return { meses: mesesOrdenados, sellers, pct, valorPorVendedorMes: porVendedorMes, totalPorMes };
}
const PALETA_GRAFICO = ['#520225','#BB8E1D','#2E7D5B','#B0503B','#3B6EA5','#8B5CF6','#67203F','#5B6570'];

function renderChartsPanel(){
  // Forma de pagamento mais utilizada, no período selecionado, inclui vendas
  // avulsas (exceto as já contabilizadas via recorrência, pra não duplicar) E
  // o caixa das recorrências (entrada + parcelas pagas), pela forma de
  // pagamento gravada no contrato.
  const porForma = {};
  const soma = (forma, valor)=>{ const f = forma || 'Não informado'; porForma[f] = (porForma[f]||0) + valor; };
  STATE.sales
    .filter(s=>!s.jaContabilizadoViaRecorrencia && inPeriodOrAll(s.data, STATE.periodFilter))
    .forEach(s=>soma(s.formaPagamento, s.valorPago||0));
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    if((r.valorEntrada||0)>0 && inPeriodOrAll(r.dataVenda, STATE.periodFilter)) soma(r.formaPagamento, r.valorEntrada);
    r.parcelas.forEach(p=>{
      if(p.pago && p.data && inPeriodOrAll(p.data, STATE.periodFilter)) soma(r.formaPagamento, valorEfetivoParcela(p, st));
    });
    (r.pagamentosExtras||[]).forEach(ex=>{
      if(ex.data && inPeriodOrAll(ex.data, STATE.periodFilter)) soma(r.formaPagamento, ex.valor||0);
    });
  });
  const formasOrdenadas = Object.entries(porForma).sort((a,b)=>b[1]-a[1]);
  const maxForma = formasOrdenadas.length ? formasOrdenadas[0][1] : 1;

  // Faturamento por mês (todos os meses com dados, comparação natural entre meses)
  const events = buildEvents();
  const porMes = {};
  events.forEach(e=>{ if(!e.date) return; const mk = e.date.slice(0,7); porMes[mk] = (porMes[mk]||0) + e.valor; });
  const mesesOrdenados = Object.entries(porMes).sort((a,b)=>a[0].localeCompare(b[0]));
  const maxMes = mesesOrdenados.length ? Math.max(...mesesOrdenados.map(m=>m[1])) : 1;
  const melhorMes = mesesOrdenados.length ? mesesOrdenados.reduce((a,b)=>b[1]>a[1]?b:a) : null;

  return `
  <section class="block">
    <div class="block-head"><h3>Gráficos</h3><span class="hint">forma de pagamento no período selecionado (vendas + recorrências) · faturamento por mês (histórico completo)</span></div>
    <div class="charts-grid">
      <div class="chart-col">
        <h4>Forma de pagamento mais utilizada</h4>
        ${formasOrdenadas.length ? formasOrdenadas.map(([f,v])=>`
          <div class="hbar-row">
            <span class="hbar-label">${f}</span>
            <div class="hbar-track"><span style="width:${(v/maxForma*100)}%"></span></div>
            <span class="hbar-val">${fmtEUR(v)}</span>
          </div>`).join('') : `<div class="empty">Sem vendas nesse período.</div>`}
      </div>
      <div class="chart-col">
        <h4>Faturamento por mês ${melhorMes ? `<span class="chip gold" style="margin-left:6px;">melhor: ${monthLabel(melhorMes[0])}</span>` : ''}</h4>
        ${mesesOrdenados.length ? `<div class="vbar-chart">
          ${mesesOrdenados.map(([mk,v])=>`
            <div class="vbar-col">
              <div class="vbar-track"><span style="height:${(v/maxMes*100)}%" class="${melhorMes && mk===melhorMes[0]?'best':''}"></span></div>
              <div class="vbar-val">${fmtEUR(v)}</div>
              <div class="vbar-label">${monthLabel(mk).split(' de ')[0].slice(0,3)}</div>
            </div>`).join('')}
        </div>` : `<div class="empty">Sem dados ainda.</div>`}
      </div>
    </div>
  </section>
  ${renderSaldoEEvolucaoCharts()}
  ${STATE.role==='gestor' ? renderPercentualVendedoresCharts() : ''}`;
}
/* 💰 Saldo mensal (entradas − saídas de custos) e 🟢🔴 evolução entradas x
   saídas nos últimos 12 meses, usa o mesmo registo de movimentações do
   Extrato/Registro, então está sempre sincronizado com o que é lançado. */
function renderSaldoEEvolucaoCharts(){
  const todas = linhasFinanceiras({granularity:'all'});
  const porMes = {};
  todas.forEach(l=>{
    const mk = (l.sinal<0 && l.competencia) ? l.competencia : (l.data||'').slice(0,7); // custos no mês a que se referem, igual aos cards
    if(!mk) return;
    if(!porMes[mk]) porMes[mk] = {entrou:0, saiu:0};
    if(l.sinal>0) porMes[mk].entrou += l.valor; else porMes[mk].saiu += l.valor;
  });
  const meses = Object.keys(porMes).sort().slice(-12);
  const maxSaldo = Math.max(...meses.map(mk=>Math.abs(porMes[mk].entrou-porMes[mk].saiu)), 1);
  return `
  <section class="block">
    <div class="block-head"><h3>💰 Saldo e evolução de caixa</h3><span class="hint">últimos ${meses.length} mês(es) com movimentação · vem do Registro/Extrato</span></div>
    <div class="charts-grid">
      <div class="chart-col">
        <h4>Saldo mensal (entrou − saiu)</h4>
        ${meses.length ? `<div class="vbar-chart">${meses.map(mk=>{
          const saldo = porMes[mk].entrou - porMes[mk].saiu;
          return `<div class="vbar-col">
            <div class="vbar-track"><span style="height:${(Math.abs(saldo)/maxSaldo*100)}%;background:${saldo>=0?'var(--good)':'var(--bad)'};"></span></div>
            <div class="vbar-val">${fmtEUR(saldo)}</div>
            <div class="vbar-label">${monthLabel(mk).split(' de ')[0].slice(0,3)}</div>
          </div>`;
        }).join('')}</div>` : `<div class="empty">Sem movimentações ainda.</div>`}
      </div>
      <div class="chart-col">
        <h4>🟢 Entradas x 🔴 Saídas (evolução mensal)</h4>
        ${svgMultiLineChart(meses, [
          {label:'Entradas', color:'#2E7D5B', values: Object.fromEntries(meses.map(mk=>[mk,porMes[mk].entrou])), fmtType:'eur'},
          {label:'Saídas', color:'#B0503B', values: Object.fromEntries(meses.map(mk=>[mk,porMes[mk].saiu])), fmtType:'eur'}
        ])}
      </div>
    </div>
  </section>`;
}
/* % de vendas por vendedor, só o gestor vê. Coluna = participação no mês
   atual; linhas = como essa participação evoluiu mês a mês. */
function renderPercentualVendedoresCharts(){
  const { meses, sellers, pct } = evolucaoPercentualVendedores();
  if(!meses.length || !sellers.length) return '';
  const mesAtual = meses[meses.length-1];
  const pctAtual = sellers.map(s=>({ nome:s.nome, valor: pct[s.id][mesAtual]||0 })).sort((a,b)=>b.valor-a.valor);
  const maxPct = Math.max(...pctAtual.map(p=>p.valor), 1);
  const mesesGrafico = meses.slice(-12);
  return `
  <section class="block">
    <div class="block-head"><h3>📊 Percentual de vendas por vendedor</h3><span class="hint">participação de cada um no total vendido da empresa (só visível pro gestor)</span></div>
    <div class="charts-grid">
      <div class="chart-col">
        <h4>Participação em ${monthLabel(mesAtual)}</h4>
        <div class="vbar-chart">${pctAtual.map((p,i)=>`
          <div class="vbar-col">
            <div class="vbar-track"><span style="height:${(p.valor/maxPct*100)}%;background:${PALETA_GRAFICO[i%PALETA_GRAFICO.length]};"></span></div>
            <div class="vbar-val">${p.valor.toFixed(1)}%</div>
            <div class="vbar-label">${p.nome.split(' ')[0]}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="chart-col">
        <h4>Evolução da participação (últimos ${mesesGrafico.length} meses)</h4>
        ${svgMultiLineChart(mesesGrafico, sellers.map((s,i)=>({
          label:s.nome, color:PALETA_GRAFICO[i%PALETA_GRAFICO.length], values:pct[s.id], fmtType:'pct'
        })))}
      </div>
    </div>
  </section>`;
}

/* Detalhamento "de onde vem esse número" para os cards principais (Valor
   vendido, Faturado, Pendente, Recorrência em andamento), tanto na Visão
   Geral (sellerId null, todo mundo) quanto no perfil de um vendedor
   específico (sellerId preenchido). */
function detalheCardLinhas(tipo, filter, sellerId){
  if(tipo==='vendido'){
    const linhas = STATE.sales.filter(s=>(!sellerId||s.vendedorId===sellerId) && !s.jaContabilizadoViaRecorrencia && inPeriodOrAll(s.data, filter)).map(s=>({
      data:s.data, cliente:s.cliente, vendedor:s.vendedorNome, tipo:'Venda integral', valor:s.valorTotal
    }));
    STATE.recurrences.filter(r=>(!sellerId||r.vendedorId===sellerId) && inPeriodOrAll(r.dataVenda, filter)).forEach(r=>{
      linhas.push({ data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:'Recorrência (contrato)', valor:r.valorContrato });
    });
    return linhas;
  }
  if(tipo==='faturado'){
    return buildEvents().filter(e=>(!sellerId||e.vendedorId===sellerId) && inPeriodOrAll(e.date, filter)).map(e=>({
      data:e.date, cliente:e.cliente, vendedor:e.vendedorNome, tipo:e.tipo, valor:e.valor
    }));
  }
  if(tipo==='pendente'){
    const linhas = [];
    STATE.sales.filter(s=>(!sellerId||s.vendedorId===sellerId) && !s.jaContabilizadoViaRecorrencia && inPeriodOrAll(s.data, filter)).forEach(s=>{
      const st = saleStatus(s);
      if(st.valorPendente>0.005) linhas.push({data:s.data, cliente:s.cliente, vendedor:s.vendedorNome, tipo:'Venda', valor:st.valorPendente});
    });
    STATE.recurrences.filter(r=>(!sellerId||r.vendedorId===sellerId) && inPeriodOrAll(r.dataVenda, filter)).forEach(r=>{
      const st = recStatus(r);
      if(st.valorPendente>0.005) linhas.push({data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:`Recorrência (${st.pagas}/${st.total} parcelas pagas)`, valor:st.valorPendente});
    });
    return linhas;
  }
  if(tipo==='recorrencia'){
    return STATE.recurrences.filter(r=>(!sellerId||r.vendedorId===sellerId) && inPeriodOrAll(r.dataVenda, filter) && !recStatus(r).quitada).map(r=>{
      const st = recStatus(r);
      return {data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:`${st.pagas}/${st.total} parcelas pagas`, valor:st.valorPendente};
    });
  }
  if(tipo==='custosFixos' || tipo==='custosVariaveis'){
    const tipoAlvo = tipo==='custosFixos' ? 'Custo fixo' : 'Custo variável';
    return linhasFinanceiras(filter).filter(l=>l.tipo===tipoAlvo).map(l=>({
      data:l.data, cliente:l.cliente, vendedor:'-', tipo:l.tipo, valor:l.valor
    }));
  }
  if(tipo==='impostos'){
    return buildEvents().filter(e=>inPeriodOrAll(e.date, filter) && ((e.ivaValor||0)>0 || (e.txAdmValor||0)>0)).map(e=>({
      data:e.date, cliente:e.cliente, vendedor:e.vendedorNome, tipo:`IVA ${fmtEUR(e.ivaValor||0)} + tx.adm. ${fmtEUR(e.txAdmValor||0)}`, valor:(e.ivaValor||0)+(e.txAdmValor||0)
    }));
  }
  if(tipo==='lucro'){
    const events = buildEvents().filter(e=>inPeriodOrAll(e.date, filter));
    const recebido = events.reduce((a,e)=>a+e.valor,0);
    const taxLucro = computeTaxes(filter).total;
    const custosLucro = computeCosts(filter).total;
    return [
      { data: filter.granularity==='all' ? '' : (filter.anchor||''), cliente:'Recebido no período (caixa)', vendedor:'-', tipo:'+ soma', valor:recebido },
      { data: filter.granularity==='all' ? '' : (filter.anchor||''), cliente:'Impostos devidos', vendedor:'-', tipo:'− soma', valor:-taxLucro },
      { data: filter.granularity==='all' ? '' : (filter.anchor||''), cliente:'Custos pagos (fixos + variáveis)', vendedor:'-', tipo:'− soma', valor:-custosLucro },
    ];
  }
  return [];
}

  return `<table>
    <thead><tr><th>Cliente</th><th>Serviço</th>${opts.hideVendedor?'':'<th>Vendedor</th>'}<th>Contrato</th><th>${opts.paidView?'Resumo':'Entrada + Parcelas'}</th>${opts.paidView?'':'<th>Pendente</th>'}${podeGerir?'<th></th>':''}</tr></thead>
    <tbody>
      ${list.map(r=>{
        const st = recStatus(r);
        return `<tr data-rec="${r.id}">
          <td><strong>${r.cliente}</strong><div class="sub" style="color:var(--ink-soft);font-size:11px;">${fmtDate(r.dataVenda)}</div>${(r.txAdm>0 && podeGerir) ? `<button class="chip ${r.isentoTaxaAdm?'gold':'neutral'} sm" data-toggle-isento="${r.id}" style="margin-top:4px;border:none;cursor:pointer;" title="Clique pra ${r.isentoTaxaAdm?'voltar a cobrar':'isentar'} a taxa administrativa nas parcelas">${r.isentoTaxaAdm?'✓ isento de tx. adm.':'isento de tx. adm.'}</button>` : (r.isentoTaxaAdm ? `<span class="chip gold" style="margin-top:4px;">✓ isento de tx. adm.</span>` : '')}</td>
          <td>${r.servico}</td>
          ${opts.hideVendedor?'':`<td>${r.vendedorNome||'-'}</td>`}
          <td class="tnum">${fmtEUR(r.valorContrato)}</td>
          ${opts.paidView
            ? `<td style="max-width:320px;">Entrou em <strong>${fmtDate(r.dataVenda)}</strong>, ${r.nParcelas} parcela${r.nParcelas>1?'s':''}${r.valorEntrada>0?' + entrada':''}, finalizada em <strong>${monthLabel(finalizacaoMes(r))}</strong>.</td>`
            : `<td><div class="btn-group">${r.valorEntrada>0?`<span class="chip gold">Entrada ${fmtEUR(r.valorEntrada)}</span>`:''}${r.parcelas.map(p=>
                podeGerir
                  ? `<span class="parcela-dot ${p.pago?'pago':''}" ${p.pago?`data-rec="${r.id}" data-parcela="${p.numero}"`:`data-parcela-pagar="${r.id}" data-parcela-pagar-num="${p.numero}"`} title="Parcela ${p.numero}${p.pago?', paga, clique pra desfazer':', clique para lançar o pagamento'}">${p.pago?'✓':p.numero}</span>`
                  : `<span class="parcela-dot ${p.pago?'pago':''}" style="cursor:default;" title="Parcela ${p.numero}${p.pago?', paga':', pendente'}">${p.pago?'✓':p.numero}</span>`
              ).join('')}${(r.pagamentosExtras||[]).map(ex=>`<span class="chip neutral" title="Pagamento personalizado em ${fmtDate(ex.data)}">💠 ${fmtEUR(ex.valor)}</span>`).join('')}${(podeGerir && st.valorPendente>0.005)?`<button class="btn ghost sm" data-pagamento-personalizado="${r.id}">Pagamento personalizado</button>`:''}</div></td>`}
          ${opts.paidView?'':`<td class="tnum">${st.valorPendente>0.005 ? fmtEUR(st.valorPendente) : '<span class="chip good">quitado</span>'}</td>`}
          ${podeGerir?`<td><div class="btn-group btn-group-actions"><button class="btn ghost sm" data-edit-rec="${r.id}">Editar</button><button class="btn danger sm" data-del-rec="${r.id}">Excluir</button></div></td>`:''}
        </tr>`;
      }).join('')}

}
/* Barra de busca por nome, reutilizada em Recorrências, Recorrências pagas,
   Vendas, Clientes e Financeiro, cada uma guarda seu próprio texto em
   STATE[stateKey], filtrando ao vivo enquanto digita. */
function renderSearchBar(stateKey, placeholder){
  return `<div style="margin-bottom:14px;"><input type="text" class="search-input" data-search-key="${stateKey}" placeholder="${placeholder}" value="${(STATE[stateKey]||'').replace(/"/g,'&quot;')}" style="width:100%;max-width:340px;"></div>`;
}
function matchesSearch(text, query){
  if(!query) return true;
  return (text||'').toString().toUpperCase().includes(query.trim().toUpperCase());
}

/* Lista achatada de parcelas marcadas como pagas mas sem data confirmada ,
   esse dinheiro está fora de qualquer cálculo de Faturamento/comissão por
   mês até alguém preencher a data real aqui. */
function parcelasSemData(){
  const out = [];
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    r.parcelas.forEach(p=>{
      if(p.pago && !p.data) out.push({ recId:r.id, cliente:r.cliente, vendedorNome:r.vendedorNome, dataVenda:r.dataVenda, numero:p.numero, valor: valorEfetivoParcela(p, st) });
    });
  });
  return out.sort((a,b)=> (a.dataVenda||'').localeCompare(b.dataVenda||''));
}
function renderRecurrencesNoDate(){
  const lista = parcelasSemData().filter(l=>matchesSearch(l.cliente, STATE.searchRecorrencias));
  return `
  ${renderSearchBar('searchRecorrencias','Buscar por nome do cliente…')}
  <div class="field-hint" style="margin-bottom:14px;">Essas parcelas já foram marcadas como pagas, mas a data real do pagamento não é conhecida, por isso não entram em nenhum mês de Faturamento, comissão ou gráficos até você preencher a data aqui. Preencha e clique em Salvar pra que o valor passe a contar no mês certo.</div>
  <section class="block">
    <div class="block-head"><h3>Parcelas pagas sem data (${lista.length})</h3></div>

      </tr>`).join('')}</tbody></table>` : `<div class="empty">${STATE.searchRecorrencias ? 'Nenhuma encontrada com esse nome.' : 'Nenhuma parcela pendente de data no momento.'}</div>`}

/* Junta toda parcela, entrada e pagamento personalizado marcado como
   pago HOJE, de qualquer recorrência, pra quem clicou errado
   conseguir desfazer na hora, sem precisar ir procurar no Extrato. */
function pagamentosRecentesHoje(){
  const hoje = todayISO();
  const linhas = [];
  STATE.recurrences.forEach(r=>{
    if(r.dataVenda===hoje && (r.valorEntrada||0)>0){
      linhas.push({ ref:{tipo:'entrada', recId:r.id}, cliente:r.cliente, tipo:'Entrada', valor:r.valorEntrada });
    }
    r.parcelas.forEach(p=>{
      if(p.pago && p.data===hoje){
        const st = recStatus(r);
        linhas.push({ ref:{tipo:'parcela', recId:r.id, numero:p.numero}, cliente:r.cliente, tipo:'Parcela '+p.numero, valor: valorEfetivoParcela(p, st) });
      }
    });
    (r.pagamentosExtras||[]).forEach(ex=>{
      if(ex.data===hoje){
        linhas.push({ ref:{tipo:'extra', recId:r.id, extraId:ex.id}, cliente:r.cliente, tipo:'Pagamento personalizado', valor:ex.valor });
      }
    });
  });
  return linhas;
}
function renderRecurrences(){
  const abertas = STATE.recurrences.filter(r=>!recStatus(r).quitada).filter(r=>matchesSearch(r.cliente, STATE.searchRecorrencias));

    <div class="nav-group-body ${painelAberto?'aberto':''}" style="max-height:${painelAberto?'600px':'0'};">
      <section class="block" style="margin-top:10px;">
        <div class="block-head"><h3>Pagamentos registados hoje</h3><span class="hint">clicou errado? reverte aqui na hora</span></div>
        ${recentes.length ? `<table><thead><tr><th>Cliente</th><th>Tipo</th><th>Valor</th><th></th></tr></thead>

/* =========================================================
   VENDAS
   ========================================================= */
/* Líquido recebido só das recorrências (entrada + parcelas pagas) de um
   vendedor num período, usa os mesmos eventos de buildEvents(), excluindo
   os que vêm de vendas avulsas (tipo:'Venda'). */
function recorrenciaCashSeller(sellerId, filter){
  return buildEvents().filter(e=>e.vendedorId===sellerId && e.tipo!=='Venda' && inPeriodOrAll(e.date, filter)).reduce((a,e)=>a+e.valor,0);
}

function renderSales(){
  // "Vendas" precisa mostrar TUDO que foi vendido no período, venda
  // integral (STATE.sales, sem contar a "venda-sombra" de uma recorrência
  // duas vezes) e recorrências (que não têm registo nenhum em STATE.sales
  // quando cadastradas direto no painel). Cada linha carrega o tipo.
  const linhasIntegrais = STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia).map(s=>{
    const st = saleStatus(s);
    return { tipo:'integral', id:s.id, data:s.data, cliente:s.cliente, vendedorId:s.vendedorId, vendedorNome:s.vendedorNome,
      origem:s.origem, servico:s.servico, valorTotal:s.valorTotal, valorPago:s.valorPago, valorPendente:st.valorPendente, quitada: st.valorPendente<=0.005 };
  });
  const linhasRecorrentes = STATE.recurrences.map(r=>{
    const st = recStatus(r);
    return { tipo:'recorrente', id:r.id, data:r.dataVenda, cliente:r.cliente, vendedorId:r.vendedorId, vendedorNome:r.vendedorNome,
      origem:r.origem, servico:r.servico, valorTotal:r.valorContrato, valorPago:st.valorPago, valorPendente:st.valorPendente, quitada:st.quitada };
  });
  const todasLinhas = [...linhasIntegrais, ...linhasRecorrentes];

  const months = [...new Set(todasLinhas.map(s=>s.data && s.data.slice(0,7)).filter(Boolean))].sort().reverse();
  const vendedoresComVenda = STATE.sellers.filter(s=>todasLinhas.some(v=>v.vendedorId===s.id));
  const list = todasLinhas
    .filter(s=>inPeriodOrAll(s.data, STATE.salesFilter))
    .filter(s=>STATE.salesVendorFilter==='all' || s.vendedorId===STATE.salesVendorFilter)
    .filter(s=>matchesSearch(s.cliente, STATE.searchVendas))
    .sort((a,b)=> (b.data||'').localeCompare(a.data||''));
  const totalRecebido = list.reduce((a,s)=>a+(s.valorPago||0),0);
  const totalVendido = list.reduce((a,s)=>a+(s.valorTotal||0),0);
  const vendedorSelecionado = STATE.salesVendorFilter!=='all' ? sellerById(STATE.salesVendorFilter) : null;
  const resumoVendedor = vendedorSelecionado ? (()=>{
    const liquidoVendas = linhasIntegrais.filter(s=>s.vendedorId===vendedorSelecionado.id && inPeriodOrAll(s.data, STATE.salesFilter)).reduce((a,s)=>a+(s.valorPago||0),0);
    const liquidoRecorrencia = recorrenciaCashSeller(vendedorSelecionado.id, STATE.salesFilter);
    return `
    <div class="cards" style="margin:0 0 20px;">
      <div class="card"><div class="lbl">${vendedorSelecionado.nome} · líquido de vendas integrais</div><div class="val good">${fmtEUR(liquidoVendas)}</div></div>
      <div class="card"><div class="lbl">${vendedorSelecionado.nome} · líquido de recorrência</div><div class="val good">${fmtEUR(liquidoRecorrencia)}</div></div>
      <div class="card accent"><div class="lbl">${vendedorSelecionado.nome} · líquido total (vendas + recorrência)</div><div class="val good">${fmtEUR(liquidoVendas+liquidoRecorrencia)}</div></div>
      <div class="card"><div class="lbl">${vendedorSelecionado.nome} · vendas no total (valor vendido)</div><div class="val">${fmtEUR(totalVendido)}</div></div>
    </div>`;
  })() : '';
  return `
  ${renderGenericFilterBar('salesFilter', ['all','month','day'], months)}
  <div class="period-bar" style="margin-bottom:20px;">
    <div class="period-tabs" style="background:none;border:none;padding:0;gap:0;">
      <span style="font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:0 4px;">Vendedor:</span>
    </div>
    <select id="salesVendorSelect">
      <option value="all" ${STATE.salesVendorFilter==='all'?'selected':''}>Todos os vendedores</option>
      ${vendedoresComVenda.map(s=>`<option value="${s.id}" ${STATE.salesVendorFilter===s.id?'selected':''}>${s.nome}</option>`).join('')}
    </select>
  </div>
  ${renderSearchBar('searchVendas','Buscar por nome do cliente…')}
  ${resumoVendedor}
