<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Controlo — CRM Jurídico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --surface-2:#F5F6F4;
  --ink:#1C2430; --ink-soft:#5B6570; --line:#DCDFDA;
  --wine:#520225; --wine-2:#67203F; --wine-line:#864E66;
  --gold:#BB8E1D; --gold-soft:#F7F1E4;
  --good:#2E7D5B; --good-soft:#DFF0E6;
  --bad:#B0503B; --bad-soft:#F5E0DA;
  --radius:10px; --shadow:0 1px 2px rgba(28,36,48,.06), 0 8px 24px -12px rgba(28,36,48,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Source Serif 4',serif;font-weight:600;margin:0;color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

.shell{display:none;min-height:100vh;}
.shell.visible{display:flex;}

/* ===== LOGIN ===== */
.login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#7A0F3E,var(--wine) 60%);padding:20px;}
.login-screen.visible{display:flex;}
.login-card{background:var(--surface);border-radius:16px;padding:34px 34px 28px;width:100%;max-width:420px;box-shadow:0 30px 70px rgba(0,0,0,.35);}
.login-card .mark{width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,var(--gold),#755C13);color:var(--wine);display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-weight:700;margin-bottom:14px;}
.login-card h2{font-size:21px;margin-bottom:4px;}
.login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
.role-btn{width:100%;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;transition:.15s;}
.role-btn:hover{border-color:var(--gold);background:#FFFBF2;}
.role-btn strong{display:block;font-size:14.5px;color:var(--ink);}
.role-btn span{font-size:12px;color:var(--ink-soft);}
.login-back{background:none;border:none;color:var(--ink-soft);font-size:12.5px;margin-bottom:14px;padding:0;}
.seller-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.seller-pick button{border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:10px;font-size:13px;font-weight:600;text-align:left;}
.seller-pick button:hover{border-color:var(--gold);}

/* ===== SIDEBAR ===== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:264px;flex-shrink:0;background:var(--wine);color:#E9ECF3;display:flex;flex-direction:column;border-right:1px solid var(--wine-line);z-index:10;}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--wine-line);}
.brand .mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,var(--gold),#755C13);color:var(--wine);font-family:'Source Serif 4',serif;font-weight:700;font-size:16px;margin-bottom:10px;}
.brand h1{font-size:17px;color:#fff;letter-spacing:.2px;}
.brand p{margin:4px 0 0;font-size:11.5px;color:#9AA4BC;letter-spacing:.4px;text-transform:uppercase;}

.nav{padding:14px 12px;border-bottom:1px solid var(--wine-line);}
.nav button{width:100%;text-align:left;background:none;border:none;color:#C7CEDF;padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:9px;margin-bottom:2px;transition:.15s;}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav button.active{background:var(--wine-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
.nav button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;}

.sellers-block{flex:1;overflow-y:auto;padding:14px 12px;}
.sellers-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#8992AC;}
.iconbtn{width:22px;height:22px;border-radius:6px;border:1px solid var(--wine-line);background:var(--wine-2);color:#C7CEDF;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;}
.iconbtn:hover{background:var(--gold);color:var(--wine);border-color:var(--gold);}

.seller-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
.seller-row:hover{background:rgba(255,255,255,.06);}
.seller-row.active{background:var(--wine-2);}
.seller-row .avatar{width:30px;height:30px;border-radius:50%;background:var(--wine-2);border:1px solid var(--wine-line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#E9ECF3;flex-shrink:0;}
.seller-row.rank1 .avatar{background:linear-gradient(160deg,var(--gold),#755C13);color:var(--wine);border-color:var(--gold);}
.seller-row .info{flex:1;min-width:0;}
.seller-row .info .name{font-size:13px;color:#EDEFF5;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seller-row .info .sub{font-size:11px;color:#8992AC;}
.seller-row.inactive .avatar,.seller-row.inactive .info .name{opacity:.45;}

.sidebar-foot{padding:14px 16px 16px;border-top:1px solid var(--wine-line);}
.sidebar-foot #sessionLabel{font-size:12px;color:#C7CEDF;margin-bottom:10px;}
.sidebar-foot #sessionLabel strong{display:block;font-size:13.5px;color:#fff;font-weight:600;}
.sidebar-foot #sessionLabel .role-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#8992AC;}
.logout-btn{width:100%;background:none;border:1px solid var(--wine-line);color:#E9ECF3;border-radius:7px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;}
.logout-btn:hover{background:rgba(255,255,255,.06);border-color:#E0A3A3;color:#E0A3A3;}

/* ===== MAIN ===== */
.content{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:264px;}
.topbar{padding:18px 28px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.topbar h2{font-size:20px;}
.topbar .meta-inline{display:flex;align-items:center;gap:14px;}
.progress-mini{width:180px;}
.progress-mini .bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
.progress-mini .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#755C13);}
.progress-mini .lbl{font-size:11px;color:var(--ink-soft);margin-top:4px;display:flex;justify-content:space-between;}

.viewport{padding:24px 28px 60px;flex:1;}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
.card .val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--ink);}
.card .val.good{color:var(--good);}
.card .val.bad{color:var(--bad);}
.card .sub{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.card.accent{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF7,var(--surface));}

section.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.block-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap;}
.block-head h3{font-size:15.5px;}
.block-head .hint{font-size:11.5px;color:var(--ink-soft);}

.subtabs{display:flex;gap:6px;padding:14px 20px 0;}
.subtabs button{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.subtabs button.active{background:var(--wine);color:#fff;border-color:var(--wine);}

.btn{background:var(--wine);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--wine-2);}
.btn.gold{background:var(--gold);color:var(--wine);}
.btn.gold:hover{background:#a17b28;}
.btn.ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad-soft);}
.btn.danger:hover{background:var(--bad-soft);}
.btn.sm{padding:5px 10px;font-size:11.5px;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);padding:9px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600;}
td{padding:11px 20px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FBFBFA;}
.tnum{font-family:'IBM Plex Mono',monospace;font-weight:500;}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.chip.good{background:var(--good-soft);color:var(--good);}
.chip.bad{background:var(--bad-soft);color:var(--bad);}
.chip.neutral{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
.chip.gold{background:var(--gold-soft);color:#8a6420;}

.parcela-dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:4px;color:var(--ink-soft);transition:.12s;}
.parcela-dot.pago{background:var(--good);border-color:var(--good);color:#fff;}
.parcela-dot:hover{transform:scale(1.12);}

.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty .big{font-size:28px;margin-bottom:6px;}

.rank-list{padding:6px 0;}
.rank-item{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);}
.rank-item:last-child{border-bottom:none;}
.rank-item .pos{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
.rank-item.p1 .pos{background:radial-gradient(circle at 35% 30%,#F4DFA0,var(--gold) 70%);color:var(--wine);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.rank-item .name{flex:1;font-weight:600;}
.rank-item .bar-wrap{width:180px;}
.rank-item .bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
.rank-item .bar>span{display:block;height:100%;background:var(--wine);}
.rank-item.p1 .bar>span{background:linear-gradient(90deg,var(--gold),#755C13);}
.rank-item .amt{width:100px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;}

.seller-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.seller-hero .avatar-lg{width:56px;height:56px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-size:20px;font-weight:700;flex-shrink:0;}
.seller-hero h2{font-size:22px;}
.seller-hero .tag{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.funnel .fitem{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.funnel .fitem label{display:block;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.4px;}
.funnel .fitem input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;background:#fff;}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,24,34,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:88vh;overflow-y:auto;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;}
.modal-head button{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;}
.modal-body{padding:20px 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;}
.field input:focus,.field select:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.modal-warn{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}

.badge-sheet{font-size:10px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:2px 7px;border-radius:5px;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c7cbc5;border-radius:5px;}
.sidebar ::-webkit-scrollbar-thumb{background:#40496a;}

@media(max-width:880px){
  .shell.visible{flex-direction:column;}
  .sidebar{position:static;width:100%;height:auto;}
  .content{margin-left:0;}
  .sellers-block{max-height:220px;}
}
</style>
</head>

const SUPABASE_URL = "https://wtanyagjmgjedszivsfu.supabase.co";
const SUPABASE_KEY = "sb_publishable_DKWzJQhSx7qoKtOdY1x7cg_-kxwVnWh";

async function sbRequest(path, options={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      ...(options.headers||{})
    }
  });
  if(!res.ok){
    const body = await res.text().catch(()=> '');
    throw new Error(`Supabase ${res.status}: ${body.slice(0,200)}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}
async function sbGet(key){
  const rows = await sbRequest(`app_state?key=eq.${encodeURIComponent(key)}&select=value`);
  return (rows && rows.length) ? rows[0].value : undefined;
}
async function sbSet(key, value){
  await sbRequest('app_state', {
    method:'POST',
    headers:{ 'Prefer':'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify([{ key, value, updated_at: new Date().toISOString() }])
  });
}

// Dados de negócio: Supabase é a fonte única partilhada
const DB = {
  async get(key, fallback){
    try{
      const v = await sbGet(key);
      if(v!==undefined) return v;
      await this.set(key, fallback); // primeira vez: semeia o Supabase com os dados de exemplo
      return fallback;
    }catch(e){
      console.error('Supabase get falhou', key, e);
      showErrorToast('não consegui ler do Supabase ('+key+'): '+e.message);
      return fallback;
    }
  },
  async set(key, value){
    try{ await sbSet(key, value); }
    catch(e){
      console.error('Supabase set falhou', key, e);
      showErrorToast('não consegui gravar no Supabase ('+key+'): '+e.message);
    }
  }
};

// Sessão (papel/identidade): fica só neste navegador, não vai para o Supabase
const SessionDB = {
  async get(key, fallback){
    try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }
    catch(e){ return fallback; }
  },
  async set(key, value){
    try{ await window.storage.set(key, JSON.stringify(value), false); }
    catch(e){ console.error('session storage falhou', key, e); }
  }
};

const fmtEUR = n => (Number(n)||0).toLocaleString('pt-PT',{style:'currency',currency:'EUR'});
const fmtPct = n => (Number(n)||0).toLocaleString('pt-PT',{style:'percent',maximumFractionDigits:1});
const fmtDate = d => d ? new Date(d+'T00:00:00').toLocaleDateString('pt-PT') : '—';
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function sellerById(id){ return STATE.sellers.find(s=>s.id===id); }
function activeSellers(){ return STATE.sellers.filter(s=>s.ativo); }
function serviceByName(nome){
  if(!nome) return null;
  const n = nome.trim().toUpperCase();
  return STATE.services.find(s=>s.nome.trim().toUpperCase()===n) || null;
}

function recStatus(rec){
  const total = rec.nParcelas || rec.parcelas.length || 1;
  const entrada = rec.valorEntrada||0;
  const restante = Math.max(0, rec.valorContrato - entrada);
  const valorParcela = total>0 ? restante/total : 0;
  const pagas = rec.parcelas.filter(p=>p.pago).length;
  const valorPagoParcelas = pagas*valorParcela;
  const valorPago = entrada + valorPagoParcelas;
  const valorPendente = Math.max(0, rec.valorContrato - valorPago);
  return { valorParcela, pagas, total, valorPago, valorPendente, quitada: valorPendente<=0.005, entrada };
}
function saleStatus(sale){
  const valorPendente = Math.max(0, (sale.valorTotal||0) - (sale.valorPago||0));
  return { valorPendente, quitada: sale.pagamentoIntegral || valorPendente<=0.005 };
}
function taxaComissao(){ return STATE.meta.taxaComissao!=null ? STATE.meta.taxaComissao : 0.5; }

function computeSellerStats(sellerId){
  const sales = STATE.sales.filter(s=>s.vendedorId===sellerId);
  const recs = STATE.recurrences.filter(r=>r.vendedorId===sellerId);
  const rate = taxaComissao();
  let valorFaturado=0, valorPendente=0, comissao=0, deals=0;
  sales.forEach(s=>{
    valorFaturado+=s.valorPago||0; valorPendente+=saleStatus(s).valorPendente;
    const frac = s.valorTotal>0 ? (s.valorPago/s.valorTotal) : 0;
    comissao += (s.honorarioBase||0)*frac*rate;
    deals++;
  });
  recs.forEach(r=>{
    const st = recStatus(r);
    valorFaturado+=st.valorPago; valorPendente+=st.valorPendente;
    const frac = r.valorContrato>0 ? (st.valorPago/r.valorContrato) : 0;
    comissao += (r.honorarioBase||0)*frac*rate;
    deals++;
  });
  const seller = sellerById(sellerId) || {};
  const conversas = seller.conversasIniciadas||0;
  const fechamentosManual = seller.fechamentosManual||0;
  const taxaConversao = conversas>0 ? (fechamentosManual||deals)/conversas : null;
  return {
    valorFaturado, valorPendente, comissao, deals,
    ticketMedio: deals>0 ? valorFaturado/deals : 0,
    conversas, novosContatos: seller.novosContatos||0, fechamentosManual, taxaConversao,
    recorrenciaAtiva: recs.filter(r=>!recStatus(r).quitada).reduce((a,r)=>a+recStatus(r).valorPendente,0),
    nSales: sales.length, nRecs: recs.length
  };
}

function computeGlobal(){
  let valorFaturado=0, valorPendente=0, recorrenciaAtivaValor=0, conversas=0, fechamentos=0;
  STATE.sales.forEach(s=>{ valorFaturado+=s.valorPago||0; valorPendente+=saleStatus(s).valorPendente; });
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    valorFaturado+=st.valorPago; valorPendente+=st.valorPendente;
    if(!st.quitada) recorrenciaAtivaValor += st.valorPendente;
  });
  activeSellers().forEach(s=>{ conversas += s.conversasIniciadas||0; });
  fechamentos = STATE.sales.length + STATE.recurrences.length;
  const taxaConversao = conversas>0 ? fechamentos/conversas : null;
  const meta = STATE.meta.valorMeta || 0;
  return {
    valorFaturado, valorPendente, recorrenciaAtivaValor, taxaConversao, fechamentos, conversas,
    metaPct: meta>0 ? valorFaturado/meta : 0,
    metaRestante: Math.max(0, meta - valorFaturado)
  };
}

function computeTaxes(){
  let ivaDevido=0, txAdmDevido=0;
  STATE.sales.forEach(s=>{
    const frac = s.valorTotal>0 ? (s.valorPago/s.valorTotal) : 0;
    ivaDevido += (s.iva||0)*frac; txAdmDevido += (s.txAdm||0)*frac;
  });
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    const frac = r.valorContrato>0 ? (st.valorPago/r.valorContrato) : 0;
    ivaDevido += (r.iva||0)*frac; txAdmDevido += (r.txAdm||0)*frac;
  });
  return { ivaDevido, txAdmDevido, total: ivaDevido+txAdmDevido };
}
function computeCosts(){
  const fixos = STATE.costs.filter(c=>c.categoria==='FIXO');
  const variaveis = STATE.costs.filter(c=>c.categoria==='VARIÁVEL');
  const sum = arr=>arr.reduce((a,c)=>a+(c.valor||0),0);
  const sumPago = arr=>arr.filter(c=>c.pago).reduce((a,c)=>a+(c.valor||0),0);
  return { totalFixos: sum(fixos), totalVariaveis: sum(variaveis), total: sum(STATE.costs), totalPago: sumPago(STATE.costs) };
}
function computeLucro(){
  const g = computeGlobal(); const tax = computeTaxes(); const costs = computeCosts();
  return g.valorFaturado - tax.total - costs.totalPago;
}

function ranking(){
  return activeSellers().map(s=>({ seller:s, stats: computeSellerStats(s.id) })).sort((a,b)=>b.stats.valorFaturado - a.stats.valorFaturado);
}

    passInput.addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });
    passInput.focus();
  }
}
function enterApp(){
  document.getElementById('loginScreen').classList.remove('visible');
  document.getElementById('shell').classList.add('visible');
  STATE.view = STATE.role==='colaborador' ? 'my-panel' : 'overview';
  renderAll();
}

/* =========================================================
   NAV / SIDEBAR
   ========================================================= */
const NAV_GESTOR = [
  {view:'overview', label:'Visão Geral'},
  {view:'recurrences', label:'Recorrências'},
  {view:'sales', label:'Vendas'},
  {view:'ranking', label:'Ranking'},
  {view:'config', label:'Configurações'},
  {view:'financeiro', label:'Financeiro'},
];
const NAV_COLAB = [ {view:'my-panel', label:'Minhas Vendas'} ];

function renderNav(){
  const items = STATE.role==='gestor' ? NAV_GESTOR : NAV_COLAB;
  document.getElementById('mainNav').innerHTML = items.map(it=>`<button data-view="${it.view}" class="${STATE.view===it.view?'active':''}"><span class="dot"></span>${it.label}</button>`).join('');
  document.querySelectorAll('#mainNav button').forEach(b=>{
    b.addEventListener('click', ()=>{ STATE.view = b.dataset.view; renderAll(); });
  });
  document.getElementById('sellersBlock').style.display = STATE.role==='gestor' ? '' : 'none';
  const me = STATE.role==='colaborador' ? sellerById(STATE.myOwnSellerId) : null;
  document.getElementById('sessionLabel').innerHTML = STATE.role==='gestor'
    ? '<span class="role-tag">Sessão ativa</span><strong>Gestor(a)</strong>'
    : `<span class="role-tag">Sessão ativa</span><strong>${me?me.nome:'Colaborador(a)'}</strong>`;
}

function renderSidebar(){
  if(STATE.role!=='gestor') return;
  const rk = ranking();
  const topId = rk[0] && rk[0].stats.valorFaturado>0 ? rk[0].seller.id : null;
  const list = document.getElementById('sellerList');
  const inactive = STATE.sellers.filter(s=>!s.ativo);
  list.innerHTML = rk.map(({seller,stats})=>`
    <div class="seller-row ${seller.id===STATE.selectedSellerId?'active':''} ${seller.id===topId?'rank1':''}" data-seller="${seller.id}">
      <div class="avatar">${initials(seller.nome)}</div>
      <div class="info"><div class="name">${seller.nome}</div><div class="sub">${fmtEUR(stats.valorFaturado)}</div></div>
    </div>`).join('') + (inactive.length ? `
    <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--wine-line);">
      <div class="sellers-head" style="padding-bottom:6px;">Inativos</div>
      ${inactive.map(s=>`<div class="seller-row inactive" data-seller="${s.id}"><div class="avatar">${initials(s.nome)}</div><div class="info"><div class="name">${s.nome}</div><div class="sub">reativar</div></div></div>`).join('')}
    </div>` : '');
  list.querySelectorAll('.seller-row').forEach(row=>{
    row.addEventListener('click', ()=>{ STATE.selectedSellerId = row.dataset.seller; STATE.view = 'seller-detail'; renderAll(); });
  });
}

function renderTopbar(){
  const titles = {overview:'Visão Geral', recurrences:'Recorrências', sales:'Vendas', ranking:'Ranking de Vendedores', 'seller-detail':'Vendedor', config:'Configurações', financeiro:'Financeiro', 'my-panel':'Minhas Vendas'};
  document.getElementById('pageTitle').textContent = titles[STATE.view] || '';
  const g = computeGlobal();
  const inline = document.getElementById('metaInline');
  if(STATE.view==='overview'){
    inline.innerHTML = `
      <div class="progress-mini">
        <div class="bar"><span style="width:${Math.min(100,g.metaPct*100)}%"></span></div>
        <div class="lbl"><span>${fmtPct(g.metaPct)} da meta</span><span>${fmtEUR(STATE.meta.valorMeta)}</span></div>
      </div>
      <button class="btn ghost sm" id="btnEditMeta">Editar meta</button>`;
    document.getElementById('btnEditMeta').addEventListener('click', openMetaModal);
  } else inline.innerHTML = '';
}

/* =========================================================
   OVERVIEW
   ========================================================= */
function renderOverview(){
  const g = computeGlobal();
  const rk = ranking().slice(0,3);
  return `
  <div class="cards">
    <div class="card accent"><div class="lbl">Faturamento recebido</div><div class="val good">${fmtEUR(g.valorFaturado)}</div><div class="sub">Meta de ${fmtEUR(STATE.meta.valorMeta)} · faltam ${fmtEUR(g.metaRestante)}</div></div>
    <div class="card"><div class="lbl">Pendências (a receber)</div><div class="val bad">${fmtEUR(g.valorPendente)}</div><div class="sub">Vendas parciais + recorrências em aberto</div></div>
    <div class="card"><div class="lbl">Recorrência em andamento</div><div class="val">${fmtEUR(g.recorrenciaAtivaValor)}</div><div class="sub">${STATE.recurrences.filter(r=>!recStatus(r).quitada).length} contrato(s) com parcela pendente</div></div>
    <div class="card"><div class="lbl">Taxa de conversão</div><div class="val">${g.taxaConversao!==null ? fmtPct(g.taxaConversao) : '—'}</div><div class="sub">${g.taxaConversao!==null ? g.fechamentos+' fechamentos / '+g.conversas+' conversas' : 'informe conversas iniciadas por vendedor'}</div></div>
  </div>
  <section class="block">
    <div class="block-head"><h3>Top vendedores</h3><span class="hint">por faturamento recebido</span></div>
    <div class="rank-list">${rk.length ? rk.map((r,i)=>rankRow(r,i)).join('') : `<div class="empty">Sem vendas registadas ainda.</div>`}</div>
  </section>
  <section class="block">
    <div class="block-head"><h3>Recorrências com parcela pendente</h3><span class="hint">clique numa parcela para marcar como paga</span></div>
    ${recurrenceTable(STATE.recurrences.filter(r=>!recStatus(r).quitada).slice(0,6))}
  </section>`;
}
function rankRow(r,i){
  const max = ranking()[0] ? ranking()[0].stats.valorFaturado || 1 : 1;
  const pct = max>0 ? (r.stats.valorFaturado/max*100) : 0;
  return `<div class="rank-item ${i===0?'p1':''}"><div class="pos">${i+1}</div><div class="name">${r.seller.nome}</div><div class="bar-wrap"><div class="bar"><span style="width:${pct}%"></span></div></div><div class="amt">${fmtEUR(r.stats.valorFaturado)}</div></div>`;
}

/* =========================================================
   RECORRÊNCIAS
   ========================================================= */
function recurrenceTable(list, opts){
  opts = opts || {};
  if(!list.length) return `<div class="empty"><div class="big">✓</div>Nenhuma recorrência aqui.</div>`;
  return `<table>
    <thead><tr><th>Cliente</th><th>Serviço</th>${opts.hideVendedor?'':'<th>Vendedor</th>'}<th>Contrato</th><th>Entrada + Parcelas</th><th>Pendente</th><th></th></tr></thead>
    <tbody>
      ${list.map(r=>{
        const st = recStatus(r);
        return `<tr data-rec="${r.id}">
          <td><strong>${r.cliente}</strong><div class="sub" style="color:var(--ink-soft);font-size:11px;">${fmtDate(r.dataVenda)}</div></td>
          <td>${r.servico}</td>
          ${opts.hideVendedor?'':`<td>${r.vendedorNome||'—'}</td>`}
          <td class="tnum">${fmtEUR(r.valorContrato)}</td>
          <td>${r.valorEntrada>0?`<span class="chip gold" style="margin-right:6px;">Entrada ${fmtEUR(r.valorEntrada)}</span>`:''}${r.parcelas.map(p=>`<span class="parcela-dot ${p.pago?'pago':''}" data-rec="${r.id}" data-parcela="${p.numero}" title="Parcela ${p.numero}${p.pago?' — paga':' — clique para marcar como paga'}">${p.pago?'✓':p.numero}</span>`).join('')}</td>
          <td class="tnum">${st.valorPendente>0.005 ? fmtEUR(st.valorPendente) : '<span class="chip good">quitado</span>'}</td>
          <td><button class="btn danger sm" data-del-rec="${r.id}">Excluir</button></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}
function renderRecurrences(){
  return `<section class="block">
    <div class="block-head"><h3>Todas as recorrências (${STATE.recurrences.length})</h3><button class="btn gold" id="btnAddRec">+ Nova recorrência</button></div>
    ${recurrenceTable([...STATE.recurrences].sort((a,b)=> (recStatus(a).quitada?1:0) - (recStatus(b).quitada?1:0)))}
  </section>`;
}

  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  document.getElementById('mSave').onclick = async ()=>{

      <div class="field-row">
        <div class="field"><label>Valor do contrato (€)</label><input type="number" id="rValor" min="0" step="0.01"></div>
        <div class="field"><label>Valor de entrada (€)</label><input type="number" id="rEntrada" min="0" step="0.01" value="0"></div>
      </div>
      <div class="field"><label>Nº de parcelas (após a entrada)</label><select id="rParcelas"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Criar</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });

  let matchedService = null;
  const rServico = document.getElementById('rServico');
  rServico.addEventListener('input', ()=>{
    matchedService = serviceByName(rServico.value);
    const prev = document.getElementById('rServicoPreview');
    if(matchedService){
      document.getElementById('rValor').value = matchedService.honorarioFinal;
      prev.innerHTML = `Honorário base: <strong>${fmtEUR(matchedService.honorarioBase)}</strong> · IVA: ${fmtEUR(matchedService.iva)} · Taxa adm.: ${fmtEUR(matchedService.txAdm)}`;
    } else {
      prev.textContent = 'Serviço não cadastrado no catálogo — será registado sem detalhamento de imposto (edite em Configurações > Serviços depois, se quiser).';
    }
  });

  document.getElementById('mSave').onclick = async ()=>{
    const cliente = document.getElementById('rCliente').value.trim();
    const servico = rServico.value.trim();
    const data = document.getElementById('rData').value;
    const vendedorId = forColaborador ? STATE.myOwnSellerId : document.getElementById('rVendedor').value;
    const valorContrato = Number(document.getElementById('rValor').value)||0;
    const valorEntrada = Number(document.getElementById('rEntrada').value)||0;
    const nParcelas = Number(document.getElementById('rParcelas').value)||1;
    if(!cliente || !valorContrato){ alert('Preencha ao menos cliente e valor do contrato.'); return; }
    if(valorEntrada > valorContrato){ alert('O valor de entrada não pode ser maior que o valor do contrato.'); return; }
    const vendedor = sellerById(vendedorId);
    const parcelas = Array.from({length:nParcelas}, (_,i)=>({numero:i+1, data:null, pago:false}));
    STATE.recurrences.push({
      id:'rec-'+Date.now(), dataVenda:data||new Date().toISOString().slice(0,10), cliente, servico,
      nParcelas, valorEntrada,
      honorarioBase: matchedService?matchedService.honorarioBase:valorContrato,
      iva: matchedService?matchedService.iva:0,
      txAdm: matchedService?matchedService.txAdm:0,
      valorContrato, vendedorId, vendedorNome: vendedor?vendedor.nome:'—', parcelas, origemSheet:'manual'
    });
    await persist('recurrences'); closeModal(); renderAll();
  };
}

function openConfirmModal({title, message, confirmLabel, onConfirm, danger}){
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal" style="max-width:380px;">
    <div class="modal-head"><h3>${title}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body"><div class="${danger?'modal-warn':''}">${message}</div></div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn ${danger?'danger':'gold'}" id="mOk">${confirmLabel}</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  document.getElementById('mOk').onclick = async ()=>{ await onConfirm(); closeModal(); };
}

function openServiceModal(existingId){
  const existing = existingId ? STATE.services.find(s=>s.id===existingId) : null;
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal">
    <div class="modal-head"><h3>${existing?'Editar serviço':'Novo serviço'}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome do serviço</label><input type="text" id="svNome" value="${existing?existing.nome:''}"></div>
      <div class="field-row">
        <div class="field"><label>Honorário base (€)</label><input type="number" id="svBase" step="0.01" value="${existing?existing.honorarioBase:0}"></div>
        <div class="field"><label>IVA (€)</label><input type="number" id="svIva" step="0.01" value="${existing?existing.iva:0}"></div>
      </div>
      <div class="field"><label>Taxa administrativa (€)</label><input type="number" id="svTx" step="0.01" value="${existing?existing.txAdm:0}"></div>
      <div class="field-hint">Honorário final = base + IVA + taxa administrativa (calculado automaticamente).</div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">${existing?'Guardar':'Criar'}</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  document.getElementById('mSave').onclick = async ()=>{
    const nome = document.getElementById('svNome').value.trim();
    if(!nome) return;
    const base = Number(document.getElementById('svBase').value)||0;
    const iva = Number(document.getElementById('svIva').value)||0;
    const tx = Number(document.getElementById('svTx').value)||0;
    const honorarioFinal = base+iva+tx;
    if(existing){
      Object.assign(existing, {nome, honorarioBase:base, iva, txAdm:tx, honorarioFinal});
    } else {
      STATE.services.push({id:'srv-'+Date.now(), nome, honorarioBase:base, iva, txAdm:tx, honorarioFinal});
    }
    await persist('services'); closeModal(); renderAll();
  };
}

function openCostModal(existingId){
  const existing = existingId ? STATE.costs.find(c=>c.id===existingId) : null;
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal">
    <div class="modal-head"><h3>${existing?'Editar custo':'Novo custo'}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome</label><input type="text" id="ctNome" value="${existing?existing.nome:''}"></div>
      <div class="field-row">
        <div class="field"><label>Valor (€)</label><input type="number" id="ctValor" step="0.01" value="${existing?existing.valor:0}"></div>
        <div class="field"><label>Categoria</label><select id="ctCategoria"><option value="FIXO" ${existing&&existing.categoria==='FIXO'?'selected':''}>Fixo</option><option value="VARIÁVEL" ${existing&&existing.categoria==='VARIÁVEL'?'selected':''}>Variável</option></select></div>
      </div>
      <div class="field"><label>Data de vencimento</label><input type="date" id="ctVenc" value="${existing&&existing.vencimento?existing.vencimento:''}"></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">${existing?'Guardar':'Criar'}</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  document.getElementById('mSave').onclick = async ()=>{
    const nome = document.getElementById('ctNome').value.trim();
    if(!nome) return;
    const valor = Number(document.getElementById('ctValor').value)||0;
    const categoria = document.getElementById('ctCategoria').value;
    const vencimento = document.getElementById('ctVenc').value || null;
    if(existing){
      Object.assign(existing, {nome, valor, categoria, vencimento});
    } else {
      STATE.costs.push({id:'cst-'+Date.now(), nome, valor, categoria, vencimento, pago:false});
    }
    await persist('costs'); closeModal(); renderAll();
  };
}

/* =========================================================
   EVENTOS DELEGADOS
   ========================================================= */
function wireViewportEvents(){
  const vp = document.getElementById('viewport');

  vp.querySelectorAll('[data-parcela]').forEach(dot=>{
    dot.addEventListener('click', async ()=>{
      try{
        const recId = dot.dataset.rec, num = Number(dot.dataset.parcela);
        const rec = STATE.recurrences.find(r=>r.id===recId);
        if(!rec){ showErrorToast('recorrência '+recId+' não encontrada.'); return; }
        const parcela = rec.parcelas.find(pp=>pp.numero===num);
        if(!parcela){ showErrorToast('parcela '+num+' não encontrada.'); return; }
        parcela.pago = !parcela.pago;
        if(parcela.pago && !parcela.data) parcela.data = new Date().toISOString().slice(0,10);
        renderAll(); // atualiza a tela já, independente do resultado da gravação
        await persist('recurrences');
      }catch(err){
        showErrorToast(err && err.message ? err.message : String(err));
      }
    });
  });

  vp.querySelectorAll('[data-del-rec]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const recId = btn.dataset.delRec;
      const rec = STATE.recurrences.find(r=>r.id===recId);
      openConfirmModal({
        title:'Excluir recorrência', danger:true, confirmLabel:'Excluir',
        message:`Tem a certeza que deseja excluir a recorrência de <strong>${rec.cliente}</strong>? Esta ação não pode ser desfeita.`,
        onConfirm: async ()=>{ STATE.recurrences = STATE.recurrences.filter(r=>r.id!==recId); await persist('recurrences'); renderAll(); }
      });
    });
  });

  const btnAddRec = document.getElementById('btnAddRec');
  if(btnAddRec) btnAddRec.onclick = ()=>openAddRecModal(false);
  const btnAddRecColab = document.getElementById('btnAddRecColab');
  if(btnAddRecColab) btnAddRecColab.onclick = ()=>openAddRecModal(true);

  const fConversas = document.getElementById('fConversas');
  const fContatos = document.getElementById('fContatos');
  const fFechamentos = document.getElementById('fFechamentos');
  if(fConversas){
    const save = async ()=>{
      const s = sellerById(STATE.selectedSellerId);
      s.conversasIniciadas = Number(fConversas.value)||0;
      s.novosContatos = Number(fContatos.value)||0;
      s.fechamentosManual = Number(fFechamentos.value)||0;
      await persist('sellers'); renderAll();
    };
    fConversas.addEventListener('change', save);
    fContatos.addEventListener('change', save);
    fFechamentos.addEventListener('change', save);
  }

  const btnSaveSenha = document.getElementById('btnSaveSenha');
  if(btnSaveSenha){
    btnSaveSenha.onclick = async ()=>{
      const val = document.getElementById('fSenha').value;
      if(!val){ return; }
      const s = sellerById(STATE.selectedSellerId);
      s.senha = val;
      await persist('sellers');
      document.getElementById('senhaSavedMsg').style.display = 'inline';
      document.getElementById('fSenha').value = '';
    };
  }

  const btnToggleSeller = document.getElementById('btnToggleSeller');
  if(btnToggleSeller){
    btnToggleSeller.onclick = ()=>{
      const s = sellerById(STATE.selectedSellerId);
      if(s.ativo){
        openConfirmModal({
          title:'Desativar vendedor', danger:true, confirmLabel:'Desativar',
          message:`<strong>${s.nome}</strong> deixará de aparecer no ranking e na lista ativa. O histórico de vendas e recorrências é mantido e pode ser reativado a qualquer momento.`,
          onConfirm: async ()=>{ s.ativo=false; await persist('sellers'); renderAll(); }
        });
      } else { s.ativo = true; persist('sellers').then(renderAll); }
    };
  }

  // Configurações
  vp.querySelectorAll('[data-ctab]').forEach(b=> b.addEventListener('click', ()=>{ STATE.configTab=b.dataset.ctab; renderAll(); }));
  const btnAddService = document.getElementById('btnAddService');
  if(btnAddService) btnAddService.onclick = ()=>openServiceModal(null);
  vp.querySelectorAll('[data-edit-service]').forEach(b=> b.addEventListener('click', ()=>openServiceModal(b.dataset.editService)));
  vp.querySelectorAll('[data-del-service]').forEach(b=> b.addEventListener('click', ()=>{
    openConfirmModal({
      title:'Excluir serviço', danger:true, confirmLabel:'Excluir',
      message:'Tem a certeza? Vendas e recorrências já criadas não serão afetadas.',
      onConfirm: async ()=>{ STATE.services = STATE.services.filter(s=>s.id!==b.dataset.delService); await persist('services'); renderAll(); }
    });
  }));
  const btnSaveComissao = document.getElementById('btnSaveComissao');
  if(btnSaveComissao) btnSaveComissao.onclick = async ()=>{
    STATE.meta.taxaComissao = (Number(document.getElementById('cfgTaxaComissao').value)||0)/100;
    STATE.meta.taxaIvaPadrao = (Number(document.getElementById('cfgTaxaIva').value)||0)/100;
    await persist('meta'); renderAll();
  };

  // Financeiro
  vp.querySelectorAll('[data-ftab]').forEach(b=> b.addEventListener('click', ()=>{ STATE.financeiroTab=b.dataset.ftab; renderAll(); }));
  const btnAddCost = document.getElementById('btnAddCost');
  if(btnAddCost) btnAddCost.onclick = ()=>openCostModal(null);
  vp.querySelectorAll('[data-edit-cost]').forEach(b=> b.addEventListener('click', ()=>openCostModal(b.dataset.editCost)));
  vp.querySelectorAll('[data-toggle-cost]').forEach(b=> b.addEventListener('click', async ()=>{
    const c = STATE.costs.find(x=>x.id===b.dataset.toggleCost); c.pago = !c.pago; await persist('costs'); renderAll();
  }));
  vp.querySelectorAll('[data-del-cost]').forEach(b=> b.addEventListener('click', ()=>{
    openConfirmModal({
      title:'Excluir custo', danger:true, confirmLabel:'Excluir', message:'Tem a certeza que deseja excluir este custo?',
      onConfirm: async ()=>{ STATE.costs = STATE.costs.filter(c=>c.id!==b.dataset.delCost); await persist('costs'); renderAll(); }
    });
  }));
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function renderAll(){
  try{
    if(!STATE.role){ renderLoginScreen('choose'); return; }
    renderNav();
    renderTopbar();
    renderSidebar();
    const vp = document.getElementById('viewport');
    if(STATE.view==='overview') vp.innerHTML = renderOverview();
    else if(STATE.view==='recurrences') vp.innerHTML = renderRecurrences();
    else if(STATE.view==='sales') vp.innerHTML = renderSales();
    else if(STATE.view==='ranking') vp.innerHTML = renderRanking();
    else if(STATE.view==='seller-detail') vp.innerHTML = renderSellerDetail();
    else if(STATE.view==='config') vp.innerHTML = renderConfig();
    else if(STATE.view==='financeiro') vp.innerHTML = renderFinanceiro();
    else if(STATE.view==='my-panel') vp.innerHTML = renderMyPanel();
    wireViewportEvents();
  }catch(err){
    console.error(err);
    showErrorToast(err && err.message ? err.message : String(err));
  }
}

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('btnAddSeller').addEventListener('click', openAddSellerModal);
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  STATE.role=null; STATE.myOwnSellerId=null; await saveSession(); renderLoginScreen('choose');
});

(async function init(){
  await loadState();
  await loadSession();
  if(STATE.role){ enterApp(); } else { renderLoginScreen('choose'); }
})();
</script>
