<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Controlo — CRM Jurídico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --surface-2:#F5F6F4;
  --ink:#1C2430; --ink-soft:#5B6570; --line:#DCDFDA;
  --wine:#520225; --wine-2:#67203F; --wine-line:#864E66;
  --gold:#BB8E1D; --gold-soft:#F7F1E4;
  --good:#2E7D5B; --good-soft:#DFF0E6;
  --bad:#B0503B; --bad-soft:#F5E0DA;
  --radius:10px; --shadow:0 1px 2px rgba(28,36,48,.06), 0 8px 24px -12px rgba(28,36,48,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:'Source Serif 4',serif;font-weight:600;margin:0;color:var(--ink);}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
.search-input{padding:9px 12px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;}
.search-input:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}

.shell{display:none;min-height:100vh;}
.shell.visible{display:flex;}

/* ===== LOGIN ===== */
.login-screen{min-height:100vh;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#7A0F3E,var(--wine) 60%);padding:20px;}
.login-screen.visible{display:flex;}
.login-card{background:var(--surface);border-radius:16px;padding:34px 34px 28px;width:100%;max-width:420px;box-shadow:0 30px 70px rgba(0,0,0,.35);}
.login-card .mark{width:44px;height:44px;border-radius:50%;background:linear-gradient(160deg,var(--gold),#755C13);color:var(--wine);display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-weight:700;margin-bottom:14px;}
.login-card h2{font-size:21px;margin-bottom:4px;}
.login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
.role-btn{width:100%;text-align:left;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;transition:.15s;}
.role-btn:hover{border-color:var(--gold);background:#FFFBF2;}
.role-btn strong{display:block;font-size:14.5px;color:var(--ink);}
.role-btn span{font-size:12px;color:var(--ink-soft);}
.login-back{background:none;border:none;color:var(--ink-soft);font-size:12.5px;margin-bottom:14px;padding:0;}
.seller-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.seller-pick button{border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:10px;font-size:13px;font-weight:600;text-align:left;}
.seller-pick button:hover{border-color:var(--gold);}

/* ===== SIDEBAR ===== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:264px;flex-shrink:0;background:var(--wine);color:#E9ECF3;display:flex;flex-direction:column;border-right:1px solid var(--wine-line);z-index:10;}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--wine-line);}
.brand .mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(160deg,var(--gold),#755C13);color:var(--wine);font-family:'Source Serif 4',serif;font-weight:700;font-size:16px;margin-bottom:10px;}
.brand h1{font-size:17px;color:#fff;letter-spacing:.2px;}
.brand p{margin:4px 0 0;font-size:11.5px;color:#9AA4BC;letter-spacing:.4px;text-transform:uppercase;}

.nav{padding:14px 12px;border-bottom:1px solid var(--wine-line);}
.nav button{width:100%;text-align:left;background:none;border:none;color:#C7CEDF;padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:9px;margin-bottom:2px;transition:.15s;}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav button.active{background:var(--wine-2);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
.nav button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;}

.sellers-block{flex:1;overflow-y:auto;padding:14px 12px;}
.sellers-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#8992AC;}
.iconbtn{width:22px;height:22px;border-radius:6px;border:1px solid var(--wine-line);background:var(--wine-2);color:#C7CEDF;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;}
.iconbtn:hover{background:var(--gold);color:var(--wine);border-color:var(--gold);}

.seller-row{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;cursor:pointer;margin-bottom:2px;}
.seller-row:hover{background:rgba(255,255,255,.06);}
.seller-row.active{background:var(--wine-2);}
.seller-row .avatar{width:30px;height:30px;border-radius:50%;background:var(--wine-2);border:1px solid var(--wine-line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#E9ECF3;flex-shrink:0;}
.seller-row.rank1 .avatar{background:linear-gradient(160deg,var(--gold),#755C13);color:var(--wine);border-color:var(--gold);}
.seller-row .info{flex:1;min-width:0;}
.seller-row .info .name{font-size:13px;color:#EDEFF5;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.seller-row .info .sub{font-size:11px;color:#8992AC;}
.seller-row.inactive .avatar,.seller-row.inactive .info .name{opacity:.45;}

.sidebar-foot{padding:14px 16px 16px;border-top:1px solid var(--wine-line);}
.sidebar-foot #sessionLabel{font-size:12px;color:#C7CEDF;margin-bottom:10px;}
.sidebar-foot #sessionLabel strong{display:block;font-size:13.5px;color:#fff;font-weight:600;}
.sidebar-foot #sessionLabel .role-tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#8992AC;}
.logout-btn{width:100%;background:none;border:1px solid var(--wine-line);color:#E9ECF3;border-radius:7px;padding:8px 10px;font-size:12.5px;font-weight:600;cursor:pointer;}
.logout-btn:hover{background:rgba(255,255,255,.06);border-color:#E0A3A3;color:#E0A3A3;}

/* ===== MAIN ===== */
.content{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:264px;}
.topbar{padding:16px 28px;border-bottom:1px solid var(--line);background:var(--surface);display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:nowrap;}
.topbar h2{font-size:20px;padding-top:8px;flex-shrink:0;}
.topbar h2:empty{display:none;}
.topbar .meta-inline{display:flex;align-items:center;flex:1 1 100%;max-width:100%;min-width:0;}
.progress-mini{width:180px;}
.progress-mini .bar{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
.progress-mini .bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#755C13);}
.progress-mini .lbl{font-size:11px;color:var(--ink-soft);margin-top:4px;display:flex;justify-content:space-between;}

.meta-hero{width:100%;background:linear-gradient(180deg,#FFFDF7,var(--surface));border:1px solid var(--gold);border-radius:var(--radius);padding:14px 18px 16px;box-shadow:var(--shadow);}
.meta-hero-top{display:flex;align-items:center;gap:14px;flex-wrap:nowrap;justify-content:flex-start;margin-bottom:12px;}
.meta-hero-title{font-size:17px;margin-right:6px;flex-shrink:0;}
.meta-hero-top select,.meta-hero-top input[type="date"]{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff;flex-shrink:0;}
.meta-hero-top .period-nav{flex-shrink:0;}
.meta-hero-top .period-tabs{flex-shrink:0;}
.meta-hero-bottom{display:flex;flex-direction:column;gap:8px;}
.meta-hero-numbers{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.meta-hero-val{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:700;color:var(--ink);line-height:1;}
.meta-hero-of{font-size:13px;color:var(--ink-soft);}
.meta-hero-pct{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:700;color:#8a6420;}
.meta-hero-bar{height:18px;border-radius:9px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
.meta-hero-bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#755C13);transition:width .25s;}

.viewport{padding:24px 28px 60px;flex:1;}
.quick-actions{display:flex;gap:10px;margin-bottom:18px;}

.alert-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bad-soft);border:1px solid var(--bad);color:var(--bad);padding:12px 16px;border-radius:var(--radius);margin-bottom:18px;font-size:13px;font-weight:600;}
.alert-banner button{background:none;border:none;color:var(--bad);font-size:20px;line-height:1;font-weight:700;padding:0 4px;}
.alert-banner button:hover{opacity:.6;}

.atraso-block{border-color:var(--bad);}
.atraso-block .block-head{background:var(--bad-soft);}
.atraso-block .block-head h3{color:var(--bad);}

.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:18px 20px;}
.chart-col h4{font-size:13px;margin-bottom:14px;color:var(--ink-soft);font-weight:600;}
.hbar-row{display:grid;grid-template-columns:120px 1fr 80px;align-items:center;gap:8px;margin-bottom:8px;}
.hbar-label{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbar-track{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
.hbar-track > span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#755C13);}
.hbar-val{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-align:right;}
.vbar-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px;}
.vbar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;cursor:pointer;}
.vbar-col:hover .vbar-track > span{filter:brightness(1.15);outline:2px solid var(--gold);outline-offset:1px;}
.vbar-col:hover .vbar-val{color:var(--wine);font-weight:700;}
.vbar-track{flex:1;width:100%;display:flex;align-items:flex-end;}
.vbar-track > span{display:block;width:100%;background:var(--wine);border-radius:4px 4px 0 0;min-height:2px;}
.vbar-track > span.best{background:linear-gradient(180deg,var(--gold),#755C13);}
.vbar-val{font-size:10px;color:var(--ink-soft);margin-top:4px;font-family:'IBM Plex Mono',monospace;}
.vbar-label{font-size:11px;color:var(--ink-soft);margin-top:2px;text-transform:capitalize;}
@media(max-width:880px){ .charts-grid{grid-template-columns:1fr;} }

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
.card .val{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:var(--ink);}
.card .val.good{color:var(--good);}
.card .val.bad{color:var(--bad);}
.card .sub{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.card.accent{border-color:var(--gold);background:linear-gradient(180deg,#FFFDF7,var(--surface));}

section.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;}
.block-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap;}
.block-head h3{font-size:15.5px;}
.block-head .hint{font-size:11.5px;color:var(--ink-soft);}

.subtabs{display:flex;gap:6px;padding:14px 20px 0;}
.subtabs button{background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.subtabs button.active{background:var(--wine);color:#fff;border-color:var(--wine);}

.period-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:20px;box-shadow:var(--shadow);}
.period-tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px;}
.period-tabs button{background:none;border:none;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-soft);border-radius:6px;}
.period-tabs button.active{background:var(--wine);color:#fff;}
.period-nav{display:flex;align-items:center;gap:10px;}
.iconbtn-lite{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);font-size:15px;line-height:1;}
.iconbtn-lite:hover{border-color:var(--wine);color:var(--wine);}
.period-label{font-size:13px;font-weight:600;color:var(--ink);min-width:150px;text-align:center;}
.period-bar select,.period-bar input[type="date"]{padding:6px 10px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:#fff;}

.btn{background:var(--wine);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{background:var(--wine-2);}
.btn.gold{background:var(--gold);color:var(--wine);}
.btn.gold:hover{background:#a17b28;}
.btn.ghost{background:none;color:var(--ink-soft);border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--ink-soft);color:var(--ink);}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad-soft);}
.btn.danger:hover{background:var(--bad-soft);}
.btn.sm{padding:5px 10px;font-size:11.5px;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);padding:9px 20px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:600;}
td{padding:11px 20px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FBFBFA;}
.tnum{font-family:'IBM Plex Mono',monospace;font-weight:500;}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
.chip.good{background:var(--good-soft);color:var(--good);}
.chip.bad{background:var(--bad-soft);color:var(--bad);}
.chip.neutral{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
.chip.gold{background:var(--gold-soft);color:#8a6420;}

.parcela-dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;margin-right:4px;color:var(--ink-soft);transition:.12s;}
.parcela-dot.pago{background:var(--good);border-color:var(--good);color:#fff;}
.parcela-dot:hover{transform:scale(1.12);}

.empty{padding:40px 20px;text-align:center;color:var(--ink-soft);}
.empty .big{font-size:28px;margin-bottom:6px;}

.rank-list{padding:6px 0;}
.rank-item{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);}
.rank-item:last-child{border-bottom:none;}
.rank-item .pos{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);}
.rank-item.p1 .pos{background:radial-gradient(circle at 35% 30%,#F4DFA0,var(--gold) 70%);color:var(--wine);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft);}
.rank-item .name{flex:1;font-weight:600;}
.rank-item .bar-wrap{width:180px;}
.rank-item .bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line);}
.rank-item .bar>span{display:block;height:100%;background:var(--wine);}
.rank-item.p1 .bar>span{background:linear-gradient(90deg,var(--gold),#755C13);}
.rank-item .amt{width:100px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:600;}

.seller-hero{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
.seller-hero .avatar-lg{width:56px;height:56px;border-radius:50%;background:var(--wine);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Source Serif 4',serif;font-size:20px;font-weight:700;flex-shrink:0;}
.seller-hero h2{font-size:22px;}
.seller-hero .tag{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
.funnel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.funnel .fitem{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
.funnel .fitem label{display:block;font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.4px;}
.funnel .fitem input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;background:#fff;}

.linechart-wrap{cursor:crosshair;}
.lc-tooltip{position:absolute;top:6px;background:var(--wine);color:#fff;padding:8px 11px;border-radius:8px;font-size:11.5px;line-height:1.5;pointer-events:none;box-shadow:var(--shadow);z-index:5;white-space:nowrap;transform:translateX(-50%);}
.lc-tooltip strong{display:block;font-size:11px;opacity:.85;margin-bottom:3px;}
.saldo-hero-block{padding:0;overflow:hidden;}
.saldo-hero{background:linear-gradient(135deg,var(--wine),var(--wine-2));padding:28px 26px;text-align:center;color:#fff;}
.saldo-hero-lbl{font-size:12.5px;letter-spacing:.3px;opacity:.85;margin-bottom:6px;}
.saldo-hero-val{font-family:'Source Serif 4',serif;font-size:38px;font-weight:600;line-height:1.1;}
.saldo-hero-val.bad{color:#ffb3a0;}
.saldo-hero-sub{font-size:12.5px;opacity:.85;margin-top:8px;}
.extrato-list{display:flex;flex-direction:column;}
.extrato-item{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);}
.extrato-item:last-child{border-bottom:none;}
.extrato-icon{width:38px;height:38px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.extrato-main{flex:1;min-width:0;}
.extrato-titulo{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.extrato-tags{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;}
.extrato-valor{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;white-space:nowrap;}
.extrato-valor.good{color:var(--good);}
.extrato-valor.bad{color:var(--bad);}
.funil-day-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 20px 6px;flex-wrap:wrap;}
.funil-day-current{text-align:center;min-width:150px;}
.funil-day-current strong{display:block;font-family:'Source Serif 4',serif;font-size:17px;color:var(--wine);}
.funil-day-current span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--ink-soft);}
.funil-day-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:16px 20px;}
@media (max-width: 900px){ .funil-day-grid{grid-template-columns:repeat(3,1fr);} }
@media (max-width: 560px){ .funil-day-grid{grid-template-columns:repeat(2,1fr);} }
.funil-field{display:flex;flex-direction:column;gap:5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 9px;min-width:0;}
.funil-field label{font-size:10px;line-height:1.2;min-height:24px;display:flex;align-items:flex-end;color:var(--ink-soft);font-weight:600;}
.funil-field .funil-input{width:100%;padding:5px 6px;font-size:13px;border:1px solid var(--line);border-radius:7px;font-family:'IBM Plex Mono',monospace;background:var(--surface);color:var(--ink);}
.funil-field .funil-input:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}
.funil-field-money{background:var(--gold-soft);border-color:var(--gold);}
.funil-field-money label{color:var(--wine);}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,24,34,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:#fff;border-radius:12px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:88vh;overflow-y:auto;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{font-size:16px;}
.modal-head button{background:none;border:none;font-size:20px;color:var(--ink-soft);line-height:1;}
.modal-body{padding:20px 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;}
.field input:focus,.field select:focus{outline:2px solid var(--gold-soft);border-color:var(--gold);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.modal-warn{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:8px;font-size:12.5px;margin-bottom:14px;}

.badge-sheet{font-size:10px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line);padding:2px 7px;border-radius:5px;}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#c7cbc5;border-radius:5px;}
.sidebar ::-webkit-scrollbar-thumb{background:#40496a;}

@media(max-width:880px){
  .shell.visible{flex-direction:column;}
  .sidebar{position:static;width:100%;height:auto;}
  .content{margin-left:0;}
  .sellers-block{max-height:220px;}
  .topbar{flex-wrap:wrap;}
  .topbar .meta-inline{flex:1 1 100%;max-width:100%;}
  .meta-hero-top{flex-wrap:wrap;}
}
</style>
</head>

/* =========================================================
   DIAGNÓSTICO DE ERROS — mostra qualquer erro em tela (em vez de
   falhar silenciosamente), para conseguirmos identificar a causa exata
   ========================================================= */
function showErrorToast(msg){
  const el = document.getElementById('errorToast');
  el.textContent = 'Erro: ' + msg + ' (tire um print e mande — isso ajuda a corrigir rápido)';
  el.style.display = 'block';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ el.style.display='none'; }, 9000);
}
window.addEventListener('error', e=>{ showErrorToast(e.message || 'erro desconhecido'); });
window.addEventListener('unhandledrejection', e=>{ showErrorToast((e.reason && e.reason.message) || String(e.reason)); });

   NÃO é mais uma senha comparada aqui no navegador). Sem sessão válida,
   o Supabase recusa qualquer leitura/escrita (ver RLS no schema).
   ========================================================= */
const SUPABASE_URL = "https://wtanyagjmgjedszivsfu.supabase.co";
const SUPABASE_KEY = "sb_publishable_DKWzJQhSx7qoKtOdY1x7cg_-kxwVnWh";

// Cliente oficial do Supabase — depois do login, ele próprio anexa o
// token da sessão autenticada a cada pedido (não é mais só a anon key).
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function sbGet(key){
  const { data, error } = await supa.from('app_state').select('value').eq('key', key).maybeSingle();
  if(error) throw error;
  return data ? data.value : undefined;
}
async function sbSet(key, value){
  const { error } = await supa.from('app_state').upsert({ key, value, updated_at: new Date().toISOString() });
  if(error) throw error;
}

// Dados de negócio: Supabase é a fonte única partilhada
const DB = {
  async get(key, fallback){
    try{
      const v = await sbGet(key);
      if(v!==undefined) return v;
      if(fallback!==undefined) await this.set(key, fallback); // primeira vez: semeia com os dados de exemplo
      return fallback;
    }catch(e){
      console.error('Supabase get falhou', key, e);
      showErrorToast('não consegui ler do Supabase ('+key+'): '+e.message);
      return fallback;
    }
  },
  async set(key, value){
    try{ await sbSet(key, value); }
    catch(e){
      console.error('Supabase set falhou', key, e);
      showErrorToast('não consegui gravar no Supabase ('+key+'): '+e.message);
    }
  }
};

/* Sessão de autenticação — quem está logado agora, e qual o papel dele
   (gestor/colaborador) e, se for colaborador, a qual vendedor pertence.
   Vem da tabela "profiles" (RLS: cada um só lê o próprio perfil), nunca
   de uma senha guardada no código ou nos dados. */
async function resolveProfile(){
  const { data: { session } } = await supa.auth.getSession();
  if(!session) return null;
  const { data, error } = await supa.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if(error || !data){
    console.error('Não encontrei perfil para este login', error);
    return null;
  }
  return { role: data.role, sellerId: data.seller_id, email: session.user.email, status: data.status || 'approved' };
}

};

   impõe isso; aqui só refletimos o mesmo recorte no que pedimos). */
async function loadState(){
  STATE.sellers = await DB.get('crm:sellers', SEED_DATA.sellers);

      const [sSales, sRecs, sFunil] = await Promise.all([
        DB.get('crm:sales:'+s.id, []),
        DB.get('crm:recurrences:'+s.id, []),
        DB.get('crm:funil:'+s.id, {})
      ]);
      STATE.sales.push(...sSales);
      STATE.recurrences.push(...sRecs);

/* Cada "parte" agora sabe sozinha em quais linhas gravar — nenhum dos
   30+ pontos do código que já chamam persist('sales')/persist('recurrences')
   precisou mudar. Um colaborador só tenta gravar a PRÓPRIA linha (é tudo
   que ele teria em STATE.sales/recurrences mesmo, já que loadState só
   carregou isso); o gestor grava a de todos os vendedores. */
async function persist(part, sellerId){
  if(part==='sellers'){
    // crm:sellers é partilhado e não guarda mais o funil de ninguém
    // (isso vive em crm:funil:<sellerId>, com RLS próprio por vendedor).
    await DB.set('crm:sellers', STATE.sellers.map(s=>{ const {funilDiario, ...rest} = s; return rest; }));
    return;
  }
  if(part==='services'){ await DB.set('crm:services', STATE.services); return; }
  if(part==='costs'){ await DB.set('crm:costs', STATE.costs); return; }
  if(part==='meta'){ await DB.set('crm:meta', STATE.meta); return; }
  if(part==='sales'){
    const ids = STATE.role==='gestor' ? STATE.sellers.map(s=>s.id) : [STATE.myOwnSellerId];
    for(const id of ids){ await DB.set('crm:sales:'+id, STATE.sales.filter(s=>s.vendedorId===id)); }
    return;
  }
  if(part==='recurrences'){
    const ids = STATE.role==='gestor' ? STATE.sellers.map(s=>s.id) : [STATE.myOwnSellerId];
    for(const id of ids){ await DB.set('crm:recurrences:'+id, STATE.recurrences.filter(r=>r.vendedorId===id)); }
    return;
  }
  if(part==='funil'){
    const id = sellerId || STATE.myOwnSellerId || STATE.selectedSellerId;
    const seller = sellerById(id);
    if(seller) await DB.set('crm:funil:'+id, seller.funilDiario||{});
    return;
  }
}

const MESES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const DIAS_SEMANA_PT = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
function daysInMonth(ym){ const [y,m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); }
function weekdayLabel(dateStr){ return DIAS_SEMANA_PT[new Date(dateStr+'T00:00:00').getDay()]; }

/* Soma as colunas do funil diário de um vendedor dentro do período informado —
   é isso que faz o preenchimento dia a dia "alimentar" as estatísticas gerais. */
function sumFunilDiario(seller, filter){
  const dias = seller.funilDiario || {};
  const out = { ligacoesFeitas:0, conversas:0, respondeu:0, consultaMarcada:0, leadsQualificados:0, vendasConsultaMarcada:0, reagendado:0, noShow:0, consultaRealizada:0, vendaForaConsulta:0, valorVenda:0, pagoNoDia:0 };
  Object.entries(dias).forEach(([date, d])=>{
    if(!inPeriodOrAll(date, filter)) return;
    Object.keys(out).forEach(k=>{ out[k] += Number(d[k])||0; });
  });
  out.fechamentos = out.vendasConsultaMarcada + out.vendaForaConsulta;
  return out;
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function monthLabel(key){ if(!key) return '—'; const [y,m] = key.split('-'); return `${MESES_PT[parseInt(m,10)-1]} de ${y}`; }
function fmtDateShort(d){ return d ? new Date(d+'T00:00:00').toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'}) : '—'; }

function periodRange(filter){
  if(filter.granularity==='month'){
    const [y,m] = filter.anchor.slice(0,7).split('-').map(Number);
    return { start: new Date(y, m-1, 1), end: new Date(y, m, 1) };
  }
  if(filter.granularity==='week'){
    const d = new Date(filter.anchor+'T00:00:00');
    const day = d.getDay();
    const diffToMonday = (day===0?6:day-1);
    const start = new Date(d); start.setDate(d.getDate()-diffToMonday);
    const end = new Date(start); end.setDate(start.getDate()+7);
    return { start, end };
  }
  const start = new Date(filter.anchor+'T00:00:00');
  const end = new Date(start); end.setDate(start.getDate()+1);
  return { start, end };
}
function periodLabelText(filter){
  if(filter.granularity==='all') return 'Total histórico (todos os períodos)';
  const {start,end} = periodRange(filter);
  if(filter.granularity==='month') return monthLabel(filter.anchor.slice(0,7));
  if(filter.granularity==='week'){
    const endIncl = new Date(end); endIncl.setDate(endIncl.getDate()-1);
    return `Semana de ${start.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})} a ${endIncl.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit'})}`;
  }
  return start.toLocaleDateString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function shiftPeriod(filter, dir){
  const anchor = filter.anchor;
  if(filter.granularity==='month'){
    let [y,m] = anchor.slice(0,7).split('-').map(Number);
    m += dir; if(m<1){m=12;y--;} if(m>12){m=1;y++;}
    return String(y)+'-'+String(m).padStart(2,'0');
  }
  const d = new Date(anchor+'T00:00:00');
  d.setDate(d.getDate() + (filter.granularity==='week' ? dir*7 : dir));
  return d.toISOString().slice(0,10);
}

/* Lista "achatada" de todo recebimento (vendas + entradas + parcelas pagas),
   cada um com a sua própria data — é o que permite filtrar por período. */
function buildEvents(){
  const events = [];
  STATE.sales.forEach(s=>{
    if(s.jaContabilizadoViaRecorrencia) return; // já entra pelo caixa da recorrência correspondente
    if((s.valorPago||0) > 0 && s.data){
      const frac = s.valorTotal>0 ? s.valorPago/s.valorTotal : 0;
      const ivaValor = (s.iva||0)*frac;
      const liquido = Math.max(0, s.valorPago - ivaValor);
      events.push({ date:s.data, valor:s.valorPago, comissao: liquido*taxaComissao(), ivaValor, txAdmValor:(s.txAdm||0)*frac, vendedorId:s.vendedorId, vendedorNome:s.vendedorNome, tipo:'Venda', cliente:s.cliente });
    }
  });
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    const rate = taxaComissao();
    const iva = taxaIva();
    if((r.valorEntrada||0) > 0 && r.dataVenda){
      const ivaValorEnt = r.valorEntrada*iva;
      const liquidoEnt = Math.max(0, r.valorEntrada - ivaValorEnt);
      events.push({ date:r.dataVenda, valor:r.valorEntrada, comissao: liquidoEnt*rate, ivaValor:ivaValorEnt, txAdmValor:0, vendedorId:r.vendedorId, vendedorNome:r.vendedorNome, tipo:'Entrada', cliente:r.cliente });
    }
    const txAdmPorParcela = (r.isentoTaxaAdm || st.total<=0) ? 0 : (r.txAdm||0)/st.total;
    r.parcelas.forEach(p=>{
      if(p.pago && p.data){ // sem data confirmada, não entra em nenhum mês — ver "Sem data de pagamento"
        const ivaValorParc = st.valorParcela*iva;
        const liquido = st.valorParcela - ivaValorParc - txAdmPorParcela;
        events.push({ date: p.data, valor: st.valorParcela, comissao: Math.max(0,liquido)*rate, ivaValor:ivaValorParc, txAdmValor:txAdmPorParcela, vendedorId:r.vendedorId, vendedorNome:r.vendedorNome, tipo:'Parcela '+p.numero, cliente:r.cliente });
      }
    });
  });
  return events;
}
function eventsInPeriod(events, filter){
  const {start,end} = periodRange(filter);
  return events.filter(e=>{
    if(!e.date) return false;
    const d = new Date(e.date+'T00:00:00');
    return d>=start && d<end;
  });
}
/* mês em que a última parcela de uma recorrência quitada foi paga */
function finalizacaoMes(rec){
  const datas = rec.parcelas.filter(p=>p.pago && p.data).map(p=>p.data).sort();
  if(datas.length) return datas[datas.length-1].slice(0,7);
  return rec.dataVenda ? rec.dataVenda.slice(0,7) : null;
}

function activeSellers(){ return STATE.sellers.filter(s=>s.ativo); }
function serviceByName(nome){
  if(!nome) return null;
  const n = nome.trim().toUpperCase();
  return STATE.services.find(s=>s.nome.trim().toUpperCase()===n) || null;
}

function recStatus(rec){
  const total = rec.nParcelas || rec.parcelas.length || 1;
  const entrada = rec.valorEntrada||0;
  const restante = Math.max(0, rec.valorContrato - entrada);
  const valorParcela = total>0 ? restante/total : 0;
  const pagas = rec.parcelas.filter(p=>p.pago).length;
  const valorPagoParcelas = pagas*valorParcela;
  const valorPago = entrada + valorPagoParcelas;
  const valorPendente = Math.max(0, rec.valorContrato - valorPago);
  return { valorParcela, pagas, total, valorPago, valorPendente, quitada: valorPendente<=0.005, entrada };
}
/* "Atrasada" = ainda não quitada e já passou mais de 30 dias desde a venda.
   A planilha não guarda data de vencimento por parcela, então esta é uma
   estimativa razoável (não uma data de vencimento contratual exata). */
const DIAS_TOLERANCIA_ATRASO = 30;
function diasAtraso(rec){
  const st = recStatus(rec);
  if(st.quitada) return 0;
  const inicio = new Date(rec.dataVenda+'T00:00:00');
  const hoje = new Date(todayISO()+'T00:00:00');
  const dias = Math.floor((hoje - inicio) / 86400000);
  return dias > DIAS_TOLERANCIA_ATRASO ? dias : 0;
}
function recorrenciasAtrasadas(){
  return STATE.recurrences.filter(r=>diasAtraso(r) > 0).sort((a,b)=>diasAtraso(b)-diasAtraso(a));
}
function saleStatus(sale){
  const valorPendente = Math.max(0, (sale.valorTotal||0) - (sale.valorPago||0));
  return { valorPendente, quitada: sale.pagamentoIntegral || valorPendente<=0.005 };
}
function taxaComissao(){ return STATE.meta.taxaComissao!=null ? STATE.meta.taxaComissao : 0.10; }
function taxaIva(){ return STATE.meta.taxaIvaPadrao!=null ? STATE.meta.taxaIvaPadrao : 0.23; }

/* ---------------------------------------------------------------
   COMISSÃO — regra de negócio (revisada):
   O IVA descontado NUNCA é um percentual fixo sobre o valor recebido —
   vem do valor de IVA já configurado para aquele serviço específico no
   Catálogo de Serviços (Configurações), guardado em cada venda/recorrência
   no momento da venda, e é descontado proporcionalmente ao quanto foi
   efetivamente pago (para pagamentos parciais).
   1) Venda integral (avulsa, sem recorrência): retira-se o IVA do
      serviço (proporcional ao pago), e a comissão é a taxa de comissão
      sobre o que sobra.
   2) Entrada de uma recorrência: mesma regra da venda integral —
      só desconta o IVA do serviço (proporcional à entrada), comissão
      sobre o líquido.
   3) Parcelas de uma recorrência (marcadas manualmente como pagas):
      desconta o IVA do serviço (proporcional à parcela) E a fatia
      diluída da taxa administrativa do contrato (taxa administrativa
      total ÷ nº de parcelas), e a comissão é a taxa de comissão sobre
      o que sobra.
   --------------------------------------------------------------- */
function comissaoSale(sale){
  const valorPago = sale.valorPago||0;
  const frac = sale.valorTotal>0 ? valorPago/sale.valorTotal : 0;
  const ivaReal = (sale.iva||0)*frac;
  const liquido = Math.max(0, valorPago - ivaReal);
  return liquido * taxaComissao();
}
function comissaoRecorrencia(rec){
  const st = recStatus(rec);
  const rate = taxaComissao();
  const iva = taxaIva();
  let total = 0;
  if(rec.valorEntrada > 0){
    const ivaReal = rec.valorEntrada*iva;
    total += Math.max(0, rec.valorEntrada - ivaReal) * rate;
  }
  const txAdmPorParcela = (rec.isentoTaxaAdm || st.total<=0) ? 0 : (rec.txAdm||0) / st.total;
  rec.parcelas.forEach(p=>{
    if(p.pago){
      const ivaReal = st.valorParcela*iva;
      const liquido = st.valorParcela - ivaReal - txAdmPorParcela;
      total += Math.max(0, liquido) * rate;
    }
  });
  return total;
}

function computeSellerStats(sellerId, filter){
  filter = filter || {granularity:'all'};
  const events = buildEvents().filter(e=>e.vendedorId===sellerId && inPeriodOrAll(e.date, filter));
  const valorFaturado = events.reduce((a,e)=>a+e.valor,0);
  const comissao = events.reduce((a,e)=>a+e.comissao,0);

  const sales = STATE.sales.filter(s=>s.vendedorId===sellerId && inPeriodOrAll(s.data, filter));
  const recs = STATE.recurrences.filter(r=>r.vendedorId===sellerId && inPeriodOrAll(r.dataVenda, filter));
  let valorPendente=0, deals=0;
  // idem: vendas já contabilizadas via recorrência não somam pendente nem
  // contam como negócio à parte — é a mesma recorrência, já contada abaixo.
  sales.filter(s=>!s.jaContabilizadoViaRecorrencia).forEach(s=>{ valorPendente+=saleStatus(s).valorPendente; deals++; });
  recs.forEach(r=>{ valorPendente+=recStatus(r).valorPendente; deals++; });
  // "Valor vendido" = tudo que o vendedor gerou no período, recorrência ou não:
  // vendas integrais (excluindo as que só existem pra "espelhar" uma recorrência,
  // senão contaria o mesmo contrato duas vezes) + o valor de contrato de TODA
  // recorrência (mesmo as criadas direto no sistema, sem venda espelhada).
  const valorVendido = sales.filter(s=>!s.jaContabilizadoViaRecorrencia).reduce((a,s)=>a+(s.valorTotal||0),0)
                      + recs.reduce((a,r)=>a+(r.valorContrato||0),0);
  const seller = sellerById(sellerId) || {};
  const funil = sumFunilDiario(seller, filter);
  const temFunilDiario = Object.keys(seller.funilDiario||{}).length > 0;
  const conversas = temFunilDiario ? funil.conversas : (seller.conversasIniciadas||0);
  const novosContatos = temFunilDiario ? funil.leadsQualificados : (seller.novosContatos||0);
  const fechamentosManual = seller.fechamentosManual||0;
  const taxaConversao = conversas>0 ? (fechamentosManual||deals)/conversas : null;
  return {
    valorFaturado, valorPendente, comissao, deals, valorVendido,
    ticketMedio: deals>0 ? valorFaturado/deals : 0,
    conversas, novosContatos, fechamentosManual, taxaConversao, funil, temFunilDiario,
    recorrenciaAtiva: recs.filter(r=>!recStatus(r).quitada).reduce((a,r)=>a+recStatus(r).valorPendente,0),
    nSales: sales.length, nRecs: recs.length
  };
}

function computeGlobal(){
  let valorFaturado=0, valorPendente=0, recorrenciaAtivaValor=0, conversas=0, fechamentos=0;
  STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia).forEach(s=>{ valorFaturado+=s.valorPago||0; valorPendente+=saleStatus(s).valorPendente; });
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    valorFaturado+=st.valorPago; valorPendente+=st.valorPendente;
    if(!st.quitada) recorrenciaAtivaValor += st.valorPendente;
  });
  activeSellers().forEach(s=>{ conversas += s.conversasIniciadas||0; });
  fechamentos = STATE.sales.length + STATE.recurrences.length;
  const taxaConversao = conversas>0 ? fechamentos/conversas : null;
  const meta = STATE.meta.valorMeta || 0;
  return {
    valorFaturado, valorPendente, recorrenciaAtivaValor, taxaConversao, fechamentos, conversas,
    metaPct: meta>0 ? valorFaturado/meta : 0,
    metaRestante: Math.max(0, meta - valorFaturado)
  };
}

/* Mesmas 4 métricas do topo, mas escopadas a um período (mês/semana/dia) —
   usa a data de origem da venda/recorrência para decidir o que entra. */
function computeGlobalForPeriod(filter){
  const salesIn = STATE.sales.filter(s=>inPeriodOrAll(s.data, filter));
  const recsIn = STATE.recurrences.filter(r=>inPeriodOrAll(r.dataVenda, filter));
  let valorPendente=0, recorrenciaAtivaValor=0;
  // vendas marcadas jaContabilizadoViaRecorrencia são o MESMO negócio de uma
  // recorrência (a entrada dela) — contar o pendente das duas ao mesmo tempo
  // duplicava o valor. Só a recorrência entra no pendente nesses casos.
  salesIn.filter(s=>!s.jaContabilizadoViaRecorrencia).forEach(s=>{ valorPendente += saleStatus(s).valorPendente; });
  recsIn.forEach(r=>{
    const st = recStatus(r);
    valorPendente += st.valorPendente;
    if(!st.quitada) recorrenciaAtivaValor += st.valorPendente;
  });
  const valorFaturado = buildEvents().filter(e=>inPeriodOrAll(e.date, filter)).reduce((a,e)=>a+e.valor,0);
  // "Valor vendido" = tudo que foi gerado no período: vendas integrais
  // (excluindo as que só espelham uma recorrência, senão duplicaria) + o
  // valor de contrato de TODA recorrência, mesmo as sem venda espelhada.
  const valorVendido = salesIn.filter(s=>!s.jaContabilizadoViaRecorrencia).reduce((a,s)=>a+(s.valorTotal||0),0)
                      + recsIn.reduce((a,r)=>a+(r.valorContrato||0),0);
  const fechamentos = salesIn.length + recsIn.length;
  let conversas = 0;
  activeSellers().forEach(s=>{ conversas += sumFunilDiario(s, filter).conversas || s.conversasIniciadas||0; });
  const taxaConversao = conversas>0 ? fechamentos/conversas : null;
  const meta = STATE.meta.valorMeta || 0;
  return {
    valorFaturado, valorVendido, valorPendente, recorrenciaAtivaValor, taxaConversao, fechamentos, conversas,
    nRecsAbertas: recsIn.filter(r=>!recStatus(r).quitada).length,
    metaPct: meta>0 ? valorVendido/meta : 0,
    metaRestante: Math.max(0, meta - valorVendido)
  };
}

function inPeriodOrAll(dateStr, filter){
  if(!filter || filter.granularity==='all') return true;
  if(!dateStr) return false;
  const {start,end} = periodRange(filter);
  const d = new Date(dateStr+'T00:00:00');
  return d>=start && d<end;
}
function computeTaxes(filter){
  const events = buildEvents().filter(e=>inPeriodOrAll(e.date, filter));
  const ivaDevido = events.reduce((a,e)=>a+e.ivaValor,0);
  const txAdmDevido = events.reduce((a,e)=>a+e.txAdmValor,0);
  return { ivaDevido, txAdmDevido, total: ivaDevido+txAdmDevido, events };
}
function normNomeCusto(s){ return (s||'').trim().toUpperCase(); }

/* Projeta um custo fixo pro mês informado, usando o vencimento mais recente
   conhecido — é isso que faz um custo fixo "repetir" todo mês sem precisar
   ser relançado. Se já existir um lançamento com vencimento EXATO nesse mês
   (nome igual), esse lançamento manda — permite ajustar o valor de um mês
   específico sem mexer nos demais. Custos variáveis nunca repetem: só contam
   no mês exato do vencimento (por isso "zeram" a cada mês novo). */
function custosFixosDoMes(monthKey){
  const porNome = new Map();
  STATE.costs.forEach(c=>{
    if(c.categoria!=='FIXO' || !c.vencimento) return;
    const k = normNomeCusto(c.nome);
    if(!porNome.has(k)) porNome.set(k, []);
    porNome.get(k).push(c);
  });
  const out = [];
  porNome.forEach(arr=>{
    arr.sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
    const exato = arr.find(c=>c.vencimento.slice(0,7)===monthKey);
    if(exato){ out.push(Object.assign({}, exato, { _dataPagamento: exato.pago ? (exato.dataPagamento||exato.vencimento) : null })); return; }
    const anteriores = arr.filter(c=>c.vencimento.slice(0,7) < monthKey);
    if(anteriores.length){
      const base = anteriores[anteriores.length-1];
      const pago = costPagoNoMes(base, monthKey);
      out.push(Object.assign({}, base, {
        vencimento: projetarVencimentoNoMes(base.vencimento, monthKey),
        pago,
        _dataPagamento: pago ? custoDataPagamentoNoMes(base, monthKey) : null,
        _projetado: true
      }));
    }
  });
  return out;
}
function projetarVencimentoNoMes(vencimentoOriginal, monthKey){
  const dia = Math.min(Number(vencimentoOriginal.slice(8,10)), daysInMonth(monthKey));
  return `${monthKey}-${String(dia).padStart(2,'0')}`;
}
function costPagoNoMes(cost, monthKey){
  const registo = cost.pagoPorMes && cost.pagoPorMes[monthKey];
  if(registo==null) return false; // custo fixo projetado começa pendente em cada mês novo
  return typeof registo==='object' ? !!registo.pago : !!registo;
}
function custoDataPagamentoNoMes(cost, monthKey){
  const registo = cost.pagoPorMes && cost.pagoPorMes[monthKey];
  if(registo && typeof registo==='object' && registo.data) return registo.data;
  return projetarVencimentoNoMes(cost.vencimento, monthKey); // pago antigo sem data registada — usa o vencimento como aproximação
}
/* Custos fixos do mês atual, vencidos e ainda pendentes — mostrados como
   aviso na Visão Geral, com botão de pagar ali mesmo. */
function custosFixosAtrasados(){
  const hoje = todayISO();
  return custosFixosDoMes(hoje.slice(0,7)).filter(c=>!c.pago && c.vencimento && c.vencimento < hoje);
}
function diasAtrasoCusto(c){
  const d1 = new Date(c.vencimento+'T00:00:00'), d2 = new Date(todayISO()+'T00:00:00');
  return Math.round((d2-d1)/86400000);
}

function computeCosts(filter){
  let list;
  if(filter && filter.granularity==='month'){
    const monthKey = filter.anchor.slice(0,7);
    const variaveisDoMes = STATE.costs.filter(c=>c.categoria==='VARIÁVEL' && c.vencimento && c.vencimento.slice(0,7)===monthKey);
    list = [...custosFixosDoMes(monthKey), ...variaveisDoMes];
  } else {
    list = STATE.costs.filter(c=>inPeriodOrAll(c.vencimento, filter));
  }
  const fixos = list.filter(c=>c.categoria==='FIXO');
  const variaveis = list.filter(c=>c.categoria==='VARIÁVEL');
  const sum = arr=>arr.reduce((a,c)=>a+(c.valor||0),0);
  const sumPago = arr=>arr.filter(c=>c.pago).reduce((a,c)=>a+(c.valor||0),0);
  return { list, fixos, variaveis, totalFixos: sum(fixos), totalVariaveis: sum(variaveis), total: sum(list), totalPago: sumPago(list) };
}
function computeLucro(filter){
  const events = buildEvents().filter(e=>inPeriodOrAll(e.date, filter));
  const recebido = events.reduce((a,e)=>a+e.valor,0);
  const tax = computeTaxes(filter);
  const costs = computeCosts(filter);
  return recebido - tax.total - costs.totalPago;
}


function ranking(filter){
  return activeSellers().map(s=>({ seller:s, stats: computeSellerStats(s.id, filter) })).sort((a,b)=>b.stats.valorFaturado - a.stats.valorFaturado);
}

/* Detalhamento do "Valor Vendido": quanto veio de vendas pagas à vista
   (integrais) x quanto veio de recorrências (contratado), e quantas
   parcelas de recorrência já foram pagas x quantas ainda estão em aberto —
   sellerId null = todos os vendedores. */
function computeVendasBreakdown(filter, sellerId){
  const salesIn = STATE.sales.filter(s=> (!sellerId || s.vendedorId===sellerId) && inPeriodOrAll(s.data, filter));
  const recsIn = STATE.recurrences.filter(r=> (!sellerId || r.vendedorId===sellerId) && inPeriodOrAll(r.dataVenda, filter));
  const integrais = salesIn.filter(s=>s.pagamentoIntegral);
  const valorIntegrais = integrais.reduce((a,s)=>a+(s.valorTotal||0),0);
  const valorRecorrencias = recsIn.reduce((a,r)=>a+(r.valorContrato||0),0);
  let parcelasPagas=0, parcelasAbertas=0;
  recsIn.forEach(r=>{ r.parcelas.forEach(p=>{ p.pago ? parcelasPagas++ : parcelasAbertas++; }); });
  return { nIntegrais: integrais.length, valorIntegrais, nRecorrencias: recsIn.length, valorRecorrencias, parcelasPagas, parcelasAbertas };
}
function renderVendasSubcards(filter, sellerId){
  const b = computeVendasBreakdown(filter, sellerId);
  return `
  <div class="cards" style="margin-top:-10px;">
    <div class="card"><div class="lbl">Vendas integrais (pagas à vista)</div><div class="val">${fmtEUR(b.valorIntegrais)}</div><div class="sub">${b.nIntegrais} venda(s)</div></div>
    <div class="card"><div class="lbl">Vendas recorrentes (contratado)</div><div class="val">${fmtEUR(b.valorRecorrencias)}</div><div class="sub">${b.nRecorrencias} contrato(s)</div></div>
    <div class="card"><div class="lbl">Parcelas pagas</div><div class="val good">${b.parcelasPagas}</div><div class="sub">de recorrências no período</div></div>
    <div class="card"><div class="lbl">Parcelas em aberto</div><div class="val bad">${b.parcelasAbertas}</div><div class="sub">ainda não pagas</div></div>
  </div>`;
}

/* Linha a linha de tudo que compõe a comissão de um vendedor no período —
   mesma matemática de comissaoSale/comissaoRecorrencia, calculada de novo
   aqui pra mostrar exatamente quanto foi descontado de cada recebimento. */
function comissaoBreakdownEvents(sellerId, filter){
  const rate = taxaComissao();
  const iva = taxaIva();
  const linhas = [];
  STATE.sales.filter(s=>s.vendedorId===sellerId && !s.jaContabilizadoViaRecorrencia && (s.valorPago||0)>0 && s.data && inPeriodOrAll(s.data, filter)).forEach(s=>{
    const frac = s.valorTotal>0 ? s.valorPago/s.valorTotal : 0;
    const ivaDesc = (s.iva||0)*frac;
    const liquido = Math.max(0, s.valorPago - ivaDesc);
    linhas.push({ date:s.data, cliente:s.cliente, tipo:'Venda', recebido:s.valorPago, ivaDesc, txAdmDesc:0, liquido, comissao: liquido*rate });
  });
  STATE.recurrences.filter(r=>r.vendedorId===sellerId && inPeriodOrAll(r.dataVenda, filter)).forEach(r=>{
    const st = recStatus(r);
    if((r.valorEntrada||0)>0){
      const ivaDesc = r.valorEntrada*iva;
      const liquido = Math.max(0, r.valorEntrada - ivaDesc);
      linhas.push({ date:r.dataVenda, cliente:r.cliente, tipo:'Entrada', recebido:r.valorEntrada, ivaDesc, txAdmDesc:0, liquido, comissao: liquido*rate });
    }
    const txAdmPorParcela = (r.isentoTaxaAdm || st.total<=0) ? 0 : (r.txAdm||0)/st.total;
    r.parcelas.forEach(p=>{
      if(p.pago && p.data){
        const ivaDesc = st.valorParcela*iva;
        const liquido = Math.max(0, st.valorParcela - ivaDesc - txAdmPorParcela);
        linhas.push({ date: p.data, cliente:r.cliente, tipo:'Parcela '+p.numero+(r.isentoTaxaAdm?' (isento tx. adm.)':''), recebido: st.valorParcela, ivaDesc, txAdmDesc:txAdmPorParcela, liquido, comissao: liquido*rate });
      }
    });
  });
  return linhas.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function abrirComissaoDetalhe(sellerId, filter){
  const seller = sellerById(sellerId);
  const linhas = comissaoBreakdownEvents(sellerId, filter);
  const totalRecebido = linhas.reduce((a,l)=>a+l.recebido,0);
  const totalComissao = linhas.reduce((a,l)=>a+l.comissao,0);
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal" style="max-width:860px;">
    <div class="modal-head"><h3>Como a comissão de ${seller?seller.nome:'—'} foi calculada</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field-hint" style="margin-bottom:14px;">
        <strong>Venda integral (avulsa, paga de uma vez):</strong> desconta-se o IVA real daquele serviço (Configurações → Catálogo de serviços) do valor recebido — a comissão é ${fmtPct(taxaComissao())} sobre o que sobra.<br>
        <strong>Entrada ou parcela de recorrência:</strong> desconta-se ${fmtPct(taxaIva())} <em>sobre o valor pago naquele momento</em> (cada pagamento paga o seu próprio IVA, não é uma fatia do IVA total do contrato). Nas parcelas, desconta-se também a fatia da taxa administrativa do contrato (dividida pelo nº de parcelas) — a menos que o contrato esteja marcado como isento. A comissão é ${fmtPct(taxaComissao())} sobre o que sobra.

function renderLoginScreen(mode, extra){
  mode = mode || 'signin';
  const card = document.getElementById('loginCard');
  document.getElementById('shell').classList.remove('visible');
  document.getElementById('loginScreen').classList.add('visible');

  if(mode==='signin'){
    card.innerHTML = `
      <h2>Entrar no painel</h2>
      <p class="sub">Inicie sessão com o e-mail e a senha da sua conta.</p>
      <div class="field"><label>E-mail</label><input type="email" id="loginEmail" placeholder="voce@exemplo.com" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="Digite a senha" autocomplete="current-password"></div>
      <div id="loginError" style="color:var(--bad);font-size:12.5px;margin:-6px 0 12px;display:none;"></div>
      <button class="btn gold" id="btnLogin" style="width:100%;justify-content:center;">Entrar</button>
      <p class="sub" style="margin-top:14px;font-size:11.5px;">Não tem conta? <a href="#" id="linkPedirAcesso">Peça acesso aqui</a>.</p>
    `;
    const emailInput = document.getElementById('loginEmail');
    const passInput = document.getElementById('loginPass');
    const errBox = document.getElementById('loginError');
    const btnLogin = document.getElementById('btnLogin');
    const tryEnter = async ()=>{
      errBox.style.display = 'none';
      btnLogin.disabled = true; btnLogin.textContent = 'A entrar…';
      const { data, error } = await supa.auth.signInWithPassword({
        email: emailInput.value.trim(), password: passInput.value
      });
      if(error || !data.session){
        errBox.textContent = 'E-mail ou senha incorretos.';
        errBox.style.display = 'block';
        btnLogin.disabled = false; btnLogin.textContent = 'Entrar';
        passInput.value = ''; passInput.focus();
        return;
      }
      const profile = await resolveProfile();
      if(!profile){
        errBox.textContent = 'Login válido, mas sem perfil configurado — peça ao gestor para o adicionar em "profiles".';
        errBox.style.display = 'block';
        btnLogin.disabled = false; btnLogin.textContent = 'Entrar';
        await supa.auth.signOut();
        return;
      }
      if(profile.status==='pending'){ await supa.auth.signOut(); renderLoginScreen('pending'); return; }
      if(profile.status==='rejected'){ await supa.auth.signOut(); renderLoginScreen('rejected'); return; }
      STATE.role = profile.role;
      STATE.myOwnSellerId = profile.sellerId;
      STATE.myEmail = profile.email;
      await bootAfterLogin();
    };
    btnLogin.onclick = tryEnter;
    [emailInput, passInput].forEach(el=> el.addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); }));
    document.getElementById('linkPedirAcesso').onclick = (e)=>{ e.preventDefault(); renderLoginScreen('signup'); };
    emailInput.focus();

  } else if(mode==='signup'){
    card.innerHTML = `
      <h2>Pedir acesso</h2>
      <p class="sub">Preencha os seus dados. Sua conta fica <strong>pendente</strong> até o gestor aprovar — você só consegue entrar depois disso.</p>
      <div class="field"><label>Nome</label><input type="text" id="suNome" placeholder="O seu nome"></div>
      <div class="field"><label>E-mail</label><input type="email" id="suEmail" placeholder="voce@exemplo.com" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input type="password" id="suSenha" placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div>
      <div class="field"><label>Confirmar senha</label><input type="password" id="suSenha2" placeholder="Repita a senha" autocomplete="new-password"></div>
      <div id="suError" style="color:var(--bad);font-size:12.5px;margin:-6px 0 12px;display:none;"></div>
      <button class="btn gold" id="btnSignup" style="width:100%;justify-content:center;">Pedir acesso</button>
      <p class="sub" style="margin-top:14px;font-size:11.5px;"><a href="#" id="linkVoltarLogin">&larr; Voltar para o login</a></p>
    `;
    document.getElementById('linkVoltarLogin').onclick = (e)=>{ e.preventDefault(); renderLoginScreen('signin'); };
    document.getElementById('btnSignup').onclick = async ()=>{
      const errBox = document.getElementById('suError');
      errBox.style.display = 'none';
      const nome = document.getElementById('suNome').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const senha = document.getElementById('suSenha').value;
      const senha2 = document.getElementById('suSenha2').value;
      if(!nome || !email || !senha){ errBox.textContent = 'Preencha todos os campos.'; errBox.style.display='block'; return; }
      if(senha.length < 6){ errBox.textContent = 'A senha precisa de pelo menos 6 caracteres.'; errBox.style.display='block'; return; }
      if(senha !== senha2){ errBox.textContent = 'As senhas não coincidem.'; errBox.style.display='block'; return; }
      const btn = document.getElementById('btnSignup');
      btn.disabled = true; btn.textContent = 'A enviar…';
      const { data, error } = await supa.auth.signUp({ email, password: senha });
      if(error || !data.user){
        errBox.textContent = error && error.message==='User already registered' ? 'Já existe uma conta com este e-mail.' : (error ? error.message : 'Não consegui criar a conta.');
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Pedir acesso';
        return;
      }
      if(!data.session){
        // Projeto exige confirmação por e-mail — o pedido não pode ficar
        // pendente do lado do gestor até essa confirmação acontecer.
        errBox.textContent = 'Conta criada, mas este projeto exige confirmar o e-mail antes de continuar — confirme e depois tente entrar normalmente. Se você é o gestor, desligue "Confirm email" em Authentication → Providers no Supabase pra evitar isso no futuro.';
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Pedir acesso';
        return;
      }
      const { error: profErr } = await supa.from('profiles').insert({ id: data.user.id, nome, email, status:'pending' });
      await supa.auth.signOut();
      if(profErr){
        errBox.textContent = 'A conta foi criada, mas não consegui registar o pedido — avise o gestor: ' + profErr.message;
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Pedir acesso';
        return;
      }
      renderLoginScreen('pending');
    };
    document.getElementById('suNome').focus();

  } else if(mode==='pending'){
    card.innerHTML = `
      <h2>Pedido enviado</h2>
      <p class="sub">O seu acesso está <strong>a aguardar aprovação do gestor</strong>. Assim que for aprovado, você já consegue entrar com o e-mail e a senha que definiu.</p>
      <button class="btn ghost" id="btnVoltarLogin2" style="width:100%;justify-content:center;">&larr; Voltar para o login</button>
    `;
    document.getElementById('btnVoltarLogin2').onclick = ()=> renderLoginScreen('signin');

  } else if(mode==='rejected'){
    card.innerHTML = `
      <h2>Acesso não aprovado</h2>
      <p class="sub">O seu pedido de acesso não foi aprovado. Fale diretamente com o gestor do escritório.</p>
      <button class="btn ghost" id="btnVoltarLogin3" style="width:100%;justify-content:center;">&larr; Voltar para o login</button>
    `;
    document.getElementById('btnVoltarLogin3').onclick = ()=> renderLoginScreen('signin');
  }
}
/* Roda as migracoes de dados uma vez so - so o gestor tem permissao de
   escrita ampla o suficiente pra elas; um colaborador simplesmente pula
   esta parte e vai direto para os proprios dados. */
async function runGestorMigrationsIfNeeded(){
  if(STATE.role!=='gestor') return;
  await applyHistoricalImport();
  await applyDedupSalesVsRecurrences();
  await applyJulhoUpdate();
  await applyLarissaIndividualJuly();
  await applyReconciliacaoMaioJunho2026();
  await applyDedupCustos2026();
  await applyCorrigeEntradaRecorrencias2026();
  await applyFormaPagamentoRecorrencias2026();
  await applyRemoveStaleLeandroRecorrencia();
  await applyReconciliacaoJulho2026v2();
  await applyReconciliacaoJulho2026v3();
}
async function loadAccessRequests(){
  if(STATE.role!=='gestor'){ STATE.accessRequests = []; return; }
  const { data, error } = await supa.from('profiles').select('*').eq('status','pending').order('created_at');
  if(error){ console.error('Não consegui carregar pedidos de acesso', error); STATE.accessRequests = []; return; }
  STATE.accessRequests = data || [];
}
async function bootAfterLogin(){
  await loadState();
  await runGestorMigrationsIfNeeded();
  await loadAccessRequests();
  await loadAlertaDismissido();
  startLiveDateWatcher();
  enterApp();
}
/* Mantém o sistema "vivo": se a aba ficar aberta e a data virar (meia-noite,
   troca de mês), os filtros que estavam acompanhando "hoje"/"este mês"
   avançam sozinhos, sem precisar recarregar a página. Só avança um filtro
   se ele ainda estava no dia/mês antigo — se o utilizador tiver navegado
   manualmente para outro período, isso não é mexido. */
let _liveWatcherStarted = false;
function startLiveDateWatcher(){
  if(_liveWatcherStarted) return;
  _liveWatcherStarted = true;
  let lastToday = todayISO();
  setInterval(()=>{
    const nowToday = todayISO();
    if(nowToday===lastToday) return;
    const lastMonth = lastToday.slice(0,7), nowMonth = nowToday.slice(0,7);
    if(STATE.periodFilter.anchor===lastMonth) STATE.periodFilter.anchor = nowMonth;
    if(STATE.financeiroFilter.anchor===lastMonth) STATE.financeiroFilter.anchor = nowMonth;
    if(STATE.clientesFilter.anchor===lastMonth) STATE.clientesFilter.anchor = nowMonth;
    if(STATE.salesFilter.anchor===lastToday) STATE.salesFilter.anchor = nowToday;
    if(STATE.extratoData===lastToday) STATE.extratoData = nowToday;
    lastToday = nowToday;
    if(STATE.role) renderAll();
  }, 60000);
}
function enterApp(){
  document.getElementById('loginScreen').classList.remove('visible');
  document.getElementById('shell').classList.add('visible');
  STATE.view = STATE.role==='colaborador' ? 'my-panel' : 'overview';
  renderAll();
}

function renderPeriodActivity(){
  const events = buildEvents();
  const filtered = eventsInPeriod(events, STATE.periodFilter).sort((a,b)=> b.date.localeCompare(a.date));
  const total = filtered.reduce((a,e)=>a+e.valor,0);
  const comissaoTotal = filtered.reduce((a,e)=>a+e.comissao,0);
  const n = filtered.length;
  const ticket = n>0 ? total/n : 0;
  const shown = STATE.expandAtividade ? filtered : filtered.slice(0,5);
  return `
  <section class="block">
    <div class="block-head"><h3>Atividade em ${periodLabelText(STATE.periodFilter)}</h3><span class="hint">vendas, entradas e parcelas recebidas nesse período</span></div>

/* Efetuar pagamento de uma recorrência direto da Visão Geral, sem precisar
   ir até Recorrências achar o cliente. Marca a(s) parcela(s) escolhida(s)
   como pagas, com a data informada — como é o MESMO campo `parcelas` que
   alimenta Financeiro (impostos), comissão e faturamento em todo o resto do
   sistema, não precisa de nenhuma conexão extra: o lançamento já aparece em
   tudo automaticamente assim que salva. */
function abrirPagamentoRecorrenciaModal(recId){
  const rec = STATE.recurrences.find(r=>r.id===recId);
  if(!rec) return;
  const st = recStatus(rec);
  const pendentes = rec.parcelas.filter(p=>!p.pago);
  const hoje = todayISO();
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal">
    <div class="modal-head"><h3>Efetuar pagamento — ${rec.cliente}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field-hint" style="margin-bottom:14px;">Pendente total: <strong>${fmtEUR(st.valorPendente)}</strong> · valor de cada parcela: <strong>${fmtEUR(st.valorParcela)}</strong> · vendedor: <strong>${rec.vendedorNome||'—'}</strong></div>
      ${pendentes.length ? `
      <div class="field"><label>Parcela(s) a marcar como paga(s)</label>
        ${pendentes.map(p=>`
          <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <input type="checkbox" class="pgParcelaChk" value="${p.numero}" ${p.numero===pendentes[0].numero?'checked':''}> Parcela ${p.numero} — ${fmtEUR(st.valorParcela)}
          </label>`).join('')}
      </div>
      <div class="field"><label>Data do pagamento</label><input type="date" id="pgData" value="${hoje}"></div>
      ` : `<div class="empty">Sem parcelas pendentes — este contrato já está quitado.</div>`}
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave" ${!pendentes.length?'disabled':''}>Confirmar pagamento</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  const btnSave = document.getElementById('mSave');
  if(btnSave) btnSave.onclick = async ()=>{
    const data = document.getElementById('pgData').value || hoje;
    const selecionadas = Array.from(document.querySelectorAll('.pgParcelaChk:checked')).map(el=>Number(el.value));
    if(!selecionadas.length){ alert('Selecione ao menos uma parcela.'); return; }
    rec.parcelas.forEach(p=>{ if(selecionadas.includes(p.numero)){ p.pago = true; p.data = data; } });
    await persist('recurrences');
    closeModal();
    renderAll();
  };
}

/* Gráfico de linhas simples em SVG puro, sem biblioteca — usado tanto na
   evolução de entradas x saídas quanto no percentual de vendas por
   vendedor ao longo do tempo. */
let _chartIdSeq = 0;
function svgMultiLineChart(months, series){
  if(!months.length) return `<div class="empty">Sem dados ainda.</div>`;
  const chartId = 'lc'+(_chartIdSeq++);
  const W = 640, H = 220, padL = 40, padR = 14, padT = 14, padB = 26;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const baseline = padT+innerH;
  const allVals = series.flatMap(s=>months.map(m=>s.values[m]||0));
  const maxV = Math.max(...allVals, 1);
  const x = i => padL + (months.length<=1?innerW/2:(i/(months.length-1))*innerW);
  const y = v => padT + innerH - (maxV>0 ? (v/maxV)*innerH : 0);
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const yy = padT+innerH-f*innerH;
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1"/>`;
  }).join('');
  const defs = `<defs>${series.map((s,i)=>`
    <linearGradient id="${chartId}-g${i}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${s.color}" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="${s.color}" stop-opacity="0.02"/>
    </linearGradient>`).join('')}</defs>`;
  const areasSvg = series.map((s,i)=>{
    const linePts = months.map((m,idx)=>`${x(idx)},${y(s.values[m]||0)}`).join(' L ');
    return `<path d="M ${x(0)},${baseline} L ${linePts} L ${x(months.length-1)},${baseline} Z" fill="url(#${chartId}-g${i})" stroke="none"/>`;
  }).join('');
  const linesSvg = series.map(s=>{
    const pts = months.map((m,i)=>`${x(i)},${y(s.values[m]||0)}`).join(' ');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5"/>`;
  }).join('');
  const dotsSvg = series.map(s=> months.map((m,i)=>`<circle cx="${x(i)}" cy="${y(s.values[m]||0)}" r="3" fill="${s.color}"/>`).join('')).join('');
  const step = Math.max(1, Math.ceil(months.length/8));
  const labelsSvg = months.map((m,i)=> i%step===0 ? `<text x="${x(i)}" y="${H-8}" font-size="9" fill="var(--ink-soft)" text-anchor="middle">${monthLabel(m).split(' de ')[0].slice(0,3)}</text>` : '').join('');
  const seriesAttr = JSON.stringify(series.map(s=>({label:s.label, color:s.color, fmt:s.fmtType||'eur', values: months.map(m=>s.values[m]||0)}))).replace(/'/g,'&apos;');
  const monthsAttr = JSON.stringify(months.map(monthLabel)).replace(/'/g,'&apos;');
  return `<div class="linechart-wrap" data-lc-months='${monthsAttr}' data-lc-series='${seriesAttr}' data-lc-padl="${padL}" data-lc-innerw="${innerW}" style="position:relative;">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;" class="linechart-svg">
      ${defs}${gridLines}${areasSvg}${linesSvg}${dotsSvg}
      <line class="lc-hoverline" x1="0" y1="${padT}" x2="0" y2="${baseline}" stroke="var(--wine)" stroke-width="1" stroke-dasharray="3,3" opacity="0"/>
      ${labelsSvg}
    </svg>
    <div class="lc-tooltip" style="display:none;"></div>
  </div>
    <div style="display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:8px;">${series.map(s=>`<span style="font-size:11px;color:var(--ink-soft);"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.color};margin-right:5px;"></span>${s.label}</span>`).join('')}</div>`;
}
/* Percentual de vendas por vendedor: quanto cada um representa do total
   vendido da empresa, mês a mês (baseado em Valor Vendido = vendas
   integrais + contrato de recorrências, igual ao resto do sistema). */
function evolucaoPercentualVendedores(){
  const sellers = activeSellers();
  const meses = new Set();
  const porVendedorMes = {};
  sellers.forEach(s=>{ porVendedorMes[s.id] = {}; });
  STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia && s.data).forEach(s=>{
    const mk = s.data.slice(0,7); meses.add(mk);
    if(porVendedorMes[s.vendedorId]) porVendedorMes[s.vendedorId][mk] = (porVendedorMes[s.vendedorId][mk]||0)+(s.valorTotal||0);
  });
  STATE.recurrences.filter(r=>r.dataVenda).forEach(r=>{
    const mk = r.dataVenda.slice(0,7); meses.add(mk);
    if(porVendedorMes[r.vendedorId]) porVendedorMes[r.vendedorId][mk] = (porVendedorMes[r.vendedorId][mk]||0)+(r.valorContrato||0);
  });
  const mesesOrdenados = [...meses].sort();
  const totalPorMes = {};
  mesesOrdenados.forEach(mk=>{ totalPorMes[mk] = sellers.reduce((a,s)=>a+(porVendedorMes[s.id][mk]||0),0); });
  const pct = {};
  sellers.forEach(s=>{
    pct[s.id] = {};
    mesesOrdenados.forEach(mk=>{ pct[s.id][mk] = totalPorMes[mk]>0 ? (porVendedorMes[s.id][mk]||0)/totalPorMes[mk]*100 : 0; });
  });
  return { meses: mesesOrdenados, sellers, pct, valorPorVendedorMes: porVendedorMes, totalPorMes };
}
const PALETA_GRAFICO = ['#520225','#BB8E1D','#2E7D5B','#B0503B','#3B6EA5','#8B5CF6','#67203F','#5B6570'];

function renderChartsPanel(){
  // Forma de pagamento mais utilizada, no período selecionado — inclui vendas
  // avulsas (exceto as já contabilizadas via recorrência, pra não duplicar) E
  // o caixa das recorrências (entrada + parcelas pagas), pela forma de
  // pagamento gravada no contrato.
  const porForma = {};
  const soma = (forma, valor)=>{ const f = forma || 'Não informado'; porForma[f] = (porForma[f]||0) + valor; };
  STATE.sales
    .filter(s=>!s.jaContabilizadoViaRecorrencia && inPeriodOrAll(s.data, STATE.periodFilter))
    .forEach(s=>soma(s.formaPagamento, s.valorPago||0));
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    if((r.valorEntrada||0)>0 && inPeriodOrAll(r.dataVenda, STATE.periodFilter)) soma(r.formaPagamento, r.valorEntrada);
    r.parcelas.forEach(p=>{
      if(p.pago && p.data && inPeriodOrAll(p.data, STATE.periodFilter)) soma(r.formaPagamento, st.valorParcela);
    });
  });
  const formasOrdenadas = Object.entries(porForma).sort((a,b)=>b[1]-a[1]);
  const maxForma = formasOrdenadas.length ? formasOrdenadas[0][1] : 1;

  // Faturamento por mês (todos os meses com dados — comparação natural entre meses)
  const events = buildEvents();
  const porMes = {};
  events.forEach(e=>{ if(!e.date) return; const mk = e.date.slice(0,7); porMes[mk] = (porMes[mk]||0) + e.valor; });
  const mesesOrdenados = Object.entries(porMes).sort((a,b)=>a[0].localeCompare(b[0]));
  const maxMes = mesesOrdenados.length ? Math.max(...mesesOrdenados.map(m=>m[1])) : 1;
  const melhorMes = mesesOrdenados.length ? mesesOrdenados.reduce((a,b)=>b[1]>a[1]?b:a) : null;

  return `
  <section class="block">
    <div class="block-head"><h3>Gráficos</h3><span class="hint">forma de pagamento no período selecionado (vendas + recorrências) · faturamento por mês (histórico completo)</span></div>
    <div class="charts-grid">
      <div class="chart-col">
        <h4>Forma de pagamento mais utilizada</h4>
        ${formasOrdenadas.length ? formasOrdenadas.map(([f,v])=>`
          <div class="hbar-row">
            <span class="hbar-label">${f}</span>
            <div class="hbar-track"><span style="width:${(v/maxForma*100)}%"></span></div>
            <span class="hbar-val">${fmtEUR(v)}</span>
          </div>`).join('') : `<div class="empty">Sem vendas nesse período.</div>`}
      </div>
      <div class="chart-col">
        <h4>Faturamento por mês ${melhorMes ? `<span class="chip gold" style="margin-left:6px;">melhor: ${monthLabel(melhorMes[0])}</span>` : ''}</h4>
        ${mesesOrdenados.length ? `<div class="vbar-chart">
          ${mesesOrdenados.map(([mk,v])=>`
            <div class="vbar-col">
              <div class="vbar-track"><span style="height:${(v/maxMes*100)}%" class="${melhorMes && mk===melhorMes[0]?'best':''}"></span></div>
              <div class="vbar-val">${fmtEUR(v)}</div>
              <div class="vbar-label">${monthLabel(mk).split(' de ')[0].slice(0,3)}</div>
            </div>`).join('')}
        </div>` : `<div class="empty">Sem dados ainda.</div>`}
      </div>
    </div>
  </section>
  ${renderSaldoEEvolucaoCharts()}
  ${STATE.role==='gestor' ? renderPercentualVendedoresCharts() : ''}`;
}
/* 💰 Saldo mensal (entradas − saídas de custos) e 🟢🔴 evolução entradas x
   saídas nos últimos 12 meses — usa o mesmo registo de movimentações do
   Extrato/Registro, então está sempre sincronizado com o que é lançado. */
function renderSaldoEEvolucaoCharts(){
  const todas = linhasFinanceiras({granularity:'all'});
  const porMes = {};
  todas.forEach(l=>{
    const mk = (l.data||'').slice(0,7);
    if(!mk) return;
    if(!porMes[mk]) porMes[mk] = {entrou:0, saiu:0};
    if(l.sinal>0) porMes[mk].entrou += l.valor; else porMes[mk].saiu += l.valor;
  });
  const meses = Object.keys(porMes).sort().slice(-12);
  const maxSaldo = Math.max(...meses.map(mk=>Math.abs(porMes[mk].entrou-porMes[mk].saiu)), 1);
  return `
  <section class="block">
    <div class="block-head"><h3>💰 Saldo e evolução de caixa</h3><span class="hint">últimos ${meses.length} mês(es) com movimentação · vem do Registro/Extrato</span></div>
    <div class="charts-grid">
      <div class="chart-col">
        <h4>Saldo mensal (entrou − saiu)</h4>
        ${meses.length ? `<div class="vbar-chart">${meses.map(mk=>{
          const saldo = porMes[mk].entrou - porMes[mk].saiu;
          return `<div class="vbar-col">
            <div class="vbar-track"><span style="height:${(Math.abs(saldo)/maxSaldo*100)}%;background:${saldo>=0?'var(--good)':'var(--bad)'};"></span></div>
            <div class="vbar-val">${fmtEUR(saldo)}</div>
            <div class="vbar-label">${monthLabel(mk).split(' de ')[0].slice(0,3)}</div>
          </div>`;
        }).join('')}</div>` : `<div class="empty">Sem movimentações ainda.</div>`}
      </div>
      <div class="chart-col">
        <h4>🟢 Entradas x 🔴 Saídas (evolução mensal)</h4>
        ${svgMultiLineChart(meses, [
          {label:'Entradas', color:'#2E7D5B', values: Object.fromEntries(meses.map(mk=>[mk,porMes[mk].entrou])), fmtType:'eur'},
          {label:'Saídas', color:'#B0503B', values: Object.fromEntries(meses.map(mk=>[mk,porMes[mk].saiu])), fmtType:'eur'}
        ])}
      </div>
    </div>
  </section>`;
}
/* % de vendas por vendedor — só o gestor vê. Coluna = participação no mês
   atual; linhas = como essa participação evoluiu mês a mês. */
function renderPercentualVendedoresCharts(){
  const { meses, sellers, pct } = evolucaoPercentualVendedores();
  if(!meses.length || !sellers.length) return '';
  const mesAtual = meses[meses.length-1];
  const pctAtual = sellers.map(s=>({ nome:s.nome, valor: pct[s.id][mesAtual]||0 })).sort((a,b)=>b.valor-a.valor);
  const maxPct = Math.max(...pctAtual.map(p=>p.valor), 1);
  const mesesGrafico = meses.slice(-12);
  return `
  <section class="block">
    <div class="block-head"><h3>📊 Percentual de vendas por vendedor</h3><span class="hint">participação de cada um no total vendido da empresa (só visível pro gestor)</span></div>
    <div class="charts-grid">
      <div class="chart-col">
        <h4>Participação em ${monthLabel(mesAtual)}</h4>
        <div class="vbar-chart">${pctAtual.map((p,i)=>`
          <div class="vbar-col">
            <div class="vbar-track"><span style="height:${(p.valor/maxPct*100)}%;background:${PALETA_GRAFICO[i%PALETA_GRAFICO.length]};"></span></div>
            <div class="vbar-val">${p.valor.toFixed(1)}%</div>
            <div class="vbar-label">${p.nome.split(' ')[0]}</div>
          </div>`).join('')}
        </div>
      </div>
      <div class="chart-col">
        <h4>Evolução da participação (últimos ${mesesGrafico.length} meses)</h4>
        ${svgMultiLineChart(mesesGrafico, sellers.map((s,i)=>({
          label:s.nome, color:PALETA_GRAFICO[i%PALETA_GRAFICO.length], values:pct[s.id], fmtType:'pct'

  </section>`;
}

/* Detalhamento "de onde vem esse número" para os cards principais (Valor
   vendido, Faturado, Pendente, Recorrência em andamento) — tanto na Visão
   Geral (sellerId null, todo mundo) quanto no perfil de um vendedor
   específico (sellerId preenchido). */
function detalheCardLinhas(tipo, filter, sellerId){
  if(tipo==='vendido'){
    const linhas = STATE.sales.filter(s=>(!sellerId||s.vendedorId===sellerId) && !s.jaContabilizadoViaRecorrencia && inPeriodOrAll(s.data, filter)).map(s=>({
      data:s.data, cliente:s.cliente, vendedor:s.vendedorNome, tipo:'Venda integral', valor:s.valorTotal
    }));
    STATE.recurrences.filter(r=>(!sellerId||r.vendedorId===sellerId) && inPeriodOrAll(r.dataVenda, filter)).forEach(r=>{
      linhas.push({ data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:'Recorrência (contrato)', valor:r.valorContrato });
    });
    return linhas;
  }
  if(tipo==='faturado'){
    return buildEvents().filter(e=>(!sellerId||e.vendedorId===sellerId) && inPeriodOrAll(e.date, filter)).map(e=>({
      data:e.date, cliente:e.cliente, vendedor:e.vendedorNome, tipo:e.tipo, valor:e.valor
    }));
  }
  if(tipo==='pendente'){
    const linhas = [];
    STATE.sales.filter(s=>(!sellerId||s.vendedorId===sellerId) && !s.jaContabilizadoViaRecorrencia && inPeriodOrAll(s.data, filter)).forEach(s=>{
      const st = saleStatus(s);
      if(st.valorPendente>0.005) linhas.push({data:s.data, cliente:s.cliente, vendedor:s.vendedorNome, tipo:'Venda', valor:st.valorPendente});
    });
    STATE.recurrences.filter(r=>(!sellerId||r.vendedorId===sellerId) && inPeriodOrAll(r.dataVenda, filter)).forEach(r=>{
      const st = recStatus(r);
      if(st.valorPendente>0.005) linhas.push({data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:`Recorrência (${st.pagas}/${st.total} parcelas pagas)`, valor:st.valorPendente});
    });
    return linhas;
  }
  if(tipo==='recorrencia'){
    return STATE.recurrences.filter(r=>(!sellerId||r.vendedorId===sellerId) && inPeriodOrAll(r.dataVenda, filter) && !recStatus(r).quitada).map(r=>{
      const st = recStatus(r);
      return {data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:`${st.pagas}/${st.total} parcelas pagas`, valor:st.valorPendente};
    });
  }
  return [];
}

function rankRow(r,i,filter){
  const max = ranking(filter)[0] ? ranking(filter)[0].stats.valorFaturado || 1 : 1;
  const pct = max>0 ? (r.stats.valorFaturado/max*100) : 0;
  return `<div class="rank-item ${i===0?'p1':''}"><div class="pos">${i+1}</div><div class="name">${r.seller.nome}</div><div class="bar-wrap"><div class="bar"><span style="width:${pct}%"></span></div></div><div class="amt">${fmtEUR(r.stats.valorFaturado)}</div></div>`;
}

   Vendas, Clientes e Financeiro — cada uma guarda seu próprio texto em
