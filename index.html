/* =========================================================
   CLIENTES / ANÁLISE (gestor), ranking de clientes, fluxo de
   clientes novos x recorrentes, funil agregado de todos os
   vendedores e composição do pipeline por origem.
   ========================================================= */
function normCliente(s){ return (s||'').trim().toUpperCase().replace(/\s+/g,' '); }

/* Um "fechamento" por linha, venda avulsa OU recorrência, sem duplicar o
   mesmo negócio (vendas com jaContabilizadoViaRecorrencia já são a mesma
   recorrência, então saem daqui pra não contar duas vezes). */
function todosFechamentos(){
  const deSales = STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia).map(s=>({
    cliente:s.cliente, data:s.data, valor:s.valorTotal||0, vendedorNome:s.vendedorNome, origem:s.origem
  }));
  const deRecs = STATE.recurrences.map(r=>({
    cliente:r.cliente, data:r.dataVenda, valor:r.valorContrato||0, vendedorNome:r.vendedorNome, origem:'RECORRENCIA'
  }));
  return [...deSales, ...deRecs].filter(f=>f.cliente && f.data);
}

/* Ranking de clientes por nº de fechamentos, histórico completo, porque
   "fidelidade" não faz sentido restrita a um único mês. */
function rankingClientes(){
  const map = new Map();
  todosFechamentos().forEach(f=>{
    const k = normCliente(f.cliente);
    if(!map.has(k)) map.set(k, { nome:f.cliente, fechamentos:0, valorTotal:0, vendedores:new Set(), primeira:f.data, ultima:f.data });
    const c = map.get(k);
    c.fechamentos++;
    c.valorTotal += f.valor;
    c.vendedores.add(f.vendedorNome||'-');
    if(f.data < c.primeira) c.primeira = f.data;
    if(f.data > c.ultima) c.ultima = f.data;
  });
  return [...map.values()].sort((a,b)=> b.fechamentos - a.fechamentos || b.valorTotal - a.valorTotal);
}

/* Fluxo de pessoas no período: novos (1ª compra caiu dentro do período) x
   recorrentes (já eram clientes antes do período começar). */
function fluxoClientes(filter){
  const todos = todosFechamentos();
  const primeiraPorCliente = new Map();
  todos.forEach(f=>{
    const k = normCliente(f.cliente);
    if(!primeiraPorCliente.has(k) || f.data < primeiraPorCliente.get(k)) primeiraPorCliente.set(k, f.data);
  });
  const clientesNoPeriodo = new Set(todos.filter(f=>inPeriodOrAll(f.data, filter)).map(f=>normCliente(f.cliente)));
  let novos=0, recorrentes=0;
  clientesNoPeriodo.forEach(k=>{ inPeriodOrAll(primeiraPorCliente.get(k), filter) ? novos++ : recorrentes++; });
  return { novos, recorrentes, total: clientesNoPeriodo.size };
}

/* Funil agregado, soma o funil diário (preenchido por vendedor) de todos
   os vendedores ativos no período, na mesma estrutura da planilha. */
function funilAgregado(filter){
  const out = { conversas:0, respondeu:0, consultaMarcada:0, leadsQualificados:0, vendasConsultaMarcada:0, reagendado:0, noShow:0, consultaRealizada:0, vendaForaConsulta:0 };
  activeSellers().forEach(s=>{
    const f = sumFunilDiario(s, filter);
    Object.keys(out).forEach(k=>{ out[k] += f[k]||0; });
  });
  out.fechamentos = out.vendasConsultaMarcada + out.vendaForaConsulta;
  return out;
}

/* Composição do "Valor Vendido" por origem do lead, no período, de onde
   vieram as vendas, por valor. Conta TODAS as vendas (mesmo as que também
   têm uma recorrência associada) porque "Valor Vendido" sempre conta assim
   em todo o resto do sistema, jaContabilizadoViaRecorrencia só existe pra
   não duplicar CAIXA/comissão, não afeta valor vendido. Recorrências
   criadas direto no sistema (que não têm venda-sombra nenhuma) agora têm
   a própria origem, e entram aqui também, sem duplicar as antigas, essas
   só têm o campo "origem" preenchido se cadastradas depois dessa função
   existir, então nunca coincidem com uma venda-sombra já contada acima. */
function composicaoPorOrigem(filter){
  const salesIn = STATE.sales.filter(s=>inPeriodOrAll(s.data, filter));
  const map = {};
  salesIn.forEach(s=>{
    const o = s.origem || 'NÃO INFORMADO';
    if(!map[o]) map[o] = {count:0, valor:0};
    map[o].count++; map[o].valor += s.valorTotal||0;
  });
  STATE.recurrences.filter(r=>r.origem && inPeriodOrAll(r.dataVenda, filter)).forEach(r=>{
    const o = r.origem;
    if(!map[o]) map[o] = {count:0, valor:0};
    map[o].count++; map[o].valor += r.valorContrato||0;
  });
  return Object.entries(map).map(([origem,v])=>({origem, ...v})).sort((a,b)=>b.valor-a.valor);
}

/* Composição por serviço: quantos clientes distintos compraram cada
   serviço no período, e o valor total gerado por ele. */
function composicaoPorServico(filter){
  const salesIn = STATE.sales.filter(s=>inPeriodOrAll(s.data, filter));
  const map = {};
  salesIn.forEach(s=>{
    const srv = s.servico || 'NÃO INFORMADO';
    if(!map[srv]) map[srv] = {count:0, valor:0, clientes:new Set()};
    map[srv].count++; map[srv].valor += s.valorTotal||0; map[srv].clientes.add(normCliente(s.cliente));
  });
  // recorrências criadas direto no sistema (sem venda-sombra) também contam
  // pro desempenho de cada serviço, mesma lógica já aplicada em origem.
  STATE.recurrences.filter(r=>inPeriodOrAll(r.dataVenda, filter)).forEach(r=>{
    const srv = r.servico || 'NÃO INFORMADO';
    if(!map[srv]) map[srv] = {count:0, valor:0, clientes:new Set()};
    map[srv].count++; map[srv].valor += r.valorContrato||0; map[srv].clientes.add(normCliente(r.cliente));
  });
  return Object.entries(map).map(([servico,v])=>({servico, count:v.count, valor:v.valor, nClientes:v.clientes.size})).sort((a,b)=>b.nClientes-a.nClientes);
}
/* Detalhamento clicável: quem exatamente compõe uma barra de "origem" ou

/* Aplica por cima do lead original as edições feitas pelo painel (status,
   qualidade, tipo de consultoria, serviço fechado), a planilha em si
   nunca é alterada, só a "camada" guardada no Supabase. */
/* Gera uma cor fria (verde-azulado até roxo, nunca vermelho/laranja/
   amarelo) automaticamente a partir do texto, sempre com contraste
   garantido: como a cor de fundo é sempre escura o bastante, a letra
   fica sempre branca, nunca uma combinação ilegível. O mesmo texto
   sempre gera a mesma cor, então cada status/qualidade/consultoria fica
   visualmente consistente em toda a tabela. */
function corFriaParaTexto(texto){
  const t = (texto||'').trim();
  if(!t) return { bg:'var(--surface-2)', fg:'var(--ink-soft)' };
  let hash = 0;
  for(let i=0;i<t.length;i++){ hash = t.charCodeAt(i) + ((hash<<5)-hash); hash |= 0; }
  const hue = 165 + (Math.abs(hash) % 145);       // 165°–310°: verde-água, azul, índigo, roxo, nunca quente
  const sat = 45 + (Math.abs(hash>>8) % 25);       // 45%–70%
  const light = 30 + (Math.abs(hash>>4) % 14);     // 30%–44%, escuro o bastante pra letra branca sempre ler bem
  return { bg:`hsl(${hue},${sat}%,${light}%)`, fg:'#fff' };
}
function leadComEdicoes(lead){

  };

/* Busca tudo que existe no sistema sobre um cliente: vendas integrais,
   recorrências (entrada + cada parcela + pagamentos personalizados),
   formas de pagamento usadas, totais e pendências, juntando os dois
   tipos de negócio numa linha do tempo só. */
function buscarClienteCompleto(query, filter){
  const q = query.trim().toUpperCase();
  if(!q) return null;
  const vendas = STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia && normCliente(s.cliente).includes(q) && inPeriodOrAll(s.data, filter));
  const recs = STATE.recurrences.filter(r=>normCliente(r.cliente).includes(q) && inPeriodOrAll(r.dataVenda, filter));
  if(!vendas.length && !recs.length) return null;

  const pagamentos = [];
  vendas.forEach(s=>{
    if((s.valorPago||0)>0) pagamentos.push({ data:s.data, tipo:'Venda integral', valor:s.valorPago, forma:s.formaPagamento, servico:s.servico, vendedor:s.vendedorNome, cliente:s.cliente });
  });
  recs.forEach(r=>{
    const st = recStatus(r);
    if((r.valorEntrada||0)>0) pagamentos.push({ data:r.dataVenda, tipo:'Entrada de recorrência', valor:r.valorEntrada, forma:r.formaPagamento, servico:r.servico, vendedor:r.vendedorNome, cliente:r.cliente });
    r.parcelas.forEach(p=>{
      if(p.pago) pagamentos.push({ data:p.data, tipo:'Parcela '+p.numero, valor: valorEfetivoParcela(p, st), forma:r.formaPagamento, servico:r.servico, vendedor:r.vendedorNome, cliente:r.cliente });
    });
    (r.pagamentosExtras||[]).forEach(ex=>{
      pagamentos.push({ data:ex.data, tipo:'Pagamento personalizado', valor:ex.valor, forma:r.formaPagamento, servico:r.servico, vendedor:r.vendedorNome, cliente:r.cliente });
    });
  });
  pagamentos.sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  const totalVendido = vendas.reduce((a,s)=>a+(s.valorTotal||0),0) + recs.reduce((a,r)=>a+(r.valorContrato||0),0);
  const totalPago = pagamentos.reduce((a,p)=>a+(p.valor||0),0);
  const totalPendente = vendas.reduce((a,s)=>a+saleStatus(s).valorPendente,0) + recs.reduce((a,r)=>a+recStatus(r).valorPendente,0);
  const formasPagamento = [...new Set(pagamentos.map(p=>p.forma).filter(Boolean))];
  const clientesDistintos = [...new Set([...vendas.map(s=>s.cliente), ...recs.map(r=>r.cliente)])];

  return { clientesDistintos, vendas, recs, pagamentos, totalVendido, totalPago, totalPendente, formasPagamento, qtdNegocios: vendas.length+recs.length };
}

function abrirNovoFollowUpModal(){
  const vendedoresAtivos = activeSellers();
  const servicoOpts = [...STATE.services].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(s=>`<option value="${s.nome}">`).join('');
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal">
    <div class="modal-head"><h3>Novo follow-up</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome do lead</label><input type="text" id="fuNome"></div>
      <div class="field-row">
        <div class="field"><label>Data do primeiro contato</label><input type="date" id="fuData" value="${todayISO()}"></div>
        <div class="field"><label>Serviço de interesse</label><input list="fuServicoList" id="fuServico"><datalist id="fuServicoList">${servicoOpts}</datalist></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Valor da proposta (€)</label><input type="number" min="0" step="0.01" id="fuValor" value="0"></div>
        <div class="field"><label>Responsável</label><select id="fuResponsavel"><option value="">-</option>${vendedoresAtivos.map(s=>`<option>${s.nome}</option>`).join('')}</select></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Criar ficha</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  document.getElementById('mSave').onclick = async ()=>{
    const nome = document.getElementById('fuNome').value.trim();
    if(!nome){ alert('Informe o nome do lead.'); return; }
    STATE.followUps.push({
      id:'fu-'+Date.now(), nome, dataPrimeiroContato: document.getElementById('fuData').value||todayISO(),
      servico: document.getElementById('fuServico').value.trim(),
      valorProposta: Number(document.getElementById('fuValor').value)||0,
      responsavel: document.getElementById('fuResponsavel').value,

function abrirRegistroContatoModal(followUpId){

function renderControleCampanhas(){
  if(!STATE.leadsLoadedAt && !STATE.leadsLoading && !STATE.leadsError) loadLeadsData(); // uma vez só: planilha vazia não pode virar busca infinita
  if(STATE.leadsLoading && !STATE.leads.length){
    return `<section class="block"><div style="padding:60px 20px;text-align:center;color:var(--ink-soft);">🔄 A buscar a planilha de leads…</div></section>`;
  }
  if(STATE.leadsError){
    return `<section class="block"><div style="padding:30px 20px;">
      <div class="field-hint" style="color:var(--bad);margin-bottom:14px;">⚠️ ${STATE.leadsError}</div>
      <button class="btn gold" id="btnRetryLeads" style="margin-top:14px;">Tentar de novo</button>
    </div></section>`;
  }
  const leads = STATE.leads.map(leadComEdicoes);
  return `

function renderListaLeadsEditavel(leads){
  const filter = STATE.campanhasFilter;
  const meses = [...new Set(STATE.leads.map(l=>l.data.slice(0,7)))].sort();
  const responsavelFiltro = STATE.campanhasResponsavelFilter || 'all';
  const filtrados = leads.filter(l=>inPeriodOrAll(l.data, filter) && matchesSearch(l.nome, STATE.searchCampanhas))
    .filter(l=> responsavelFiltro==='all' || l.responsavel===responsavelFiltro)
    .sort((a,b)=> (b.data+  'T'+(b.hora||'00:00')).localeCompare(a.data+'T'+(a.hora||'00:00')));

function renderMetricasCampanhas(leads){
  const filter = STATE.campanhasFilter;
  const meses = [...new Set(STATE.leads.map(l=>l.data.slice(0,7)))].sort();
  const filtrados = leads.filter(l=>inPeriodOrAll(l.data, filter));

  const contarPor = (arr, campo) => {
    const map = {};
    arr.forEach(l=>{ const k=l[campo]||'Não informado'; map[k]=(map[k]||0)+1; });
    return Object.entries(map).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);
  };
  const porCampanha = contarPor(filtrados, 'campanha');
  const porOrigem = contarPor(filtrados, 'plataforma');
  const porAtendente = contarPor(filtrados, 'atendente');
  const maxCampanha = Math.max(...porCampanha.map(c=>c.v),1);
  const maxOrigem = Math.max(...porOrigem.map(c=>c.v),1);
  const maxAtendente = Math.max(...porAtendente.map(c=>c.v),1);

  // taxa de qualificacao por campanha (top 8 por volume, ordenadas por % de qualificados)
  const qualifPorCampanha = porCampanha.slice(0,8).map(c=>{
    const doCampanha = filtrados.filter(l=>l.campanha===c.k);
    const qualificados = doCampanha.filter(l=>l.qualificado==='Qualificado').length;
    return { campanha:c.k, total:c.v, qualificados, taxa: c.v>0?qualificados/c.v:0 };
  }).sort((a,b)=>b.taxa-a.taxa);

  // mes com leads de maior qualidade (taxa de qualificados por mes, historico completo)
  const porMes = {};
  STATE.leads.forEach(l=>{
    const mk = l.data.slice(0,7);
    if(!porMes[mk]) porMes[mk] = {total:0, qualificados:0};
    porMes[mk].total++;
    if(leadComEdicoes(l).qualificado==='Qualificado') porMes[mk].qualificados++;
  });
  const mesesComTaxa = Object.entries(porMes).map(([mk,v])=>({mes:mk, total:v.total, qualificados:v.qualificados, taxa: v.total>0?v.qualificados/v.total:0})).sort((a,b)=>b.taxa-a.taxa);
  const melhorMesQualidade = mesesComTaxa[0];

  const totalLeads = filtrados.length;
  const totalQualificados = filtrados.filter(l=>l.qualificado==='Qualificado').length;
  const totalFechados = filtrados.filter(l=>l.status==='Cliente fechado' || (l.servicoFechado||'').trim()).length;

  return `
  ${renderGenericFilterBar('campanhasFilter', ['all','month','week','day'], meses)}
  <div class="cards" style="margin:16px 0;">
    <div class="card accent"><div class="lbl">📥 Leads no período</div><div class="val">${totalLeads}</div></div>
    <div class="card"><div class="lbl">✅ Qualificados</div><div class="val good">${totalQualificados}</div></div>
    <div class="card"><div class="lbl">🏆 Fechados</div><div class="val good">${totalFechados}</div></div>
    <div class="card"><div class="lbl">📈 Taxa de conversão</div><div class="val">${totalLeads>0?fmtPct(totalFechados/totalLeads):'-'}</div></div>
  </div>
  ${melhorMesQualidade ? `<div class="field-hint" style="margin-bottom:16px;">🏅 O mês com a <strong>maior taxa de qualidade</strong> de leads (histórico completo) foi <strong>${monthLabel(melhorMesQualidade.mes)}</strong>, com ${fmtPct(melhorMesQualidade.taxa)} dos leads qualificados (${melhorMesQualidade.qualificados} de ${melhorMesQualidade.total}).</div>` : ''}
  <div class="charts-grid">
    <section class="block">
      <div class="block-head"><h3>🎯 Leads por campanha</h3><span class="hint">qual está trazendo mais volume</span></div>
      <div style="padding:16px 20px;max-height:320px;overflow:auto;">${porCampanha.length ? porCampanha.map(c=>`
        <div class="hbar-row"><span class="hbar-label" title="${c.k}">${c.k.length>34?c.k.slice(0,34)+'…':c.k}</span><div class="hbar-track"><span style="width:${(c.v/maxCampanha*100)}%"></span></div><span class="hbar-val">${c.v}</span></div>`).join('') : `<div class="empty">Sem dados.</div>`}</div>
    </section>
    <section class="block">
      <div class="block-head"><h3>⭐ Taxa de qualificação por campanha</h3><span class="hint">das 8 com mais volume, qual converte melhor</span></div>
      <div style="padding:16px 20px;">${qualifPorCampanha.length ? qualifPorCampanha.map(c=>`
        <div class="hbar-row"><span class="hbar-label" title="${c.campanha}">${c.campanha.length>34?c.campanha.slice(0,34)+'…':c.campanha}</span><div class="hbar-track"><span style="width:${(c.taxa*100)}%"></span></div><span class="hbar-val">${fmtPct(c.taxa)}</span></div>`).join('') : `<div class="empty">Sem dados.</div>`}</div>
    </section>
  </div>
  <div class="charts-grid">
    <section class="block">
      <div class="block-head"><h3>📱 Leads por origem</h3></div>
      <div style="padding:16px 20px;">${porOrigem.length ? porOrigem.map(c=>`
        <div class="hbar-row"><span class="hbar-label">${c.k}</span><div class="hbar-track"><span style="width:${(c.v/maxOrigem*100)}%"></span></div><span class="hbar-val">${c.v}</span></div>`).join('') : `<div class="empty">Sem dados.</div>`}</div>
    </section>
    <section class="block">
      <div class="block-head"><h3>👤 Leads por atendente</h3><span class="hint">quem está com mais controle desses leads</span></div>
      <div style="padding:16px 20px;">${porAtendente.length ? porAtendente.map(c=>`
        <div class="hbar-row"><span class="hbar-label">${c.k}</span><div class="hbar-track"><span style="width:${(c.v/maxAtendente*100)}%"></span></div><span class="hbar-val">${c.v}</span></div>`).join('') : `<div class="empty">Sem dados.</div>`}</div>
    </section>
  </div>`;
}

function renderMetricas(){
  if(!STATE.leadsLoadedAt && !STATE.leadsLoading && !STATE.leadsError) loadLeadsData(); // uma vez só: planilha vazia não pode virar busca infinita

  if(STATE.leadsLoading && !STATE.leads.length){
    return `<section class="block"><div style="padding:60px 20px;text-align:center;color:var(--ink-soft);">🔄 A buscar a planilha de leads…</div></section>`;
  }
  if(STATE.leadsError){
    return `<section class="block"><div style="padding:30px 20px;">
      <div class="field-hint" style="color:var(--bad);margin-bottom:14px;">⚠️ ${STATE.leadsError}</div>
      <div class="field-hint">Confirma que a planilha continua partilhada como "Qualquer pessoa com o link pode ver", e que a aba se chama exatamente "${LEADS_SHEET_NOME_ABA}".</div>

  const filter = STATE.leadsFilter;

  const total = leadsFiltrados.length;
  const qualificados = leadsFiltrados.filter(l=>l.qualificado==='Qualificado').length;
  const desqualificados = leadsFiltrados.filter(l=>l.qualificado==='Desqualificado').length;
  const taxaQualif = total>0 ? qualificados/total : 0;

    const map = {};
    leadsFiltrados.forEach(l=>{ const k=l[campo]||'Não informado'; map[k]=(map[k]||0)+1; });

  const porPlataforma = contarPor('plataforma');

  const maxCanal = Math.max(...porCanal.map(p=>p.v),1);
  const maxStatus = Math.max(...porStatus.map(p=>p.v),1);
  const maxServico = Math.max(...porServico.map(p=>p.v),1);

  const porDia = {};
  leadsFiltrados.forEach(l=>{ porDia[l.data] = (porDia[l.data]||0)+1; });

  const hbar = (label, count, max, emoji) => `
    <div class="hbar-row">
      <span class="hbar-label">${emoji?emoji+' ':''}${label}</span>

      <span class="hbar-val">${count}</span>
    </div>`;

  return `
  <div class="field-hint" style="margin-bottom:12px;">📡 Dados ao vivo da planilha de leads do gestor de anúncios ${STATE.leadsLoadedAt ? `· última busca: ${STATE.leadsLoadedAt.toLocaleTimeString('pt-PT')}` : ''} <button class="btn ghost sm" id="btnRefreshLeads" style="margin-left:10px;">🔄 Atualizar agora</button></div>
  ${renderGenericFilterBar('leadsFilter', ['all','month','week','day'], meses)}
  ${renderSearchBar('searchLeads','Buscar por nome do lead…')}
  <div class="cards" style="margin:16px 0;">
    <div class="card accent"><div class="lbl">📥 Total de leads</div><div class="val">${total}</div></div>
    <div class="card"><div class="lbl">✅ Qualificados</div><div class="val good">${qualificados}</div></div>
    <div class="card"><div class="lbl">❌ Desqualificados</div><div class="val bad">${desqualificados}</div></div>
    <div class="card"><div class="lbl">📊 Taxa de qualificação</div><div class="val">${fmtPct(taxaQualif)}</div></div>
  </div>
  <section class="block">
    <div class="block-head"><h3>📈 Leads por dia</h3><span class="hint">no período selecionado</span></div>
    <div style="padding:16px 20px;">
      ${svgMultiLineChart(diasOrdenados, [{label:'Leads', color:'#520225', values: porDia, fmtType:'int'}])}

  </section>
  <div class="charts-grid">
    <section class="block">
      <div class="block-head"><h3>📱 Por plataforma</h3></div>
      <div style="padding:16px 20px;">${porPlataforma.length ? porPlataforma.map(p=>hbar(p.k,p.v,maxPlataforma)).join('') : `<div class="empty">Sem dados.</div>`}</div>
    </section>
    <section class="block">
      <div class="block-head"><h3>🎯 Por canal / campanha</h3></div>
      <div style="padding:16px 20px;max-height:280px;overflow:auto;">${porCanal.length ? porCanal.map(p=>hbar(p.k,p.v,maxCanal)).join('') : `<div class="empty">Sem dados.</div>`}</div>

    </section>
    <section class="block">
      <div class="block-head"><h3>⚖️ Qualificação</h3></div>
      <div style="padding:16px 20px;">${porQualif.length ? porQualif.map(p=>hbar(p.k,p.v,Math.max(...porQualif.map(x=>x.v),1))).join('') : `<div class="empty">Sem dados.</div>`}</div>
    </section>
  </div>
  <section class="block">
    <div class="block-head"><h3>⚖️ Interesse por serviço</h3></div>
    <div style="padding:16px 20px;">${porServico.length ? porServico.map(p=>hbar(p.k,p.v,maxServico)).join('') : `<div class="empty">Sem dados.</div>`}</div>

  <section class="block">

    ${leadsFiltrados.length ? `<div style="max-height:420px;overflow:auto;"><table><thead><tr><th>Data</th><th>Nome</th><th>Telefone</th><th>Serviço</th><th>Plataforma/Canal</th><th>Status</th><th>Qualificação</th></tr></thead>
    <tbody>${[...leadsFiltrados].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,300).map(l=>`<tr>
        <td>${fmtDate(l.data)}</td><td><strong>${l.nome}</strong></td><td>${l.telefone||'-'}</td><td>${l.servico}</td>
        <td>${l.plataforma} / ${l.canal}</td>
        <td><span class="chip" style="background:${corFriaParaTexto(l.status).bg};color:${corFriaParaTexto(l.status).fg};">${l.status}</span></td>
        <td><span class="chip" style="background:${corFriaParaTexto(l.qualificado).bg};color:${corFriaParaTexto(l.qualificado).fg};">${l.qualificado}</span></td>
      </tr>`).join('')}</tbody></table></div>` : `<div class="empty">Nenhum lead encontrado nesse período.</div>`}
  </section>`;
}
/* Desempenho dos serviços de verdade vendidos (não os leads de anúncio) ,
   efetividade = quantos negócios fecharam com aquele serviço; rotatividade
   = quanto de valor aquele serviço já girou no período. Mesma fonte que
   alimenta a Composição por serviço em Clientes. */
function renderDesempenhoServicos(filter){
  const comp = composicaoPorServico(filter);
  if(!comp.length) return '';
  const porEfetividade = [...comp].sort((a,b)=>b.count-a.count);
  const porRotatividade = [...comp].sort((a,b)=>b.valor-a.valor);
  const maxCount = Math.max(...comp.map(c=>c.count),1);
  const maxValor = Math.max(...comp.map(c=>c.valor),1);
  const hbar2 = (label, valStr, frac) => `
    <div class="hbar-row"><span class="hbar-label" title="${label}">${label.length>30?label.slice(0,30)+'…':label}</span><div class="hbar-track"><span style="width:${(frac*100)}%"></span></div><span class="hbar-val">${valStr}</span></div>`;
  return `
  <div class="charts-grid">
    <section class="block">
      <div class="block-head"><h3>🏆 Serviços com maior efetividade</h3><span class="hint">quantidade de negócios fechados</span></div>
      <div style="padding:16px 20px;max-height:320px;overflow:auto;">${porEfetividade.map(c=>hbar2(c.servico, c.count+' negócio'+(c.count===1?'':'s'), c.count/maxCount)).join('')}</div>
    </section>
    <section class="block">
      <div class="block-head"><h3>💹 Maior rotatividade em valores</h3><span class="hint">quanto cada serviço já gerou no período</span></div>
      <div style="padding:16px 20px;max-height:320px;overflow:auto;">${porRotatividade.map(c=>hbar2(c.servico, fmtEUR(c.valor), c.valor/maxValor)).join('')}</div>
    </section>
  </div>`;
}

function salesTable(list){

  return ordenada.length ? `<table><thead><tr><th>Data</th><th>Cliente</th><th>Serviço</th><th>Total</th><th>Recebido</th><th></th></tr></thead>

}

/* Evolução mês a mês de um vendedor: quanto vendeu integral, quanto em
   recorrência, o total dos dois, e quantos clientes distintos fecharam
   negócio com ele naquele mês (recorrência ou venda integral). */
function evolucaoMensalVendedor(sellerId){
  const porMes = new Map();
  const pega = (mk)=>{ if(!porMes.has(mk)) porMes.set(mk, {integral:0, recorrente:0, clientes:new Set()}); return porMes.get(mk); };
  STATE.sales.filter(s=>s.vendedorId===sellerId && !s.jaContabilizadoViaRecorrencia && s.data).forEach(s=>{
    const m = pega(s.data.slice(0,7));
    m.integral += s.valorTotal||0;
    m.clientes.add(normCliente(s.cliente));
  });
  STATE.recurrences.filter(r=>r.vendedorId===sellerId && r.dataVenda).forEach(r=>{
    const m = pega(r.dataVenda.slice(0,7));
    m.recorrente += r.valorContrato||0;
    m.clientes.add(normCliente(r.cliente));
  });
  return [...porMes.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([mes,v])=>({
    mes, integral:v.integral, recorrente:v.recorrente, total:v.integral+v.recorrente, clientes:v.clientes.size
  }));
}
function renderEvolucaoMensalVendedor(sellerId){
  const dados = evolucaoMensalVendedor(sellerId);
  if(dados.length<2) return ''; // não vale a pena um gráfico com 0 ou 1 mês
  const maxTotal = Math.max(...dados.map(d=>d.total), 1);
  const maxClientes = Math.max(...dados.map(d=>d.clientes), 1);
  const mesCurto = mk => monthLabel(mk).split(' de ')[0].slice(0,3);
  return `
  <section class="block">
    <div class="block-head"><h3>Evolução mensal</h3><span class="hint">vendas integrais x recorrentes, e quantos clientes distintos por mês</span></div>
    <div class="charts-grid">
      <div class="chart-col">
        <h4>Total vendido por mês (integral + recorrente)</h4>
        <div class="vbar-chart">${dados.map(d=>`
          <div class="vbar-col">
            <div class="vbar-track" style="flex-direction:column-reverse;">
              <span style="height:${maxTotal>0?(d.integral/maxTotal*100):0}%;background:var(--wine);border-radius:0;" title="Integral: ${fmtEUR(d.integral)}"></span>
              <span style="height:${maxTotal>0?(d.recorrente/maxTotal*100):0}%;background:var(--gold);border-radius:4px 4px 0 0;" title="Recorrente: ${fmtEUR(d.recorrente)}"></span>
            </div>
            <div class="vbar-val">${fmtEUR(d.total)}</div>
            <div class="vbar-label">${mesCurto(d.mes)}</div>
          </div>`).join('')}
        </div>
        <div class="field-hint" style="margin-top:10px;"><span style="color:var(--gold);">■</span> Recorrente &nbsp; <span style="color:var(--wine);">■</span> Integral</div>
      </div>
      <div class="chart-col">
        <h4>Clientes distintos por mês</h4>
        <div class="vbar-chart">${dados.map(d=>`
          <div class="vbar-col">
            <div class="vbar-track"><span style="height:${(d.clientes/maxClientes*100)}%"></span></div>
            <div class="vbar-val">${d.clientes}</div>
            <div class="vbar-label">${mesCurto(d.mes)}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </section>`;
}

/* Extrato do dia: tudo que mexeu no caixa naquele dia específico, vendas
   recebidas, entrada/parcelas de recorrência, e custos com vencimento
   naquele dia (fixos ou variáveis, pagos ou pendentes). */
/* Lista unificada de movimentações financeiras num período qualquer, usada
   tanto no Extrato do dia (período = 1 dia) quanto no Registro (qualquer
   período). Cada linha já vem com emoji, categoria e sinal (+/-) prontos. */
function linhasFinanceiras(filter, opts){
  const porPagamento = !!(opts && opts.porPagamento); // Extrato do dia: custos na data real do pagamento
  const linhas = [];
  STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia && (s.valorPago||0)>0 && inPeriodOrAll(s.data, filter)).forEach(s=>{
    linhas.push({ data:s.data, emoji:'💳', tipo:'Venda integral', categoria:'Receita', cliente:s.cliente, vendedor:s.vendedorNome, forma:s.formaPagamento||'-', valor:s.valorPago, sinal:1, _ref:{tipo:'venda', saleId:s.id} });
  });
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    if((r.valorEntrada||0)>0 && inPeriodOrAll(r.dataVenda, filter)){
      linhas.push({ data:r.dataVenda, emoji:'🔁', tipo:'Entrada de recorrência', categoria:'Receita', cliente:r.cliente, vendedor:r.vendedorNome, forma:r.formaPagamento||'-', valor:r.valorEntrada, sinal:1, _ref:{tipo:'entrada', recId:r.id} });
    }
    r.parcelas.forEach(p=>{
      if(p.pago && p.data && inPeriodOrAll(p.data, filter)){
        linhas.push({ data:p.data, emoji:'🔁', tipo:'Parcela '+p.numero+' de recorrência', categoria:'Receita', cliente:r.cliente, vendedor:r.vendedorNome, forma:r.formaPagamento||'-', valor: valorEfetivoParcela(p, st), sinal:1, estimado: parcelaComValorEstimado(p), _ref:{tipo:'parcela', recId:r.id, numero:p.numero} });
      }
    });
    (r.pagamentosExtras||[]).forEach(ex=>{
      if(ex.data && inPeriodOrAll(ex.data, filter)){
        linhas.push({ data:ex.data, emoji:'💠', tipo:'Pagamento personalizado', categoria:'Receita', cliente:r.cliente, vendedor:r.vendedorNome, forma:r.formaPagamento||'-', valor: ex.valor||0, sinal:1, _ref:{tipo:'extra', recId:r.id, extraId:ex.id} });
      }
    });
  });
  // Custos fixos: exatamente os mesmos itens da lista de Custos fixos
  // (custosFixosDoMes). Cards, lista, Resumo, Registro e gráfico contam
  // pela COMPETÊNCIA (o vencimento do mês a que o custo se refere, bate com
  // a lista mesmo pago com atraso); o Extrato do dia conta pela data real.
  const porMes = filter && filter.granularity==='month';
  mesesDeCompetencia(porPagamento ? {granularity:'all'} : filter).forEach(mk=>{
    custosFixosDoMes(mk).filter(c=>c.pago).forEach(c=>{
      const dentro = porPagamento ? inPeriodOrAll(c._dataPagamento, filter)
        : porMes ? mk===filter.anchor.slice(0,7) : inPeriodOrAll(c.vencimento, filter);
      if(!dentro) return;
      linhas.push({ data:c._dataPagamento, competencia:mk, emoji:'🏠', tipo:'Custo fixo', categoria:'Despesa', cliente:c.nome, vendedor:'-', forma:'-', valor:c._valorPago, sinal:-1,
        _ref: c._projetado ? {tipo:'custoFixoMes', custoId:c.id, mes:mk} : {tipo:'custoFixoExato', custoId:c.id} });
    });
  });
  STATE.costs.filter(c=>c.categoria==='VARIÁVEL' && c.pago && (c.vencimento || c.dataPagamento)).forEach(c=>{
    const data = c.dataPagamento || c.vencimento;
    const ref = c.vencimento || c.dataPagamento;
    if(!inPeriodOrAll(porPagamento ? data : ref, filter)) return;
    linhas.push({ data, competencia:mesDe(ref), emoji:'📦', tipo:'Custo variável', categoria:'Despesa', cliente:c.nome, vendedor:'-', forma:'-', valor:c.valor, sinal:-1, _ref:{tipo:'custoVariavel', custoId:c.id} });
  });
  return linhas.sort((a,b)=> (b.data||'').localeCompare(a.data||''));
}
/* Desfaz um lançamento diretamente do Extrato/Registro, cada tipo tem seu
   jeito certo de "voltar atrás": uma venda vira estorno (o valor pago
   zera, a venda continua existindo como pendente, pra não sumir do
   histórico); uma parcela ou entrada volta a ficar pendente; um pagamento
   personalizado é removido; um custo volta a ficar por pagar. */
async function estornarLancamento(ref){
  // Devolve true só se o banco aceitou; se recusar, a tela volta ao que era.
  if(ref.tipo==='venda'){
    const s = STATE.sales.find(x=>x.id===ref.saleId);
    if(!s) return false;
    return salvarAlteracao(s, ()=>{ s.valorPago = 0; }, ()=>persistVenda(s), 'o estorno NÃO foi gravado');
  }
  if(ref.tipo==='entrada' || ref.tipo==='parcela' || ref.tipo==='extra'){
    const r = STATE.recurrences.find(x=>x.id===ref.recId);
    if(!r) return false;
    if(ref.tipo==='parcela' && !r.parcelas.find(x=>x.numero===ref.numero)) return false;
    return salvarAlteracao(r, ()=>{
      if(ref.tipo==='entrada'){
        congelarValoresParcelasPagas(r); // zerar a entrada mudaria o valor das parcelas já pagas
        r.valorEntrada = 0;
      } else if(ref.tipo==='parcela'){
        const p = r.parcelas.find(x=>x.numero===ref.numero);
        p.pago = false; p.data = null; p.valor = null;
      } else {
        r.pagamentosExtras = (r.pagamentosExtras||[]).filter(e=>e.id!==ref.extraId);
      }
    }, ()=>persistRecorrencia(r), 'o desfazer NÃO foi gravado');
  }
  const c = STATE.costs.find(x=>x.id===ref.custoId);
  if(!c) return false;
  const antes = JSON.stringify(STATE.costs);
  if(ref.tipo==='custoFixoExato' || ref.tipo==='custoVariavel'){ c.pago = false; c.dataPagamento = null; }
  else if(ref.tipo==='custoFixoMes'){ desmarcarCustoPago(c.id, ref.mes); }
  else return false;
  return gravarCustosOuReverter(antes);
}

/* Resumo do período: 6 números-chave (3 de entrada, 3 de saída/pendência)
   com uma lista de detalhamento embaixo de cada um, pra comparar de onde
   vem mais receita e onde está pesando mais em despesa. */
function renderResumoFinanceiro(filter){
  const eventosPeriodo = buildEvents().filter(e=>inPeriodOrAll(e.date, filter));
  const novasVendas = STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia && inPeriodOrAll(s.data, filter));
  const novasRecs = STATE.recurrences.filter(r=>inPeriodOrAll(r.dataVenda, filter));

  // 1) Entrada de novos serviços, dinheiro de negócios fechados NESTE período
  const linhasNovos = [
    ...novasVendas.filter(s=>(s.valorPago||0)>0).map(s=>({ data:s.data, cliente:s.cliente, vendedor:s.vendedorNome, tipo:'Venda integral', valor:s.valorPago })),
    ...novasRecs.filter(r=>(r.valorEntrada||0)>0).map(r=>({ data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:'Entrada de recorrência', valor:r.valorEntrada }))
  ].sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const entradaNovosServicos = linhasNovos.reduce((a,l)=>a+l.valor,0);

  // 2) Receita geral, TUDO que entrou no período, novo ou não
  const linhasReceita = eventosPeriodo.map(e=>({ data:e.date, cliente:e.cliente, vendedor:e.vendedorNome, tipo:e.tipo+(e.estimado?' · valor estimado':''), valor:e.valor })).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const receitaGeral = linhasReceita.reduce((a,l)=>a+l.valor,0);

  // 3) Recorrências pagas no período, parcelas e pagamentos personalizados (não conta a entrada, essa já é "novo negócio")
  const linhasRecPagas = eventosPeriodo.filter(e=>e.tipo.startsWith('Parcela')||e.tipo==='Pagamento personalizado').map(e=>({ data:e.date, cliente:e.cliente, vendedor:e.vendedorNome, tipo:e.tipo+(e.estimado?' · valor estimado':''), valor:e.valor })).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const recorrenciasPagas = linhasRecPagas.reduce((a,l)=>a+l.valor,0);

  // 4) Despesas no período
  const linhasDespesas = linhasFinanceiras(filter).filter(l=>l.sinal<0).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const despesasPeriodo = linhasDespesas.reduce((a,l)=>a+l.valor,0);

  // 5) Impostos (IVA) sobre o que foi recebido no período
  const linhasImpostos = eventosPeriodo.filter(e=>(e.ivaValor||0)>0.005).map(e=>({ data:e.date, cliente:e.cliente, vendedor:e.vendedorNome, tipo:e.tipo, valor:e.ivaValor })).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const impostosPeriodo = linhasImpostos.reduce((a,l)=>a+l.valor,0);

  // 6) Clientes de recorrência ainda pendentes, entre os que começaram nesse período
  const recsPendentes = novasRecs.filter(r=>!recStatus(r).quitada).map(r=>{
    const st = recStatus(r);
    return { data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:`${st.pagas}/${st.total} parcelas pagas`, valor:st.valorPendente };
  }).sort((a,b)=>(b.valor||0)-(a.valor||0));
  const qtdPendentes = recsPendentes.length;
  const valorPendentesTotal = recsPendentes.reduce((a,l)=>a+l.valor,0);

  // 7) Recorrências que ficaram QUITADAS entre as iniciadas nesse período
  const linhasRecQuitadas = novasRecs.filter(r=>recStatus(r).quitada).map(r=>({ data:r.dataVenda, cliente:r.cliente, vendedor:r.vendedorNome, tipo:`${r.nParcelas} parcela${r.nParcelas>1?'s':''}`, valor:r.valorContrato })).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const qtdRecQuitadas = linhasRecQuitadas.length;
  const valorRecQuitadas = linhasRecQuitadas.reduce((a,l)=>a+l.valor,0);

  // 8) Vendas integrais totalmente pagas nesse período
  const linhasVendasPagas = novasVendas.filter(s=>saleStatus(s).valorPendente<=0.005).map(s=>({ data:s.data, cliente:s.cliente, vendedor:s.vendedorNome, tipo:s.servico||'-', valor:s.valorTotal })).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const qtdVendasPagas = linhasVendasPagas.length;
  const valorVendasPagas = linhasVendasPagas.reduce((a,l)=>a+l.valor,0);

  const listaBlock = (titulo, hint, linhas, corValor) => `
    <section class="block">
      <div class="block-head"><h3>${titulo}</h3><span class="hint">${hint}</span></div>
      ${linhas.length ? `<div style="max-height:260px;overflow:auto;"><table><thead><tr><th>Data</th><th>Cliente</th><th>Vendedor</th><th>Detalhe</th><th>Valor</th></tr></thead>
      <tbody>${linhas.map(l=>`<tr><td>${fmtDate(l.data)}</td><td><strong>${l.cliente}</strong></td><td>${l.vendedor||'-'}</td><td><span class="chip neutral">${l.tipo}</span></td><td class="tnum ${corValor||''}">${fmtEUR(l.valor)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty">Nada nesse período.</div>`}
    </section>`;

  return `
  <div class="cards" style="margin-bottom:10px;">
    <div class="card accent"><div class="lbl">🆕 Entrada de novos serviços</div><div class="val good">${fmtEUR(entradaNovosServicos)}</div><div class="sub">${linhasNovos.length} lançamento(s), negócios fechados neste período</div></div>
    <div class="card accent"><div class="lbl">💰 Receita geral da empresa</div><div class="val good">${fmtEUR(receitaGeral)}</div><div class="sub">${linhasReceita.length} lançamento(s), tudo que entrou no período</div></div>
    <div class="card accent"><div class="lbl">🔁 Recorrências pagas</div><div class="val good">${fmtEUR(recorrenciasPagas)}</div><div class="sub">${linhasRecPagas.length} parcela(s)/pagamento(s), não conta a entrada</div></div>
  </div>
  <div class="cards" style="margin-bottom:20px;">
    <div class="card"><div class="lbl">📤 Despesas no período</div><div class="val bad">${fmtEUR(despesasPeriodo)}</div><div class="sub">${linhasDespesas.length} custo(s) pago(s)</div></div>
    <div class="card"><div class="lbl">🧾 Impostos (IVA) no período</div><div class="val bad">${fmtEUR(impostosPeriodo)}</div><div class="sub">sobre o que foi recebido</div></div>
    <div class="card"><div class="lbl">⏳ Clientes pendentes (recorrência)</div><div class="val bad">${qtdPendentes}</div><div class="sub">somando ${fmtEUR(valorPendentesTotal)} em aberto</div></div>
  </div>
  <div class="cards" style="margin-bottom:20px;">
    <div class="card"><div class="lbl">✅ Recorrências quitadas</div><div class="val good">${qtdRecQuitadas}</div><div class="sub">${fmtEUR(valorRecQuitadas)} em contratos fechados</div></div>
    <div class="card"><div class="lbl">✅ Vendas integrais pagas</div><div class="val good">${qtdVendasPagas}</div><div class="sub">${fmtEUR(valorVendasPagas)} recebidos</div></div>
  </div>
  ${listaBlock('🆕 Entrada de novos serviços, detalhamento', 'o que compõe esse valor', linhasNovos, 'good')}
  ${listaBlock('💰 Receita geral, detalhamento', 'todo lançamento que gerou o valor de receita do período', linhasReceita, 'good')}
  ${listaBlock('🔁 Recorrências pagas, detalhamento', 'quais parcelas/pagamentos compõem esse valor', linhasRecPagas, 'good')}
  ${listaBlock('📤 Despesas, detalhamento', 'custos fixos e variáveis pagos no período', linhasDespesas, 'bad')}
  ${listaBlock('🧾 Impostos, detalhamento', 'IVA de cada recebimento do período', linhasImpostos, 'bad')}
  ${listaBlock('⏳ Clientes pendentes, detalhamento', 'recorrências iniciadas no período que ainda não quitaram', recsPendentes, 'bad')}
  ${listaBlock('✅ Recorrências quitadas, detalhamento', 'contratos iniciados no período que já foram 100% pagos', linhasRecQuitadas, 'good')}
  ${listaBlock('✅ Vendas integrais pagas, detalhamento', 'vendas integrais do período já totalmente recebidas', linhasVendasPagas, 'good')}`;
}
function renderImpostosTab(filter){
  const events = buildEvents().filter(e=>inPeriodOrAll(e.date, filter)).sort((a,b)=> b.date.localeCompare(a.date));
  return `
  <section class="block">
    <div class="block-head"><h3>Imposto por recebimento (proporcional ao valor recebido, no período)</h3></div>
    ${events.length ? `<table><thead><tr><th>Data</th><th>Cliente</th><th>Tipo</th><th>Recebido</th><th>IVA devido</th><th>Taxa adm. devida</th></tr></thead>
    <tbody>${events.map(e=>`<tr><td>${fmtDate(e.date)}</td><td>${e.cliente}</td><td><span class="chip neutral">${e.tipo}</span></td><td class="tnum">${fmtEUR(e.valor)}</td><td class="tnum">${fmtEUR(e.ivaValor)}</td><td class="tnum">${fmtEUR(e.txAdmValor)}</td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">Nenhum recebimento nesse período.</div>`}
  </section>`;
}

/* Modal único de lançamento rápido: o gestor/colaborador escolhe o tipo
   (venda integral ou recorrência) e o sistema cria o registo na área certa
   automaticamente, Vendas ou Recorrências. */
function openQuickAddModal(initialTipo, forColaborador){
  let tipo = initialTipo || 'integral';
  const opts = activeSellers().map(s=>`<option value="${s.id}">${s.nome}</option>`).join('');
  const serviceOpts = [...STATE.services].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(s=>`<option value="${s.nome}">`).join('');
  const formasPagamento = formasPagamentoList();

  function render(){
    document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" id="mBackdrop"><div class="modal">
      <div class="modal-head"><h3>Novo lançamento</h3><button id="mClose">&times;</button></div>
      <div class="modal-body">
        <div class="subtabs" style="padding:0 0 16px;">
          <button data-qtype="integral" class="${tipo==='integral'?'active':''}">Venda integral</button>
          <button data-qtype="recorrencia" class="${tipo==='recorrencia'?'active':''}">Recorrência</button>
        </div>
        <div class="field-hint" style="margin:-8px 0 14px;">${tipo==='integral' ? 'Cliente pagou o valor todo de uma vez, entra direto em Vendas.' : 'Cliente vai pagar em parcelas (com ou sem entrada), entra em Recorrências.'}</div>
        <div class="field"><label>Cliente</label><input type="text" id="qCliente" placeholder="Nome do cliente"></div>
        <div class="field"><label>Serviço</label><input list="qServiceList" id="qServico" placeholder="Comece a digitar para escolher do catálogo…"><datalist id="qServiceList">${serviceOpts}</datalist>
          <div class="field-hint" id="qServicoPreview">Selecione um serviço do catálogo para preencher o valor automaticamente, ou digite um nome livre.</div>
        </div>
        <div class="field-row">
          <div class="field"><label>Data</label><input type="date" id="qData"></div>
          ${forColaborador ? '' : `<div class="field"><label>Vendedor</label><select id="qVendedor">${opts}</select></div>`}
        </div>
        <div class="field"><label>Origem do lead</label><select id="qOrigem">${origensLeadList().map(o=>`<option>${o}</option>`).join('')}</select></div>
        <div id="qIntegralFields" style="${tipo==='integral'?'':'display:none;'}">
          <div class="field-row">
            <div class="field"><label>Valor pago (€)</label><input type="number" id="qValorPago" min="0" step="0.01"></div>
            <div class="field"><label>Forma de pagamento</label><select id="qFormaPagamento">${formasPagamento.map(f=>`<option>${f}</option>`).join('')}</select></div>
          </div>
        </div>
        <div id="qRecFields" style="${tipo==='recorrencia'?'':'display:none;'}">
          <div class="field-row">
            <div class="field"><label>Valor do contrato (€)</label><input type="number" id="qValorContrato" min="0" step="0.01"></div>
            <div class="field"><label>Valor de entrada (€)</label><input type="number" id="qEntrada" min="0" step="0.01" value="0"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Nº de parcelas (após a entrada)</label><select id="qParcelas"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
            <div class="field"><label>Forma de pagamento</label><select id="qFormaPagamentoRec">${formasPagamento.map(f=>`<option>${f}</option>`).join('')}</select></div>
          </div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Criar</button></div>
    </div></div>`;
    wire();
  }

  function wire(){
    document.getElementById('mClose').onclick = closeModal;
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
    document.querySelectorAll('[data-qtype]').forEach(b=>{
      b.addEventListener('click', ()=>{
        // preserva o que já foi digitado ao trocar de tipo
        const cliente = document.getElementById('qCliente').value;
        const servico = document.getElementById('qServico').value;
        const data = document.getElementById('qData').value;
        const origem = document.getElementById('qOrigem').value;
        tipo = b.dataset.qtype;
        render();
        document.getElementById('qCliente').value = cliente;
        document.getElementById('qServico').value = servico;
        document.getElementById('qData').value = data;
        document.getElementById('qOrigem').value = origem;
      });
    });

    let matchedService = null;
    const qServico = document.getElementById('qServico');
    qServico.addEventListener('input', ()=>{
      matchedService = serviceByName(qServico.value);
      const prev = document.getElementById('qServicoPreview');
      if(matchedService){
        if(tipo==='integral'){ document.getElementById('qValorPago').value = matchedService.honorarioFinal; }
        else { document.getElementById('qValorContrato').value = matchedService.honorarioFinal; }
        prev.innerHTML = `Honorário base: <strong>${fmtEUR(matchedService.honorarioBase)}</strong> · IVA: ${fmtEUR(matchedService.iva)} · Taxa adm.: ${fmtEUR(matchedService.txAdm)}`;
      } else {
        prev.textContent = 'Serviço não cadastrado no catálogo, será registado sem detalhamento de imposto (edite em Configurações > Serviços depois, se quiser).';
      }
    });

    document.getElementById('mSave').onclick = async ()=>{
      const cliente = document.getElementById('qCliente').value.trim();
      const servico = qServico.value.trim();
      const data = document.getElementById('qData').value || todayISO();
      const vendedorId = forColaborador ? STATE.myOwnSellerId : document.getElementById('qVendedor').value;
      const vendedor = sellerById(vendedorId);
      const origem = document.getElementById('qOrigem').value;
      if(!cliente){ alert('Informe o nome do cliente.'); return; }

      if(tipo==='integral'){
        const valorPago = Number(document.getElementById('qValorPago').value)||0;
        if(!valorPago){ alert('Informe o valor pago.'); return; }
        const formaPagamento = document.getElementById('qFormaPagamento').value;
        const componentes = componentesServicoParaTotal(matchedService, valorPago);
        const novaVenda = {
          id:'vda-'+Date.now(), data, cliente, vendedorId, vendedorNome: vendedor?vendedor.nome:'-',
          origem, servico, valorTotal: valorPago, valorPago, pagamentoIntegral:true, nParcelas:null,
          formaPagamento, registro:null, obs:null,
          honorarioBase: componentes.honorarioBase,
          iva: componentes.iva, txAdm: componentes.txAdm
        };
        if(!travarBotao(document.getElementById('mSave'))) return; // evita venda duplicada por duplo clique
        if(await criarVenda(novaVenda)) showSuccessToast('Venda registada com sucesso!');
        closeModal(); renderAll();
      } else {
        const valorContrato = Number(document.getElementById('qValorContrato').value)||0;
        const valorEntrada = Number(document.getElementById('qEntrada').value)||0;
        const nParcelas = Number(document.getElementById('qParcelas').value)||1;
        const formaPagamento = document.getElementById('qFormaPagamentoRec').value;
        if(!valorContrato){ alert('Informe o valor do contrato.'); return; }
        if(valorEntrada > valorContrato){ alert('O valor de entrada não pode ser maior que o valor do contrato.'); return; }
        const componentes = componentesServicoParaTotal(matchedService, valorContrato);
        const parcelas = Array.from({length:nParcelas}, (_,i)=>({numero:i+1, data:null, pago:false}));
        const novaRec = {
          id:'rec-'+Date.now(), dataVenda:data, cliente, servico, nParcelas, valorEntrada, formaPagamento, origem,
          honorarioBase: componentes.honorarioBase,
          iva: componentes.iva, txAdm: componentes.txAdm,
          valorContrato, vendedorId, vendedorNome: vendedor?vendedor.nome:'-', parcelas, origemSheet:'manual'
        };
        if(!travarBotao(document.getElementById('mSave'))) return;
        if(await criarRecorrencia(novaRec)) showSuccessToast('Recorrência criada com sucesso!');
        closeModal(); renderAll();
      }
    };
  }

  render();
}

/* Edita uma recorrência já cadastrada: cliente, serviço, vendedor, valor do
   contrato, valor de entrada/já pago, honorário base/IVA/taxa administrativa
   e nº de parcelas (preservando o status pago/pendente das parcelas que
   continuarem existindo). Serve tanto pra corrigir dados importados errado
   quanto pra ajustar uma recorrência no dia a dia. */
/* Edita uma venda avulsa já cadastrada, cliente, serviço, vendedor, data,
   origem, valor total/recebido, forma de pagamento e honorário base/IVA/
   taxa administrativa. Serve pra corrigir dados importados errado e pra
   remover duplicatas (junto com o botão Excluir). */
/* Cria uma conta de login nova (Supabase Auth + profiles), chamando a
   Edge Function "create-user", a chave service_role necessária pra isso
   NUNCA fica no navegador, só existe do lado do servidor (ver o comentário
   no topo de supabase/functions/create-user/index.ts). Se prefillSellerId
   vier preenchido, a conta já nasce ligada a esse vendedor (colaborador);
   se vier vazio, a pessoa escolhe o papel na hora. */
function openCreateAccountModal(prefillSellerId){
  const sellerFixo = prefillSellerId ? sellerById(prefillSellerId) : null;
  const opts = STATE.sellers.map(s=>`<option value="${s.id}">${s.nome}</option>`).join('');
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal">
    <div class="modal-head"><h3>Criar conta de acesso${sellerFixo ? ', '+sellerFixo.nome : ''}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome</label><input type="text" id="caNome" value="${sellerFixo?sellerFixo.nome:''}"></div>
      ${sellerFixo ? `<input type="hidden" id="caRole" value="colaborador"><input type="hidden" id="caSeller" value="${sellerFixo.id}">
        <div class="field-hint">Esta conta será do tipo <strong>colaborador</strong>, ligada a <strong>${sellerFixo.nome}</strong>.</div>`
      : `<div class="field"><label>Papel</label><select id="caRole"><option value="colaborador">Colaborador(a)</option><option value="gestor">Gestor(a)</option></select></div>
        <div class="field" id="caSellerField"><label>Vendedor correspondente</label><select id="caSeller">${opts}</select></div>`}
      <div class="field"><label>E-mail de login</label><input type="email" id="caEmail" placeholder="pessoa@escritorio.local"></div>
      <div class="field"><label>Senha</label><input type="password" id="caSenha" placeholder="Mínimo 6 caracteres"></div>
      <div id="caError" style="color:var(--bad);font-size:12.5px;margin:-6px 0 12px;display:none;"></div>
      <div id="caSuccess" style="color:var(--good);font-size:12.5px;margin:-6px 0 12px;display:none;">Conta criada, a pessoa já pode entrar com este e-mail e senha.</div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Criar conta</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });

  if(!sellerFixo){
    const roleSel = document.getElementById('caRole');
    const sellerField = document.getElementById('caSellerField');
    roleSel.addEventListener('change', ()=>{ sellerField.style.display = roleSel.value==='gestor' ? 'none' : ''; });
  }

  document.getElementById('mSave').onclick = async ()=>{
    const errBox = document.getElementById('caError');
    const okBox = document.getElementById('caSuccess');
    errBox.style.display = 'none'; okBox.style.display = 'none';
    const nome = document.getElementById('caNome').value.trim();
    const role = document.getElementById('caRole').value;
    const sellerIdSel = document.getElementById('caSeller') ? document.getElementById('caSeller').value : null;
    const email = document.getElementById('caEmail').value.trim();
    const senha = document.getElementById('caSenha').value;
    if(!email || !senha){ errBox.textContent = 'Preencha e-mail e senha.'; errBox.style.display='block'; return; }
    if(senha.length < 6){ errBox.textContent = 'A senha precisa de pelo menos 6 caracteres.'; errBox.style.display='block'; return; }
    const btn = document.getElementById('mSave');
    btn.disabled = true; btn.textContent = 'A criar…';
    try{
      const { data: { session } } = await supa.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-user`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ email, password: senha, role, sellerId: role==='colaborador'?sellerIdSel:null, nome })
      });
      const body = await res.json();
      if(!res.ok || body.error){
        errBox.textContent = body.error || 'Não consegui criar a conta.';
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Criar conta';
        return;
      }
      okBox.style.display = 'block';
      btn.textContent = 'Conta criada ✓';
    }catch(e){
      errBox.textContent = 'Não consegui falar com a função de criação de conta, confirme se ela já foi publicada no Supabase (ver docs/SECURITY_MIGRATION.md).';
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Criar conta';
    }
  };
}

/* Grava crm:costs; se o servidor recusar, devolve STATE.costs ao que era
   antes (snapshot em JSON) pra tela nunca mostrar algo que não foi salvo. */
async function gravarCustosOuReverter(snapshotAntes){
  try{ await sbSet('crm:costs', STATE.costs); return true; }
  catch(e){
    STATE.costs = JSON.parse(snapshotAntes);
    showErrorToast('o custo NÃO foi gravado ('+e.message+'). Nada mudou, tente de novo.');
    return false;
  }
}

  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal" style="max-width:420px;">
    <div class="modal-head"><h3>Registar pagamento, ${c.nome}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field-hint" style="margin-bottom:14px;">Valor: <strong>${fmtEUR(c.valor)}</strong>${venc?' · vencimento '+fmtDate(venc):''}${mes?' · referente a '+monthLabel(mes):''}</div>
      <div class="field"><label>Data em que foi pago</label><input type="date" id="pcData" value="${todayISO()}"></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Confirmar pagamento</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  const btn = document.getElementById('mSave');
  btn.onclick = async ()=>{
    const data = document.getElementById('pcData').value;
    if(!data){ alert('Informe a data do pagamento.'); return; }
    btn.disabled = true;
    const antes = JSON.stringify(STATE.costs);
    marcarCustoPago(costId, mes, data);
    const ok = await gravarCustosOuReverter(antes);
    if(ok) showSuccessToast('Pagamento registado com sucesso!');
    closeModal(); renderAll();
  };
}
function openCostModal(existingId, defaultCategoria, mesVisualizado){
  const existingRaw = existingId ? STATE.costs.find(c=>c.id===existingId) : null;
  // Numa repetição, o formulário mostra o vencimento projetado do mês visto.
  const projetado = existingRaw && existingRaw.categoria==='FIXO' && mesVisualizado && existingRaw.vencimento && mesVisualizado!==mesDe(existingRaw.vencimento);
  const existing = existingRaw ? Object.assign({}, existingRaw, projetado ? { vencimento: projetarVencimentoNoMes(existingRaw.vencimento, mesVisualizado) } : {}) : null;
  const catInicial = existing ? existing.categoria : (defaultCategoria || 'FIXO');
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal">
    <div class="modal-head"><h3>${existing?'Editar custo':'Novo custo'}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome</label><input type="text" id="ctNome" value="${existing?existing.nome:''}"></div>
      <div class="field-row">
        <div class="field"><label>Valor (€)</label><input type="number" id="ctValor" step="0.01" value="${existing?existing.valor:0}"></div>
        <div class="field"><label>Categoria</label><select id="ctCategoria"><option value="FIXO" ${catInicial==='FIXO'?'selected':''}>Fixo</option><option value="VARIÁVEL" ${catInicial==='VARIÁVEL'?'selected':''}>Variável</option></select></div>
      </div>
      <div class="field"><label>Data de vencimento</label><input type="date" id="ctVenc" value="${existing&&existing.vencimento?existing.vencimento:''}"></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">${existing?'Guardar':'Criar'}</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
  if(projetado){
    document.querySelector('#modalRoot .modal-body').insertAdjacentHTML('afterbegin', `<div class="field-hint" style="margin-bottom:14px;">Está a editar a repetição de <strong>${monthLabel(mesVisualizado)}</strong>: vai ser criado um lançamento novo com estes dados, que passa a repetir daqui pra frente. Os meses anteriores não mudam.</div>`);
  }
  const btnSave = document.getElementById('mSave');
  btnSave.onclick = async ()=>{
    const nome = document.getElementById('ctNome').value.trim();
    if(!nome){ alert('Informe o nome do custo.'); return; }
    const valor = Number(document.getElementById('ctValor').value)||0;
    const categoria = document.getElementById('ctCategoria').value;
    const vencimento = document.getElementById('ctVenc').value || null;
    if(categoria==='FIXO' && !vencimento){ alert('Custo fixo precisa de data de vencimento (é ela que define o mês a partir do qual repete).'); return; }
    btnSave.disabled = true;
    const antes = JSON.stringify(STATE.costs);
    if(existingRaw){
      const r = salvarEdicaoCusto(existingRaw.id, mesVisualizado, {nome, valor, categoria, vencimento});
      if(r.erro){ alert(r.erro); btnSave.disabled = false; return; }
    } else {
      STATE.costs.push({id:novoIdCusto(), nome, valor, categoria, vencimento, pago:false});
    }
    await gravarCustosOuReverter(antes);
    closeModal(); renderAll();
  };
}

function wireViewportEvents(){
  const vp = document.getElementById('viewport');

  // Mini barra de período (Ranking, perfil do vendedor, painel do colaborador)
  vp.querySelectorAll('[data-periodgran]').forEach(b=>{

      renderAll();
    });
  });

  const pNext = vp.querySelector('[data-periodnext]');
  if(pPrev) pPrev.onclick = ()=>{ STATE.periodFilter.anchor = shiftPeriod(STATE.periodFilter, -1); renderAll(); };
  if(pNext) pNext.onclick = ()=>{ STATE.periodFilter.anchor = shiftPeriod(STATE.periodFilter, 1); renderAll(); };
  const pMonth = vp.querySelector('[data-periodmonth]');
  if(pMonth) pMonth.addEventListener('change', ()=>{ STATE.periodFilter.anchor = pMonth.value; renderAll(); });
  const pDate = vp.querySelector('[data-perioddate]');
  if(pDate) pDate.addEventListener('change', ()=>{ STATE.periodFilter.anchor = pDate.value; renderAll(); });

  // Barra de filtro genérica (Vendas, Financeiro)
  vp.querySelectorAll('.period-bar[data-filterkey]').forEach(bar=>{
    const key = bar.dataset.filterkey;
    bar.querySelectorAll('[data-gfgran]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const gran = b.dataset.gfgran;
        STATE[key] = { granularity: gran, anchor: gran==='month' ? todayISO().slice(0,7) : todayISO() };
        renderAll();
      });
    });
    const gfPrev = bar.querySelector('[data-gfprev]');
    const gfNext = bar.querySelector('[data-gfnext]');
    if(gfPrev) gfPrev.onclick = ()=>{ STATE[key].anchor = shiftPeriod(STATE[key], -1); renderAll(); };
    if(gfNext) gfNext.onclick = ()=>{ STATE[key].anchor = shiftPeriod(STATE[key], 1); renderAll(); };
    const gfMonth = bar.querySelector('[data-gfmonth]');
    if(gfMonth) gfMonth.addEventListener('change', ()=>{ STATE[key].anchor = gfMonth.value; renderAll(); });
    const gfDate = bar.querySelector('[data-gfdate]');
    if(gfDate) gfDate.addEventListener('change', ()=>{ STATE[key].anchor = gfDate.value; renderAll(); });
  });

  // Filtro de mês, Recorrências pagas
  vp.querySelectorAll('[data-paidmonth]').forEach(b=>{
    b.addEventListener('click', ()=>{ STATE.paidMonthFilter = b.dataset.paidmonth; renderAll(); });
  });

  vp.querySelectorAll('[data-parcela]').forEach(dot=>{
    dot.addEventListener('click', async ()=>{
      try{
        const recId = dot.dataset.rec, num = Number(dot.dataset.parcela);
        const rec = STATE.recurrences.find(r=>r.id===recId);
        if(!rec){ showErrorToast('recorrência '+recId+' não encontrada.'); return; }
        const parcela = rec.parcelas.find(pp=>pp.numero===num);
        if(!parcela){ showErrorToast('parcela '+num+' não encontrada.'); return; }
        // esse clique só existe pra parcelas JÁ pagas (desfazer), pra pagar
        // uma parcela pendente agora abre o modal, ver data-parcela-pagar.
        if(dot.dataset.ocupado) return; // evita duas gravações simultâneas
        dot.dataset.ocupado = '1';
        await salvarAlteracao(rec, ()=>{ parcela.pago = false; parcela.data = null; parcela.valor = null; },
          ()=>persistRecorrencia(rec), 'o desfazer da parcela NÃO foi gravado');
        renderAll();
      }catch(err){
        showErrorToast(err && err.message ? err.message : String(err));
      }
    });
  });
  vp.querySelectorAll('[data-parcela-pagar]').forEach(dot=>{

    el.addEventListener('click', ()=> abrirComissaoDetalhe(el.dataset.comissaoSeller, STATE.periodFilter));
  });

  vp.querySelectorAll('[data-detalhe-card]').forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalheCard(el.dataset.detalheCard, el.dataset.detalheFiltro==='financeiro' ? STATE.financeiroFilter : STATE.periodFilter, el.dataset.detalheSeller || null));
  });

  vp.querySelectorAll('[data-detalhe-origem]').forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalhePipeline('origem', el.dataset.detalheOrigem, STATE.clientesFilter));
  });
  vp.querySelectorAll('[data-detalhe-servico]').forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalhePipeline('servico', el.dataset.detalheServico, STATE.clientesFilter));
  });

  vp.querySelectorAll('[data-ftab]').forEach(b=> b.addEventListener('click', ()=>{ STATE.financeiroTab=b.dataset.ftab; renderAll(); }));

  vp.querySelectorAll('.linechart-wrap').forEach(wrap=>{
    const svg = wrap.querySelector('.linechart-svg');
    const hoverLine = wrap.querySelector('.lc-hoverline');
    const tooltip = wrap.querySelector('.lc-tooltip');
    if(!svg || !hoverLine || !tooltip) return;
    let months, series;
    try{
      months = JSON.parse(wrap.dataset.lcMonths.replace(/&apos;/g,"'"));
      series = JSON.parse(wrap.dataset.lcSeries.replace(/&apos;/g,"'"));
    }catch(e){ return; }
    const padL = Number(wrap.dataset.lcPadl), innerW = Number(wrap.dataset.lcInnerw);
    const W = 640;
    const fmtVal = (v, tipo)=> tipo==='pct' ? v.toFixed(1)+'%' : tipo==='int' ? Math.round(v)+' lead'+(Math.round(v)===1?'':'s') : fmtEUR(v);
    const mostra = (clientX)=>{
      const rect = svg.getBoundingClientRect();
      const relX = (clientX-rect.left)/rect.width*W;
      let idx = months.length>1 ? Math.round(((relX-padL)/innerW)*(months.length-1)) : 0;
      idx = Math.max(0, Math.min(months.length-1, idx));
      const xPix = months.length>1 ? padL+(idx/(months.length-1))*innerW : padL+innerW/2;
      hoverLine.setAttribute('x1', xPix); hoverLine.setAttribute('x2', xPix); hoverLine.setAttribute('opacity','1');
      tooltip.innerHTML = `<strong>${months[idx]}</strong>` + series.map(s=>`<span style="color:${s.color==='#520225'?'#e8a6c4':s.color}">●</span> ${s.label}: <strong>${fmtVal(s.values[idx], s.fmt)}</strong>`).join('<br>');
      tooltip.style.display = 'block';
      const pctX = (xPix/W)*100;
      tooltip.style.left = Math.min(88,Math.max(12,pctX))+'%';
    };
    svg.addEventListener('mousemove', e=>mostra(e.clientX));
    svg.addEventListener('touchmove', e=>{ if(e.touches[0]) mostra(e.touches[0].clientX); }, {passive:true});
    svg.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; hoverLine.setAttribute('opacity','0'); });
  });

  vp.querySelectorAll('[data-search-key]').forEach(input=>{
    input.addEventListener('input', ()=>{
      STATE[input.dataset.searchKey] = input.value;
      renderAll();
      const el = document.querySelector(`[data-search-key="${input.dataset.searchKey}"]`);
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  });
  const extratoDataInput = document.getElementById('extratoDataInput');
  vp.querySelectorAll('[data-estornar]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      let ref;
      try{ ref = JSON.parse(btn.dataset.estornar); }catch(e){ return; }
      const desc = btn.dataset.estornarDesc || 'este lançamento';
      const ehVenda = ref.tipo==='venda';
      openConfirmModal({
        title: ehVenda ? 'Estornar venda' : 'Desfazer lançamento',
        danger: true,
        confirmLabel: ehVenda ? 'Estornar' : 'Desfazer',
        message: ehVenda
          ? `Isso vai estornar <strong>${desc}</strong>, o valor recebido volta a zero e a venda passa a aparecer como pendente (ela não desaparece do sistema). Tem a certeza?`
          : `Isso vai desfazer <strong>${desc}</strong>, voltando o valor a ficar em aberto. Tem a certeza?`,
        onConfirm: async ()=>{ if(await estornarLancamento(ref)) showSuccessToast(ehVenda ? 'Venda estornada.' : 'Lançamento desfeito.'); renderAll(); }
      });
    });
  });
  const btnRefreshLeads = document.getElementById('btnRefreshLeads');
  if(btnRefreshLeads) btnRefreshLeads.addEventListener('click', ()=>{ STATE.leads = []; loadLeadsData(); });
  const btnRetryLeads = document.getElementById('btnRetryLeads');
  if(btnRetryLeads) btnRetryLeads.addEventListener('click', ()=>{ STATE.leadsError = null; loadLeadsData(); });
  const btnRefreshLeads2 = document.getElementById('btnRefreshLeads2');
  const btnBuscarIndice = document.getElementById('btnBuscarIndice');
  const btnToggleRecemPagas = document.getElementById('btnToggleRecemPagas');
  if(btnToggleRecemPagas) btnToggleRecemPagas.addEventListener('click', ()=>{ STATE.mostrarRecemPagas = !STATE.mostrarRecemPagas; renderAll(); });
  const btnToggleVendedoresInativos = document.getElementById('btnToggleVendedoresInativos');
  if(btnToggleVendedoresInativos) btnToggleVendedoresInativos.addEventListener('click', ()=>{ STATE.mostrarVendedoresInativos = !STATE.mostrarVendedoresInativos; renderAll(); });
  const campanhasResponsavelSelect = document.getElementById('campanhasResponsavelSelect');
  if(campanhasResponsavelSelect) campanhasResponsavelSelect.addEventListener('change', ()=>{ STATE.campanhasResponsavelFilter = campanhasResponsavelSelect.value; renderAll(); });

  const btnNovoLeadManual = document.getElementById('btnNovoLeadManual');
  if(btnNovoLeadManual) btnNovoLeadManual.addEventListener('click', ()=> abrirNovoLeadManualModal(null));
  vp.querySelectorAll('[data-edit-lead-manual]').forEach(btn=>{
    btn.addEventListener('click', ()=> abrirNovoLeadManualModal(btn.dataset.editLeadManual));
  });
  vp.querySelectorAll('[data-del-lead-manual]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const lead = STATE.controleLeads.find(l=>l.id===btn.dataset.delLeadManual);
      if(!lead) return;
      openConfirmModal({
        title:'Excluir lead', danger:true, confirmLabel:'Excluir',
        message:`Tem a certeza que deseja excluir o lead <strong>${lead.nome}</strong>?`,
        onConfirm: async ()=>{ STATE.controleLeads = STATE.controleLeads.filter(l=>l.id!==lead.id); await persist('controleLeads'); renderAll(); }
      });
    });
  });
  const clResponsavelSelect = document.getElementById('clResponsavelSelect');
  if(clResponsavelSelect) clResponsavelSelect.addEventListener('change', ()=>{ STATE.controleLeadsResponsavelFilter = clResponsavelSelect.value; renderAll(); });

  const btnNovoFollowUp = document.getElementById('btnNovoFollowUp');
  if(btnNovoFollowUp) btnNovoFollowUp.addEventListener('click', ()=> abrirNovoFollowUpModal());
  vp.querySelectorAll('[data-ver-followup]').forEach(card=>{
    card.addEventListener('click', ()=> abrirDetalheFollowUpModal(card.dataset.verFollowup));
  });
  const indiceQueryInput = document.getElementById('indiceQueryInput');
  if(btnBuscarIndice && indiceQueryInput){
    const dispara = ()=>{ STATE.indiceQuery = indiceQueryInput.value; STATE.indiceQuerySubmetida = indiceQueryInput.value.trim(); renderAll(); };
    btnBuscarIndice.addEventListener('click', dispara);
    indiceQueryInput.addEventListener('keydown', e=>{ if(e.key==='Enter') dispara(); });
  }
  if(btnRefreshLeads2) btnRefreshLeads2.addEventListener('click', ()=>{ STATE.leads = []; loadLeadsData(); });
  vp.querySelectorAll('[data-cctab]').forEach(b=>{
    b.addEventListener('click', ()=>{ STATE.controleCampanhasTab = b.dataset.cctab; renderAll(); });
  });
  vp.querySelectorAll('[data-lead-key]').forEach(el=>{
    const ev = el.tagName==='SELECT' ? 'change' : 'blur';
    el.addEventListener(ev, async ()=>{
      const key = el.dataset.leadKey, campo = el.dataset.leadField;
      if(!STATE.leadEdits[key]) STATE.leadEdits[key] = {};
      STATE.leadEdits[key][campo] = el.value;
      if(el.tagName==='SELECT'){
        const cor = corFriaParaTexto(el.value);
        el.style.background = cor.bg; el.style.color = cor.fg; el.style.borderColor = cor.bg;
      }
      await persist('leadEdits');
    });
  });
  if(extratoDataInput) extratoDataInput.addEventListener('change', ()=>{ STATE.extratoData = extratoDataInput.value; renderAll(); });
  const btnAddCost = document.getElementById('btnAddCost');
  if(btnAddCost) btnAddCost.onclick = ()=>openCostModal(null, btnAddCost.dataset.defaultCategoria);
  vp.querySelectorAll('[data-edit-cost]').forEach(b=> b.addEventListener('click', ()=>openCostModal(b.dataset.editCost, null, b.dataset.costMonth||null)));
  vp.querySelectorAll('[data-toggle-cost]').forEach(b=> b.addEventListener('click', async ()=>{
    const c = STATE.costs.find(x=>x.id===b.dataset.toggleCost);
    if(!c) return;
    const mes = b.dataset.costMonth || null;
    const projetado = c.categoria==='FIXO' && mes && c.vencimento && mes!==mesDe(c.vencimento);
    const estavaPago = projetado ? costPagoNoMes(c, mes) : !!c.pago;
    if(!estavaPago){ abrirPagamentoCustoModal(c.id, mes); return; }
    openConfirmModal({
      title:'Desfazer pagamento', confirmLabel:'Desfazer',
      message:`Marcar <strong>${c.nome}</strong>${mes?' ('+monthLabel(mes)+')':''} como pendente de novo?`,
      onConfirm: async ()=>{
        const antes = JSON.stringify(STATE.costs);
        desmarcarCustoPago(c.id, mes);
        await gravarCustosOuReverter(antes);
        renderAll();
      }
    });
  }));
  vp.querySelectorAll('[data-pagar-custo]').forEach(b=> b.addEventListener('click', ()=>abrirPagamentoCustoModal(b.dataset.pagarCusto, b.dataset.custoMonth||null)));
  vp.querySelectorAll('[data-del-cost]').forEach(b=> b.addEventListener('click', ()=>{
    const repete = b.dataset.delCostRepete==='1';
    const mes = b.dataset.costMonth || null;
    openConfirmModal({
      title:'Excluir custo', danger:true, confirmLabel:'Excluir',
      message: repete
        ? `Este custo repete todo mês. Excluir aqui <strong>interrompe a repetição a partir de ${monthLabel(mes)}</strong>. Os meses anteriores (e os pagamentos já registados neles) ficam como estão. Para voltar a ter este custo, lance-o de novo manualmente.`
        : 'Excluir este lançamento? Se ele estiver a repetir nos meses seguintes, essas repetições também deixam de aparecer.',
      onConfirm: async ()=>{
        const antes = JSON.stringify(STATE.costs);
        const r = excluirCusto(b.dataset.delCost, mes);
        if(r.erro){ alert(r.erro); return; }
        await gravarCustosOuReverter(antes);
        renderAll();
      }
    });
  }));
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function renderAll(){
  try{
    if(!STATE.role){ renderLoginScreen('signin'); return; }
    renderNav();
    renderTopbar();
    const vp = document.getElementById('viewport');
    if(STATE.view==='overview') vp.innerHTML = renderOverview();
    else if(STATE.view==='recurrences') vp.innerHTML = renderRecurrences();
    else if(STATE.view==='recurrences-paid') vp.innerHTML = renderRecurrencesPaid();
    else if(STATE.view==='recurrences-nodate') vp.innerHTML = renderRecurrencesNoDate();
    else if(STATE.view==='sales') vp.innerHTML = renderSales();
    else if(STATE.view==='ranking') vp.innerHTML = renderRanking();
    else if(STATE.view==='clientes') vp.innerHTML = renderClientes();
    else if(STATE.view==='metricas') vp.innerHTML = renderMetricas();
    else if(STATE.view==='campanhas') vp.innerHTML = renderControleCampanhas();
    else if(STATE.view==='indice') vp.innerHTML = renderIndice();
    else if(STATE.view==='vendedores') vp.innerHTML = renderVendedoresOverview();
    else if(STATE.view==='controle-leads') vp.innerHTML = renderControleLeads();
    else if(STATE.view==='follow-up') vp.innerHTML = renderFollowUp();
    else if(STATE.view==='seller-detail') vp.innerHTML = renderSellerDetail();
    else if(STATE.view==='config') vp.innerHTML = renderConfig();
    else if(STATE.view==='financeiro') vp.innerHTML = renderFinanceiro();
    else if(STATE.view==='my-panel') vp.innerHTML = renderMyPanel();
    else if(STATE.view==='my-funil') vp.innerHTML = renderMyFunil();
    wireViewportEvents();
  }catch(err){
    console.error(err);
    showErrorToast(err && err.message ? err.message : String(err));
  }
}

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  await supa.auth.signOut();
  STATE.role=null; STATE.myOwnSellerId=null; STATE.myEmail=null;
  STATE.sales=[]; STATE.recurrences=[]; STATE.costs=[];
  renderLoginScreen('signin');
});

(async function init(){
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    const profile = await resolveProfile();
    if(profile && profile.status==='approved'){
      STATE.role = profile.role;
      STATE.myOwnSellerId = profile.sellerId;
      STATE.myEmail = profile.email;
      await bootAfterLogin();
      return;
    }
    await supa.auth.signOut();
    if(profile && profile.status==='pending'){ renderLoginScreen('pending'); return; }
    if(profile && profile.status==='rejected'){ renderLoginScreen('rejected'); return; }
  }
  renderLoginScreen('signin');
})();
</script>
