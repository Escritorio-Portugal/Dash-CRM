function renderSearchBar(stateKey, placeholder){
  return `<div style="margin-bottom:14px;"><input type="text" class="search-input" data-search-key="${stateKey}" placeholder="${placeholder}" value="${(STATE[stateKey]||'').replace(/"/g,'&quot;')}" style="width:100%;max-width:340px;"></div>`;

function matchesSearch(text, query){
  if(!query) return true;
  return (text||'').toString().toUpperCase().includes(query.trim().toUpperCase());

/* =========================================================
   CLIENTES / ANÁLISE (gestor) — ranking de clientes, fluxo de
   clientes novos x recorrentes, funil agregado de todos os
   vendedores e composição do pipeline por origem.
   ========================================================= */
function normCliente(s){ return (s||'').trim().toUpperCase().replace(/\s+/g,' '); }

/* Um "fechamento" por linha — venda avulsa OU recorrência, sem duplicar o
   mesmo negócio (vendas com jaContabilizadoViaRecorrencia já são a mesma
   recorrência, então saem daqui pra não contar duas vezes). */
function todosFechamentos(){
  const deSales = STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia).map(s=>({
    cliente:s.cliente, data:s.data, valor:s.valorTotal||0, vendedorNome:s.vendedorNome, origem:s.origem
  }));
  const deRecs = STATE.recurrences.map(r=>({
    cliente:r.cliente, data:r.dataVenda, valor:r.valorContrato||0, vendedorNome:r.vendedorNome, origem:'RECORRENCIA'
  }));
  return [...deSales, ...deRecs].filter(f=>f.cliente && f.data);
}

/* Ranking de clientes por nº de fechamentos — histórico completo, porque
   "fidelidade" não faz sentido restrita a um único mês. */
function rankingClientes(){
  const map = new Map();
  todosFechamentos().forEach(f=>{
    const k = normCliente(f.cliente);
    if(!map.has(k)) map.set(k, { nome:f.cliente, fechamentos:0, valorTotal:0, vendedores:new Set(), primeira:f.data, ultima:f.data });
    const c = map.get(k);
    c.fechamentos++;
    c.valorTotal += f.valor;
    c.vendedores.add(f.vendedorNome||'—');
    if(f.data < c.primeira) c.primeira = f.data;
    if(f.data > c.ultima) c.ultima = f.data;
  });
  return [...map.values()].sort((a,b)=> b.fechamentos - a.fechamentos || b.valorTotal - a.valorTotal);
}

/* Fluxo de pessoas no período: novos (1ª compra caiu dentro do período) x
   recorrentes (já eram clientes antes do período começar). */
function fluxoClientes(filter){
  const todos = todosFechamentos();
  const primeiraPorCliente = new Map();
  todos.forEach(f=>{
    const k = normCliente(f.cliente);
    if(!primeiraPorCliente.has(k) || f.data < primeiraPorCliente.get(k)) primeiraPorCliente.set(k, f.data);
  });
  const clientesNoPeriodo = new Set(todos.filter(f=>inPeriodOrAll(f.data, filter)).map(f=>normCliente(f.cliente)));
  let novos=0, recorrentes=0;
  clientesNoPeriodo.forEach(k=>{ inPeriodOrAll(primeiraPorCliente.get(k), filter) ? novos++ : recorrentes++; });
  return { novos, recorrentes, total: clientesNoPeriodo.size };
}

/* Funil agregado — soma o funil diário (preenchido por vendedor) de todos
   os vendedores ativos no período, na mesma estrutura da planilha. */
function funilAgregado(filter){
  const out = { conversas:0, respondeu:0, consultaMarcada:0, leadsQualificados:0, vendasConsultaMarcada:0, reagendado:0, noShow:0, consultaRealizada:0, vendaForaConsulta:0 };
  activeSellers().forEach(s=>{
    const f = sumFunilDiario(s, filter);
    Object.keys(out).forEach(k=>{ out[k] += f[k]||0; });
  });
  out.fechamentos = out.vendasConsultaMarcada + out.vendaForaConsulta;
  return out;
}

/* Composição do "Valor Vendido" por origem do lead, no período — de onde
   vieram as vendas, por valor. Conta TODAS as vendas (mesmo as que também
   têm uma recorrência associada) porque "Valor Vendido" sempre conta assim
   em todo o resto do sistema — jaContabilizadoViaRecorrencia só existe pra
   não duplicar CAIXA/comissão, não afeta valor vendido. */
function composicaoPorOrigem(filter){
  const salesIn = STATE.sales.filter(s=>inPeriodOrAll(s.data, filter));
  const map = {};
  salesIn.forEach(s=>{
    const o = s.origem || 'NÃO INFORMADO';
    if(!map[o]) map[o] = {count:0, valor:0};
    map[o].count++; map[o].valor += s.valorTotal||0;
  });
  return Object.entries(map).map(([origem,v])=>({origem, ...v})).sort((a,b)=>b.valor-a.valor);
}

/* Composição por serviço: quantos clientes distintos compraram cada
   serviço no período, e o valor total gerado por ele. */
function composicaoPorServico(filter){
  const salesIn = STATE.sales.filter(s=>inPeriodOrAll(s.data, filter));
  const map = {};
  salesIn.forEach(s=>{
    const srv = s.servico || 'NÃO INFORMADO';
    if(!map[srv]) map[srv] = {count:0, valor:0, clientes:new Set()};
    map[srv].count++; map[srv].valor += s.valorTotal||0; map[srv].clientes.add(normCliente(s.cliente));
  });
  return Object.entries(map).map(([servico,v])=>({servico, count:v.count, valor:v.valor, nClientes:v.clientes.size})).sort((a,b)=>b.nClientes-a.nClientes);
}
/* Detalhamento clicável: quem exatamente compõe uma barra de "origem" ou
   de "serviço" no pipeline — data, cliente, vendedor, valores e pendente. */
function abrirDetalhePipeline(tipo, chave, filter){
  const linhas = STATE.sales.filter(s=>inPeriodOrAll(s.data, filter) && (tipo==='origem' ? (s.origem||'NÃO INFORMADO')===chave : (s.servico||'NÃO INFORMADO')===chave))

      const st = saleStatus(s);
      return { data:s.data, cliente:s.cliente, vendedor:s.vendedorNome, servico:s.servico, origem:s.origem, valorTotal:s.valorTotal, valorPago:s.valorPago, pendente:st.valorPendente };
    }).sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const totalValor = linhas.reduce((a,l)=>a+l.valorTotal,0);
  const titulo = tipo==='origem' ? `Leads que vieram de "${chave}"` : `Clientes que compraram "${chave}"`;
  document.getElementById('modalRoot').innerHTML = `

      <tbody>${linhas.map(l=>`<tr><td>${fmtDate(l.data)}</td><td><strong>${l.cliente}</strong></td><td>${l.vendedor||'—'}</td><td>${tipo==='origem'?(l.servico||'—'):(l.origem||'—')}</td><td class="tnum">${fmtEUR(l.valorTotal)}</td><td class="tnum">${fmtEUR(l.valorPago)}</td><td class="tnum ${l.pendente>0.005?'bad':''}">${l.pendente>0.005?fmtEUR(l.pendente):'quitado'}</td></tr>`).join('')}</tbody></table></div>
      <div class="block-head" style="border-top:1px solid var(--line);margin-top:2px;background:var(--surface-2);"><span>${linhas.length} venda(s)</span><span><strong>${fmtEUR(totalValor)}</strong></span></div>`

}

/* Evolução mês a mês de um vendedor: quanto vendeu integral, quanto em
   recorrência, o total dos dois, e quantos clientes distintos fecharam
   negócio com ele naquele mês (recorrência ou venda integral). */
function evolucaoMensalVendedor(sellerId){
  const porMes = new Map();
  const pega = (mk)=>{ if(!porMes.has(mk)) porMes.set(mk, {integral:0, recorrente:0, clientes:new Set()}); return porMes.get(mk); };
  STATE.sales.filter(s=>s.vendedorId===sellerId && !s.jaContabilizadoViaRecorrencia && s.data).forEach(s=>{
    const m = pega(s.data.slice(0,7));
    m.integral += s.valorTotal||0;
    m.clientes.add(normCliente(s.cliente));
  });
  STATE.recurrences.filter(r=>r.vendedorId===sellerId && r.dataVenda).forEach(r=>{
    const m = pega(r.dataVenda.slice(0,7));
    m.recorrente += r.valorContrato||0;
    m.clientes.add(normCliente(r.cliente));
  });
  return [...porMes.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([mes,v])=>({
    mes, integral:v.integral, recorrente:v.recorrente, total:v.integral+v.recorrente, clientes:v.clientes.size
  }));
}
function renderEvolucaoMensalVendedor(sellerId){
  const dados = evolucaoMensalVendedor(sellerId);
  if(dados.length<2) return ''; // não vale a pena um gráfico com 0 ou 1 mês
  const maxTotal = Math.max(...dados.map(d=>d.total), 1);
  const maxClientes = Math.max(...dados.map(d=>d.clientes), 1);
  const mesCurto = mk => monthLabel(mk).split(' de ')[0].slice(0,3);
  return `

        <h4>Total vendido por mês (integral + recorrente)</h4>
        <div class="vbar-chart">${dados.map(d=>`
          <div class="vbar-col">
            <div class="vbar-track" style="flex-direction:column-reverse;">
              <span style="height:${maxTotal>0?(d.integral/maxTotal*100):0}%;background:var(--wine);border-radius:0;" title="Integral: ${fmtEUR(d.integral)}"></span>
              <span style="height:${maxTotal>0?(d.recorrente/maxTotal*100):0}%;background:var(--gold);border-radius:4px 4px 0 0;" title="Recorrente: ${fmtEUR(d.recorrente)}"></span>
            </div>
            <div class="vbar-val">${fmtEUR(d.total)}</div>
            <div class="vbar-label">${mesCurto(d.mes)}</div>
          </div>`).join('')}
        </div>
        <div class="field-hint" style="margin-top:10px;"><span style="color:var(--gold);">■</span> Recorrente &nbsp; <span style="color:var(--wine);">■</span> Integral</div>
      </div>
      <div class="chart-col">
        <h4>Clientes distintos por mês</h4>
        <div class="vbar-chart">${dados.map(d=>`
          <div class="vbar-col">
            <div class="vbar-track"><span style="height:${(d.clientes/maxClientes*100)}%"></span></div>
            <div class="vbar-val">${d.clientes}</div>
            <div class="vbar-label">${mesCurto(d.mes)}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>
  </section>`;
}

/* Extrato do dia: tudo que mexeu no caixa naquele dia específico — vendas
   recebidas, entrada/parcelas de recorrência, e custos com vencimento
   naquele dia (fixos ou variáveis, pagos ou pendentes). */
/* Lista unificada de movimentações financeiras num período qualquer — usada
   tanto no Extrato do dia (período = 1 dia) quanto no Registro (qualquer
   período). Cada linha já vem com emoji, categoria e sinal (+/-) prontos. */
function linhasFinanceiras(filter){
  const linhas = [];
  STATE.sales.filter(s=>!s.jaContabilizadoViaRecorrencia && (s.valorPago||0)>0 && inPeriodOrAll(s.data, filter)).forEach(s=>{
    linhas.push({ data:s.data, emoji:'💳', tipo:'Venda integral', categoria:'Receita', cliente:s.cliente, vendedor:s.vendedorNome, forma:s.formaPagamento||'—', valor:s.valorPago, sinal:1 });
  });
  STATE.recurrences.forEach(r=>{
    const st = recStatus(r);
    if((r.valorEntrada||0)>0 && inPeriodOrAll(r.dataVenda, filter)){
      linhas.push({ data:r.dataVenda, emoji:'🔁', tipo:'Entrada de recorrência', categoria:'Receita', cliente:r.cliente, vendedor:r.vendedorNome, forma:r.formaPagamento||'—', valor:r.valorEntrada, sinal:1 });
    }
    r.parcelas.forEach(p=>{
      if(p.pago && p.data && inPeriodOrAll(p.data, filter)){
        linhas.push({ data:p.data, emoji:'🔁', tipo:'Parcela '+p.numero+' de recorrência', categoria:'Receita', cliente:r.cliente, vendedor:r.vendedorNome, forma:r.formaPagamento||'—', valor:st.valorParcela, sinal:1 });
      }
    });
  });
  STATE.costs.filter(c=>c.categoria==='FIXO').forEach(c=>{
    if(c.pago && c.dataPagamento && inPeriodOrAll(c.dataPagamento, filter)){
      linhas.push({ data:c.dataPagamento, emoji:'🏠', tipo:'Custo fixo', categoria:'Despesa', cliente:c.nome, vendedor:'—', forma:'—', valor:c.valor, sinal:-1 });
    }
    if(c.pagoPorMes){
      Object.values(c.pagoPorMes).forEach(reg=>{
        if(reg && typeof reg==='object' && reg.pago && reg.data && inPeriodOrAll(reg.data, filter)){
          linhas.push({ data:reg.data, emoji:'🏠', tipo:'Custo fixo', categoria:'Despesa', cliente:c.nome, vendedor:'—', forma:'—', valor:c.valor, sinal:-1 });
        }
      });
    }
  });
  STATE.costs.filter(c=>c.categoria==='VARIÁVEL' && c.pago && inPeriodOrAll(c.vencimento, filter)).forEach(c=>{
    linhas.push({ data:c.vencimento, emoji:'📦', tipo:'Custo variável', categoria:'Despesa', cliente:c.nome, vendedor:'—', forma:'—', valor:c.valor, sinal:-1 });
  });
  return linhas.sort((a,b)=> (b.data||'').localeCompare(a.data||''));
}
function renderExtratoTab(){
  const data = STATE.extratoData || todayISO();
  const monthKey = data.slice(0,7);
  const filtroDia = {granularity:'day', anchor:data};
  let linhas = linhasFinanceiras(filtroDia);
  // pendências (ainda não pagas) com vencimento nesse dia — mostradas à parte
  const pendentes = [];
  custosFixosDoMes(monthKey).forEach(c=>{
    if(!c.pago && c.vencimento===data) pendentes.push({ data, emoji:'⏳', tipo:'Custo fixo (pendente)', categoria:'Despesa', cliente:c.nome, vendedor:'—', forma:'—', valor:c.valor, sinal:-1 });
  });
  STATE.costs.filter(c=>c.categoria==='VARIÁVEL' && !c.pago && c.vencimento===data).forEach(c=>{
    pendentes.push({ data, emoji:'⏳', tipo:'Custo variável (pendente)', categoria:'Despesa', cliente:c.nome, vendedor:'—', forma:'—', valor:c.valor, sinal:-1 });
  });
  linhas = linhas.filter(l=>matchesSearch(l.cliente, STATE.searchFinanceiro));
  const pendentesFiltradas = pendentes.filter(l=>matchesSearch(l.cliente, STATE.searchFinanceiro));
  const totalEntrou = linhas.filter(l=>l.sinal>0).reduce((a,l)=>a+l.valor,0);
  const totalSaiu = linhas.filter(l=>l.sinal<0).reduce((a,l)=>a+l.valor,0);
  const saldo = totalEntrou - totalSaiu;
  const todasLinhas = [...linhas, ...pendentesFiltradas];
  return `
  <div class="field-row" style="max-width:460px;margin-bottom:14px;">
    <div class="field"><label>Data</label><input type="date" id="extratoDataInput" value="${data}"></div>
  </div>
  ${renderSearchBar('searchFinanceiro','Buscar por nome…')}
  <section class="block saldo-hero-block">
    <div class="saldo-hero">
      <div class="saldo-hero-lbl">💰 Saldo do dia — ${fmtDate(data)}</div>
      <div class="saldo-hero-val ${saldo>=0?'good':'bad'}">${fmtEUR(saldo)}</div>
      <div class="saldo-hero-sub">🟢 entrou ${fmtEUR(totalEntrou)} &nbsp;·&nbsp; 🔴 saiu ${fmtEUR(totalSaiu)}</div>
    </div>
  </section>
  <section class="block">
    <div class="block-head"><h3>Movimentações de ${fmtDate(data)} (${todasLinhas.length})</h3><span class="hint">mais recente primeiro</span></div>
    ${todasLinhas.length ? `<div class="extrato-list">${todasLinhas.map(l=>`
      <div class="extrato-item">
        <div class="extrato-icon">${l.emoji}</div>
        <div class="extrato-main">
          <div class="extrato-titulo">${l.tipo} — ${l.cliente}</div>
          <div class="extrato-tags"><span class="chip ${l.categoria==='Receita'?'good':'bad'}">${l.categoria}</span>${l.vendedor&&l.vendedor!=='—'?`<span class="chip neutral">👤 ${l.vendedor}</span>`:''}${l.forma&&l.forma!=='—'?`<span class="chip neutral">💳 ${l.forma}</span>`:''}${l.tipo.includes('pendente')?'<span class="chip bad">pendente</span>':''}</div>
        </div>
        <div class="extrato-valor ${l.sinal>0?'good':'bad'}">${l.sinal>0?'+':'−'} ${fmtEUR(l.valor)}</div>
      </div>`).join('')}</div>` : `<div class="empty">Nenhuma movimentação registada nesse dia.</div>`}
  </section>`;
}
/* Registro do período — igual ao Extrato, mas pra qualquer intervalo (não só
   um dia), sincronizado ao vivo com vendas e recorrências: cada pagamento
   novo já aparece aqui assim que é lançado, sem precisar de nenhum passo
   extra. */
function renderRegistroTab(filter){
  const linhas = linhasFinanceiras(filter).filter(l=>matchesSearch(l.cliente, STATE.searchFinanceiro));
  const totalEntrou = linhas.filter(l=>l.sinal>0).reduce((a,l)=>a+l.valor,0);
  const totalSaiu = linhas.filter(l=>l.sinal<0).reduce((a,l)=>a+l.valor,0);
  return `

  <div class="cards">
    <div class="card"><div class="lbl">🟢 Entrou no período</div><div class="val good">${fmtEUR(totalEntrou)}</div></div>
    <div class="card"><div class="lbl">🔴 Saiu no período</div><div class="val bad">${fmtEUR(totalSaiu)}</div></div>
    <div class="card accent"><div class="lbl">💰 Saldo do período</div><div class="val ${totalEntrou-totalSaiu>=0?'good':'bad'}">${fmtEUR(totalEntrou-totalSaiu)}</div></div>
  </div>
  <section class="block">
    <div class="block-head"><h3>Registos do período (${linhas.length})</h3><span class="hint">ao vivo — toda venda, recorrência e custo pago aparece aqui na hora</span></div>
    ${linhas.length ? `<table><thead><tr><th>Descrição</th><th>Tipo</th><th>Categoria</th><th>Data</th><th>Fonte</th><th>Valor</th></tr></thead>
    <tbody>${linhas.map(l=>`<tr>
        <td>${l.emoji} <strong>${l.cliente}</strong>${l.vendedor&&l.vendedor!=='—'?` <span style="color:var(--ink-soft);font-size:11.5px;">· ${l.vendedor}</span>`:''}</td>
        <td>${l.tipo}</td>
        <td><span class="chip ${l.categoria==='Receita'?'good':'bad'}">${l.categoria}</span></td>
        <td>${fmtDate(l.data)}</td>
        <td>${l.forma}</td>
        <td class="tnum ${l.sinal>0?'good':'bad'}">${l.sinal>0?'+':'−'} ${fmtEUR(l.valor)}</td>
      </tr>`).join('')}</tbody></table>` : `<div class="empty">Nenhum registo nesse período.</div>`}
  </section>`;
}
function renderImpostosTab(filter){

/* Modal único de lançamento rápido: o gestor/colaborador escolhe o tipo
   (venda integral ou recorrência) e o sistema cria o registo na área certa
   automaticamente — Vendas ou Recorrências. */
function openQuickAddModal(initialTipo, forColaborador){
  let tipo = initialTipo || 'integral';
  const opts = activeSellers().map(s=>`<option value="${s.id}">${s.nome}</option>`).join('');
  const serviceOpts = [...STATE.services].sort((a,b)=>a.nome.localeCompare(b.nome,'pt')).map(s=>`<option value="${s.nome}">`).join('');
  const formasPagamento = formasPagamentoList();

  function render(){
    document.getElementById('modalRoot').innerHTML = `
    <div class="modal-backdrop" id="mBackdrop"><div class="modal">
      <div class="modal-head"><h3>Novo lançamento</h3><button id="mClose">&times;</button></div>
      <div class="modal-body">
        <div class="subtabs" style="padding:0 0 16px;">
          <button data-qtype="integral" class="${tipo==='integral'?'active':''}">Venda integral</button>
          <button data-qtype="recorrencia" class="${tipo==='recorrencia'?'active':''}">Recorrência</button>
        </div>
        <div class="field-hint" style="margin:-8px 0 14px;">${tipo==='integral' ? 'Cliente pagou o valor todo de uma vez — entra direto em Vendas.' : 'Cliente vai pagar em parcelas (com ou sem entrada) — entra em Recorrências.'}</div>
        <div class="field"><label>Cliente</label><input type="text" id="qCliente" placeholder="Nome do cliente"></div>
        <div class="field"><label>Serviço</label><input list="qServiceList" id="qServico" placeholder="Comece a digitar para escolher do catálogo…"><datalist id="qServiceList">${serviceOpts}</datalist>
          <div class="field-hint" id="qServicoPreview">Selecione um serviço do catálogo para preencher o valor automaticamente, ou digite um nome livre.</div>
        </div>
        <div class="field-row">
          <div class="field"><label>Data</label><input type="date" id="qData"></div>
          ${forColaborador ? '' : `<div class="field"><label>Vendedor</label><select id="qVendedor">${opts}</select></div>`}
        </div>
        <div id="qIntegralFields" style="${tipo==='integral'?'':'display:none;'}">
          <div class="field-row">
            <div class="field"><label>Valor pago (€)</label><input type="number" id="qValorPago" min="0" step="0.01"></div>
            <div class="field"><label>Forma de pagamento</label><select id="qFormaPagamento">${formasPagamento.map(f=>`<option>${f}</option>`).join('')}</select></div>
          </div>
        </div>
        <div id="qRecFields" style="${tipo==='recorrencia'?'':'display:none;'}">
          <div class="field-row">
            <div class="field"><label>Valor do contrato (€)</label><input type="number" id="qValorContrato" min="0" step="0.01"></div>
            <div class="field"><label>Valor de entrada (€)</label><input type="number" id="qEntrada" min="0" step="0.01" value="0"></div>
          </div>
          <div class="field-row">
            <div class="field"><label>Nº de parcelas (após a entrada)</label><select id="qParcelas"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
            <div class="field"><label>Forma de pagamento</label><select id="qFormaPagamentoRec">${formasPagamento.map(f=>`<option>${f}</option>`).join('')}</select></div>
          </div>
        </div>
      </div>
      <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Criar</button></div>
    </div></div>`;
    wire();
  }

  function wire(){
    document.getElementById('mClose').onclick = closeModal;
    document.getElementById('mCancel').onclick = closeModal;
    document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });
    document.querySelectorAll('[data-qtype]').forEach(b=>{
      b.addEventListener('click', ()=>{
        // preserva o que já foi digitado ao trocar de tipo
        const cliente = document.getElementById('qCliente').value;
        const servico = document.getElementById('qServico').value;
        const data = document.getElementById('qData').value;
        tipo = b.dataset.qtype;
        render();
        document.getElementById('qCliente').value = cliente;
        document.getElementById('qServico').value = servico;
        document.getElementById('qData').value = data;
      });
    });

    let matchedService = null;
    const qServico = document.getElementById('qServico');
    qServico.addEventListener('input', ()=>{
      matchedService = serviceByName(qServico.value);
      const prev = document.getElementById('qServicoPreview');
      if(matchedService){
        if(tipo==='integral'){ document.getElementById('qValorPago').value = matchedService.honorarioFinal; }
        else { document.getElementById('qValorContrato').value = matchedService.honorarioFinal; }
        prev.innerHTML = `Honorário base: <strong>${fmtEUR(matchedService.honorarioBase)}</strong> · IVA: ${fmtEUR(matchedService.iva)} · Taxa adm.: ${fmtEUR(matchedService.txAdm)}`;
      } else {
        prev.textContent = 'Serviço não cadastrado no catálogo — será registado sem detalhamento de imposto (edite em Configurações > Serviços depois, se quiser).';
      }
    });

    document.getElementById('mSave').onclick = async ()=>{
      const cliente = document.getElementById('qCliente').value.trim();
      const servico = qServico.value.trim();
      const data = document.getElementById('qData').value || new Date().toISOString().slice(0,10);
      const vendedorId = forColaborador ? STATE.myOwnSellerId : document.getElementById('qVendedor').value;
      const vendedor = sellerById(vendedorId);
      if(!cliente){ alert('Informe o nome do cliente.'); return; }

      if(tipo==='integral'){
        const valorPago = Number(document.getElementById('qValorPago').value)||0;
        if(!valorPago){ alert('Informe o valor pago.'); return; }
        const formaPagamento = document.getElementById('qFormaPagamento').value;
        STATE.sales.push({
          id:'vda-'+Date.now(), data, cliente, vendedorId, vendedorNome: vendedor?vendedor.nome:'—',
          origem:'Manual', servico, valorTotal: valorPago, valorPago, pagamentoIntegral:true, nParcelas:null,
          formaPagamento, registro:null, obs:null,
          honorarioBase: matchedService?matchedService.honorarioBase:valorPago,
          iva: matchedService?matchedService.iva:0, txAdm: matchedService?matchedService.txAdm:0
        });
        await persist('sales'); closeModal(); renderAll();
      } else {
        const valorContrato = Number(document.getElementById('qValorContrato').value)||0;
        const valorEntrada = Number(document.getElementById('qEntrada').value)||0;
        const nParcelas = Number(document.getElementById('qParcelas').value)||1;
        const formaPagamento = document.getElementById('qFormaPagamentoRec').value;
        if(!valorContrato){ alert('Informe o valor do contrato.'); return; }
        if(valorEntrada > valorContrato){ alert('O valor de entrada não pode ser maior que o valor do contrato.'); return; }
        const parcelas = Array.from({length:nParcelas}, (_,i)=>({numero:i+1, data:null, pago:false}));
        STATE.recurrences.push({
          id:'rec-'+Date.now(), dataVenda:data, cliente, servico, nParcelas, valorEntrada, formaPagamento,
          honorarioBase: matchedService?matchedService.honorarioBase:valorContrato,
          iva: matchedService?matchedService.iva:0, txAdm: matchedService?matchedService.txAdm:0,
          valorContrato, vendedorId, vendedorNome: vendedor?vendedor.nome:'—', parcelas, origemSheet:'manual'
        });
        await persist('recurrences'); closeModal(); renderAll();
      }
    };
  }

  render();
}

/* Edita uma recorrência já cadastrada: cliente, serviço, vendedor, valor do
   contrato, valor de entrada/já pago, honorário base/IVA/taxa administrativa
   e nº de parcelas (preservando o status pago/pendente das parcelas que
   continuarem existindo). Serve tanto pra corrigir dados importados errado
   quanto pra ajustar uma recorrência no dia a dia. */
/* Edita uma venda avulsa já cadastrada — cliente, serviço, vendedor, data,
   origem, valor total/recebido, forma de pagamento e honorário base/IVA/
   taxa administrativa. Serve pra corrigir dados importados errado e pra
   remover duplicatas (junto com o botão Excluir). */
/* Cria uma conta de login nova (Supabase Auth + profiles), chamando a
   Edge Function "create-user" — a chave service_role necessária pra isso
   NUNCA fica no navegador, só existe do lado do servidor (ver o comentário
   no topo de supabase/functions/create-user/index.ts). Se prefillSellerId
   vier preenchido, a conta já nasce ligada a esse vendedor (colaborador);
   se vier vazio, a pessoa escolhe o papel na hora. */
function openCreateAccountModal(prefillSellerId){
  const sellerFixo = prefillSellerId ? sellerById(prefillSellerId) : null;
  const opts = STATE.sellers.map(s=>`<option value="${s.id}">${s.nome}</option>`).join('');
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-backdrop" id="mBackdrop"><div class="modal">
    <div class="modal-head"><h3>Criar conta de acesso${sellerFixo ? ' — '+sellerFixo.nome : ''}</h3><button id="mClose">&times;</button></div>
    <div class="modal-body">
      <div class="field"><label>Nome</label><input type="text" id="caNome" value="${sellerFixo?sellerFixo.nome:''}"></div>
      ${sellerFixo ? `<input type="hidden" id="caRole" value="colaborador"><input type="hidden" id="caSeller" value="${sellerFixo.id}">
        <div class="field-hint">Esta conta será do tipo <strong>colaborador</strong>, ligada a <strong>${sellerFixo.nome}</strong>.</div>`
      : `<div class="field"><label>Papel</label><select id="caRole"><option value="colaborador">Colaborador(a)</option><option value="gestor">Gestor(a)</option></select></div>
        <div class="field" id="caSellerField"><label>Vendedor correspondente</label><select id="caSeller">${opts}</select></div>`}
      <div class="field"><label>E-mail de login</label><input type="email" id="caEmail" placeholder="pessoa@escritorio.local"></div>
      <div class="field"><label>Senha</label><input type="password" id="caSenha" placeholder="Mínimo 6 caracteres"></div>
      <div id="caError" style="color:var(--bad);font-size:12.5px;margin:-6px 0 12px;display:none;"></div>
      <div id="caSuccess" style="color:var(--good);font-size:12.5px;margin:-6px 0 12px;display:none;">Conta criada — a pessoa já pode entrar com este e-mail e senha.</div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Criar conta</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });

  if(!sellerFixo){
    const roleSel = document.getElementById('caRole');
    const sellerField = document.getElementById('caSellerField');
    roleSel.addEventListener('change', ()=>{ sellerField.style.display = roleSel.value==='gestor' ? 'none' : ''; });
  }

  document.getElementById('mSave').onclick = async ()=>{
    const errBox = document.getElementById('caError');
    const okBox = document.getElementById('caSuccess');
    errBox.style.display = 'none'; okBox.style.display = 'none';
    const nome = document.getElementById('caNome').value.trim();
    const role = document.getElementById('caRole').value;
    const sellerIdSel = document.getElementById('caSeller') ? document.getElementById('caSeller').value : null;
    const email = document.getElementById('caEmail').value.trim();
    const senha = document.getElementById('caSenha').value;
    if(!email || !senha){ errBox.textContent = 'Preencha e-mail e senha.'; errBox.style.display='block'; return; }
    if(senha.length < 6){ errBox.textContent = 'A senha precisa de pelo menos 6 caracteres.'; errBox.style.display='block'; return; }
    const btn = document.getElementById('mSave');
    btn.disabled = true; btn.textContent = 'A criar…';
    try{
      const { data: { session } } = await supa.auth.getSession();
      const res = await fetch(`${SUPABASE_URL}/functions/v1/create-user`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ email, password: senha, role, sellerId: role==='colaborador'?sellerIdSel:null, nome })
      });
      const body = await res.json();
      if(!res.ok || body.error){
        errBox.textContent = body.error || 'Não consegui criar a conta.';
        errBox.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Criar conta';
        return;
      }
      okBox.style.display = 'block';
      btn.textContent = 'Conta criada ✓';
    }catch(e){
      errBox.textContent = 'Não consegui falar com a função de criação de conta — confirme se ela já foi publicada no Supabase (ver docs/SECURITY_MIGRATION.md).';
      errBox.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Criar conta';
    }
  };
}

      <div class="field-row">
        <div class="field"><label>Honorário base (€)</label><input type="number" id="erBase" min="0" step="0.01" value="${rec.honorarioBase||0}"></div>
        <div class="field"><label>IVA (€)</label><input type="number" id="erIva" min="0" step="0.01" value="${rec.iva||0}"></div>
        <div class="field"><label>Taxa administrativa (€)</label><input type="number" id="erTx" min="0" step="0.01" value="${rec.txAdm||0}"></div>
      </div>
      <div class="field"><label><input type="checkbox" id="erIsentoTx" ${rec.isentoTaxaAdm?'checked':''} style="width:auto;margin-right:8px;">Isento de taxa administrativa (não cobra nas parcelas, mesmo com valor acima preenchido)</label></div>
      <div class="field"><label>Nº de parcelas (após a entrada)</label><select id="erParcelas">${opcoesParcelas}</select>
        <div class="field-hint">Aumentar adiciona parcelas pendentes no fim. Reduzir remove as últimas — cuidado se alguma delas já estiver paga.</div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn gold" id="mSave">Guardar alterações</button></div>
  </div></div>`;
  document.getElementById('mClose').onclick = closeModal;
  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mBackdrop').addEventListener('click', e=>{ if(e.target.id==='mBackdrop') closeModal(); });

  const erServico = document.getElementById('erServico');
  erServico.addEventListener('input', ()=>{
    const matched = serviceByName(erServico.value);
    const prev = document.getElementById('erServicoPreview');
    if(matched){
      document.getElementById('erValor').value = matched.honorarioFinal;
      document.getElementById('erBase').value = matched.honorarioBase;
      document.getElementById('erIva').value = matched.iva;
      document.getElementById('erTx').value = matched.txAdm;
      prev.innerHTML = `Honorário base: <strong>${fmtEUR(matched.honorarioBase)}</strong> · IVA: ${fmtEUR(matched.iva)} · Taxa adm.: ${fmtEUR(matched.txAdm)}`;
    } else {
      prev.textContent = 'Serviço não encontrado no catálogo — os valores acima não são alterados automaticamente.';
    }
  });

  document.getElementById('mSave').onclick = async ()=>{
    const cliente = document.getElementById('erCliente').value.trim();
    const servico = erServico.value.trim();
    const data = document.getElementById('erData').value;
    const vendedorId = document.getElementById('erVendedor').value;
    const valorContrato = Number(document.getElementById('erValor').value)||0;
    const valorEntrada = Number(document.getElementById('erEntrada').value)||0;
    const honorarioBase = Number(document.getElementById('erBase').value)||0;
    const iva = Number(document.getElementById('erIva').value)||0;
    const txAdm = Number(document.getElementById('erTx').value)||0;
    const formaPagamento = document.getElementById('erFormaPagamento').value;
    const isentoTaxaAdm = document.getElementById('erIsentoTx').checked;
    const nParcelasNovo = Number(document.getElementById('erParcelas').value)||1;
    if(!cliente || !valorContrato){ alert('Preencha ao menos cliente e valor do contrato.'); return; }
    if(valorEntrada > valorContrato){ alert('O valor de entrada não pode ser maior que o valor do contrato.'); return; }
    const vendedor = sellerById(vendedorId);

    let parcelas = rec.parcelas.slice();
    if(nParcelasNovo > parcelas.length){
      for(let i=parcelas.length; i<nParcelasNovo; i++) parcelas.push({numero:i+1, data:null, pago:false});
    } else if(nParcelasNovo < parcelas.length){
      parcelas = parcelas.slice(0, nParcelasNovo);
    }
    parcelas.forEach((p,i)=>{ p.numero = i+1; });

    Object.assign(rec, {
      cliente, servico, dataVenda: data || rec.dataVenda, vendedorId,
      vendedorNome: vendedor?vendedor.nome:rec.vendedorNome,
      valorContrato, valorEntrada, honorarioBase, iva, txAdm, formaPagamento, isentoTaxaAdm, nParcelas: nParcelasNovo, parcelas
    });
    await persist('recurrences'); closeModal(); renderAll();
  };
}

/* =========================================================
   EVENTOS DELEGADOS
   ========================================================= */
function wireViewportEvents(){
  const vp = document.getElementById('viewport');

  // Mini barra de período (Ranking, perfil do vendedor, painel do colaborador)
  vp.querySelectorAll('[data-periodgran]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const gran = b.dataset.periodgran;
      STATE.periodFilter = { granularity: gran, anchor: gran==='month' ? todayISO().slice(0,7) : todayISO() };
      renderAll();
    });
  });
  const pPrev = vp.querySelector('[data-periodprev]');
  const pNext = vp.querySelector('[data-periodnext]');
  if(pPrev) pPrev.onclick = ()=>{ STATE.periodFilter.anchor = shiftPeriod(STATE.periodFilter, -1); renderAll(); };
  if(pNext) pNext.onclick = ()=>{ STATE.periodFilter.anchor = shiftPeriod(STATE.periodFilter, 1); renderAll(); };
  const pMonth = vp.querySelector('[data-periodmonth]');
  if(pMonth) pMonth.addEventListener('change', ()=>{ STATE.periodFilter.anchor = pMonth.value; renderAll(); });
  const pDate = vp.querySelector('[data-perioddate]');
  if(pDate) pDate.addEventListener('change', ()=>{ STATE.periodFilter.anchor = pDate.value; renderAll(); });

  // Barra de filtro genérica (Vendas, Financeiro)
  vp.querySelectorAll('.period-bar[data-filterkey]').forEach(bar=>{
    const key = bar.dataset.filterkey;
    bar.querySelectorAll('[data-gfgran]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const gran = b.dataset.gfgran;
        STATE[key] = { granularity: gran, anchor: gran==='month' ? todayISO().slice(0,7) : todayISO() };
        renderAll();
      });
    });
    const gfPrev = bar.querySelector('[data-gfprev]');
    const gfNext = bar.querySelector('[data-gfnext]');
    if(gfPrev) gfPrev.onclick = ()=>{ STATE[key].anchor = shiftPeriod(STATE[key], -1); renderAll(); };
    if(gfNext) gfNext.onclick = ()=>{ STATE[key].anchor = shiftPeriod(STATE[key], 1); renderAll(); };
    const gfMonth = bar.querySelector('[data-gfmonth]');
    if(gfMonth) gfMonth.addEventListener('change', ()=>{ STATE[key].anchor = gfMonth.value; renderAll(); });
    const gfDate = bar.querySelector('[data-gfdate]');
    if(gfDate) gfDate.addEventListener('change', ()=>{ STATE[key].anchor = gfDate.value; renderAll(); });
  });

  // Filtro de mês — Recorrências pagas
  vp.querySelectorAll('[data-paidmonth]').forEach(b=>{
    b.addEventListener('click', ()=>{ STATE.paidMonthFilter = b.dataset.paidmonth; renderAll(); });
  });

  vp.querySelectorAll('[data-parcela]').forEach(dot=>{
    dot.addEventListener('click', async ()=>{
      try{
        const recId = dot.dataset.rec, num = Number(dot.dataset.parcela);
        const rec = STATE.recurrences.find(r=>r.id===recId);
        if(!rec){ showErrorToast('recorrência '+recId+' não encontrada.'); return; }
        const parcela = rec.parcelas.find(pp=>pp.numero===num);
        if(!parcela){ showErrorToast('parcela '+num+' não encontrada.'); return; }
        parcela.pago = !parcela.pago;
        if(parcela.pago && !parcela.data) parcela.data = new Date().toISOString().slice(0,10);
        renderAll(); // atualiza a tela já, independente do resultado da gravação
        await persist('recurrences');
      }catch(err){
        showErrorToast(err && err.message ? err.message : String(err));
      }
    });
  });

  vp.querySelectorAll('[data-criar-conta-seller]').forEach(btn=>{
    btn.addEventListener('click', ()=> openCreateAccountModal(btn.dataset.criarContaSeller || null));
  });

  STATE.accessRequests.forEach(r=>{
    const roleSel = document.getElementById('reqRole-'+r.id);
    const sellerField = document.getElementById('reqSellerField-'+r.id);
    if(roleSel) roleSel.addEventListener('change', ()=>{ sellerField.style.display = roleSel.value==='gestor' ? 'none' : ''; });
  });
  vp.querySelectorAll('[data-approve-request]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const reqId = btn.dataset.approveRequest;
      const role = document.getElementById('reqRole-'+reqId).value;
      const sellerId = role==='colaborador' ? document.getElementById('reqSeller-'+reqId).value : null;
      btn.disabled = true; btn.textContent = 'A aprovar…';
      const { error } = await supa.from('profiles').update({ role, seller_id: sellerId, status:'approved' }).eq('id', reqId);
      if(error){ alert('Não consegui aprovar: '+error.message); btn.disabled=false; btn.textContent='Aprovar'; return; }
      await loadAccessRequests(); renderAll();
    });
  });
  vp.querySelectorAll('[data-reject-request]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const reqId = btn.dataset.rejectRequest;
      openConfirmModal({
        title:'Recusar pedido de acesso', danger:true, confirmLabel:'Recusar',
        message:'Tem a certeza que deseja recusar este pedido de acesso? A pessoa vai ver uma mensagem de acesso não aprovado ao tentar entrar.',
        onConfirm: async ()=>{
          const { error } = await supa.from('profiles').update({ status:'rejected' }).eq('id', reqId);
          if(error){ alert('Não consegui recusar: '+error.message); return; }
          await loadAccessRequests(); renderAll();
        }
      });
    });
  });

  vp.querySelectorAll('[data-edit-sale]').forEach(btn=>{
    btn.addEventListener('click', ()=> openEditSaleModal(btn.dataset.editSale));
  });

  vp.querySelectorAll('[data-del-sale]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const saleId = btn.dataset.delSale;
      const sale = STATE.sales.find(s=>s.id===saleId);
      openConfirmModal({
        title:'Excluir venda', danger:true, confirmLabel:'Excluir',
        message:`Tem a certeza que deseja excluir a venda de <strong>${sale.cliente}</strong> (${fmtEUR(sale.valorTotal)}, ${fmtDate(sale.data)})? Esta ação não pode ser desfeita — use isto pra remover duplicatas.`,
        onConfirm: async ()=>{ STATE.sales = STATE.sales.filter(s=>s.id!==saleId); await persist('sales'); renderAll(); }
      });
    });
  });

  vp.querySelectorAll('[data-toggle-isento]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const rec = STATE.recurrences.find(r=>r.id===btn.dataset.toggleIsento);
      if(!rec) return;
      rec.isentoTaxaAdm = !rec.isentoTaxaAdm;
      await persist('recurrences'); renderAll();
    });
  });

  vp.querySelectorAll('[data-edit-rec]').forEach(btn=>{
    btn.addEventListener('click', ()=> openEditRecModal(btn.dataset.editRec));
  });

  vp.querySelectorAll('[data-del-rec]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const recId = btn.dataset.delRec;
      const rec = STATE.recurrences.find(r=>r.id===recId);
      openConfirmModal({
        title:'Excluir recorrência', danger:true, confirmLabel:'Excluir',
        message:`Tem a certeza que deseja excluir a recorrência de <strong>${rec.cliente}</strong>? Esta ação não pode ser desfeita.`,
        onConfirm: async ()=>{ STATE.recurrences = STATE.recurrences.filter(r=>r.id!==recId); await persist('recurrences'); renderAll(); }
      });
    });
  });

  const btnAddRec = document.getElementById('btnAddRec');
  if(btnAddRec) btnAddRec.onclick = ()=>openAddRecModal(false);
  const btnAddRecColab = document.getElementById('btnAddRecColab');
  const btnAddSaleColab = document.getElementById('btnAddSaleColab');
  if(btnAddSaleColab) btnAddSaleColab.onclick = ()=>openQuickAddModal('integral', true);
  if(btnAddRecColab) btnAddRecColab.onclick = ()=>openAddRecModal(true);
  vp.querySelectorAll('[data-toggle-expand]').forEach(b=>{
    b.addEventListener('click', ()=>{ STATE[b.dataset.toggleExpand] = !STATE[b.dataset.toggleExpand]; renderAll(); });
  });
  const btnFecharAlerta = document.getElementById('btnFecharAlerta');
  if(btnFecharAlerta) btnFecharAlerta.onclick = async ()=>{ await dismissAlertaHoje(); renderAll(); };
  const btnQuickSale = document.getElementById('btnQuickSale');
  if(btnQuickSale) btnQuickSale.onclick = ()=>openQuickAddModal('integral', STATE.role==='colaborador');
  const btnQuickRec = document.getElementById('btnQuickRec');
  if(btnQuickRec) btnQuickRec.onclick = ()=>openQuickAddModal('recorrencia', STATE.role==='colaborador');
  const btnAddSale = document.getElementById('btnAddSale');
  if(btnAddSale) btnAddSale.onclick = ()=>openQuickAddModal('integral', STATE.role==='colaborador');
  const salesVendorSelect = document.getElementById('salesVendorSelect');
  if(salesVendorSelect) salesVendorSelect.addEventListener('change', ()=>{ STATE.salesVendorFilter = salesVendorSelect.value; renderAll(); });

  vp.querySelectorAll('[data-funil-nav]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      STATE.funilDiarioData = addDays(STATE.funilDiarioData || todayISO(), Number(btn.dataset.funilNav));
      renderAll();
    });
  });
  const btnFunilHoje = document.querySelector('[data-funil-hoje]');
  if(btnFunilHoje) btnFunilHoje.addEventListener('click', ()=>{ STATE.funilDiarioData = todayISO(); renderAll(); });

  vp.querySelectorAll('.funil-input').forEach(input=>{
    input.addEventListener('change', async ()=>{
      const funilSellerId = (STATE.view==='my-panel' || STATE.view==='my-funil') ? STATE.myOwnSellerId : STATE.selectedSellerId;
      const s = sellerById(funilSellerId);
      if(!s) return;
      if(!s.funilDiario) s.funilDiario = {};
      const date = input.dataset.fdate, col = input.dataset.fcol;
      if(!s.funilDiario[date]) s.funilDiario[date] = {};
      const val = Number(input.value)||0;
      if(val===0) delete s.funilDiario[date][col]; else s.funilDiario[date][col] = val;
      if(Object.keys(s.funilDiario[date]).length===0) delete s.funilDiario[date];
      await persist('funil', s.id); renderAll();
    });
  });

  const btnToggleSeller = document.getElementById('btnToggleSeller');
  if(btnToggleSeller){
    btnToggleSeller.onclick = ()=>{
      const s = sellerById(STATE.selectedSellerId);
      if(s.ativo){
        openConfirmModal({
          title:'Desativar vendedor', danger:true, confirmLabel:'Desativar',
          message:`<strong>${s.nome}</strong> deixará de aparecer no ranking e na lista ativa. O histórico de vendas e recorrências é mantido e pode ser reativado a qualquer momento.`,
          onConfirm: async ()=>{ s.ativo=false; await persist('sellers'); renderAll(); }
        });
      } else { s.ativo = true; persist('sellers').then(renderAll); }
    };
  }

  // Configurações
  vp.querySelectorAll('[data-ctab]').forEach(b=> b.addEventListener('click', ()=>{ STATE.configTab=b.dataset.ctab; renderAll(); }));
  const btnAddService = document.getElementById('btnAddService');
  if(btnAddService) btnAddService.onclick = ()=>openServiceModal(null);
  vp.querySelectorAll('[data-edit-service]').forEach(b=> b.addEventListener('click', ()=>openServiceModal(b.dataset.editService)));
  vp.querySelectorAll('[data-del-service]').forEach(b=> b.addEventListener('click', ()=>{
    openConfirmModal({
      title:'Excluir serviço', danger:true, confirmLabel:'Excluir',
      message:'Tem a certeza? Vendas e recorrências já criadas não serão afetadas.',
      onConfirm: async ()=>{ STATE.services = STATE.services.filter(s=>s.id!==b.dataset.delService); await persist('services'); renderAll(); }
    });
  }));
  const btnSaveComissao = document.getElementById('btnSaveComissao');
  if(btnSaveComissao) btnSaveComissao.onclick = async ()=>{
    STATE.meta.taxaComissao = (Number(document.getElementById('cfgTaxaComissao').value)||0)/100;
    STATE.meta.taxaIvaPadrao = (Number(document.getElementById('cfgTaxaIva').value)||0)/100;
    await persist('meta'); renderAll();
  };
  const btnAddSellerCfg = document.getElementById('btnAddSellerCfg');
  if(btnAddSellerCfg) btnAddSellerCfg.onclick = openAddSellerModal;
  vp.querySelectorAll('[data-view-seller]').forEach(b=> b.addEventListener('click', ()=>{
    STATE.selectedSellerId = b.dataset.viewSeller; STATE.view = 'seller-detail'; renderAll();
  }));
  vp.querySelectorAll('[data-toggle-seller-cfg]').forEach(b=> b.addEventListener('click', ()=>{
    const s = sellerById(b.dataset.toggleSellerCfg);
    if(s.ativo){
      openConfirmModal({
        title:'Desativar vendedor', danger:true, confirmLabel:'Desativar',
        message:`<strong>${s.nome}</strong> deixará de aparecer no ranking e na lista ativa. O histórico é mantido e pode ser reativado a qualquer momento.`,
        onConfirm: async ()=>{ s.ativo=false; await persist('sellers'); renderAll(); }
      });
    } else { s.ativo = true; persist('sellers').then(renderAll); }
  }));
  const btnAddFormaPagamento = document.getElementById('btnAddFormaPagamento');
  if(btnAddFormaPagamento) btnAddFormaPagamento.onclick = async ()=>{
    const input = document.getElementById('novaFormaPagamento');
    const val = input.value.trim().toUpperCase();
    if(!val) return;
    const lista = formasPagamentoList();
    if(!lista.includes(val)){
      STATE.meta.formasPagamento = [...lista, val];
      await persist('meta'); renderAll();
    }
  };
  vp.querySelectorAll('[data-del-forma-pagamento]').forEach(b=> b.addEventListener('click', async ()=>{
    const val = b.dataset.delFormaPagamento;
    STATE.meta.formasPagamento = formasPagamentoList().filter(f=>f!==val);
    await persist('meta'); renderAll();
  }));

  // Financeiro
  vp.querySelectorAll('[data-save-nodate]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const recId = btn.dataset.saveNodate;
      const num = Number(btn.dataset.parcelaNum);
      const input = document.getElementById(`ndData-${recId}-${num}`);
      if(!input.value){ alert('Escolha uma data antes de salvar.'); return; }
      const rec = STATE.recurrences.find(r=>r.id===recId);
      const p = rec && rec.parcelas.find(x=>x.numero===num);
      if(!p) return;
      p.data = input.value;
      await persist('recurrences'); renderAll();
    });
  });

  vp.querySelectorAll('[data-pagar-rec]').forEach(btn=>{
    btn.addEventListener('click', ()=> abrirPagamentoRecorrenciaModal(btn.dataset.pagarRec));
  });

  vp.querySelectorAll('[data-comissao-seller]').forEach(el=>{
    el.addEventListener('click', ()=> abrirComissaoDetalhe(el.dataset.comissaoSeller, STATE.periodFilter));
  });

  vp.querySelectorAll('[data-detalhe-card]').forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalheCard(el.dataset.detalheCard, STATE.periodFilter, el.dataset.detalheSeller || null));
  });

  vp.querySelectorAll('[data-detalhe-origem]').forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalhePipeline('origem', el.dataset.detalheOrigem, STATE.clientesFilter));
  });
  vp.querySelectorAll('[data-detalhe-servico]').forEach(el=>{
    el.addEventListener('click', ()=> abrirDetalhePipeline('servico', el.dataset.detalheServico, STATE.clientesFilter));
  });

  vp.querySelectorAll('[data-ftab]').forEach(b=> b.addEventListener('click', ()=>{ STATE.financeiroTab=b.dataset.ftab; renderAll(); }));

  vp.querySelectorAll('.linechart-wrap').forEach(wrap=>{
    const svg = wrap.querySelector('.linechart-svg');
    const hoverLine = wrap.querySelector('.lc-hoverline');
    const tooltip = wrap.querySelector('.lc-tooltip');
    if(!svg || !hoverLine || !tooltip) return;
    let months, series;
    try{
      months = JSON.parse(wrap.dataset.lcMonths.replace(/&apos;/g,"'"));
      series = JSON.parse(wrap.dataset.lcSeries.replace(/&apos;/g,"'"));
    }catch(e){ return; }
    const padL = Number(wrap.dataset.lcPadl), innerW = Number(wrap.dataset.lcInnerw);
    const W = 640;
    const fmtVal = (v, tipo)=> tipo==='pct' ? v.toFixed(1)+'%' : fmtEUR(v);
    const mostra = (clientX)=>{
      const rect = svg.getBoundingClientRect();
      const relX = (clientX-rect.left)/rect.width*W;
      let idx = months.length>1 ? Math.round(((relX-padL)/innerW)*(months.length-1)) : 0;
      idx = Math.max(0, Math.min(months.length-1, idx));
      const xPix = months.length>1 ? padL+(idx/(months.length-1))*innerW : padL+innerW/2;
      hoverLine.setAttribute('x1', xPix); hoverLine.setAttribute('x2', xPix); hoverLine.setAttribute('opacity','1');
      tooltip.innerHTML = `<strong>${months[idx]}</strong>` + series.map(s=>`<span style="color:${s.color==='#520225'?'#e8a6c4':s.color}">●</span> ${s.label}: <strong>${fmtVal(s.values[idx], s.fmt)}</strong>`).join('<br>');
      tooltip.style.display = 'block';
      const pctX = (xPix/W)*100;
      tooltip.style.left = Math.min(88,Math.max(12,pctX))+'%';
    };
    svg.addEventListener('mousemove', e=>mostra(e.clientX));
    svg.addEventListener('touchmove', e=>{ if(e.touches[0]) mostra(e.touches[0].clientX); }, {passive:true});
    svg.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; hoverLine.setAttribute('opacity','0'); });
  });

  vp.querySelectorAll('[data-search-key]').forEach(input=>{
    input.addEventListener('input', ()=>{
      STATE[input.dataset.searchKey] = input.value;
      renderAll();
      const el = document.querySelector(`[data-search-key="${input.dataset.searchKey}"]`);
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  });
  const extratoDataInput = document.getElementById('extratoDataInput');
  if(extratoDataInput) extratoDataInput.addEventListener('change', ()=>{ STATE.extratoData = extratoDataInput.value; renderAll(); });
  const btnAddCost = document.getElementById('btnAddCost');
  if(btnAddCost) btnAddCost.onclick = ()=>openCostModal(null, btnAddCost.dataset.defaultCategoria);
  vp.querySelectorAll('[data-edit-cost]').forEach(b=> b.addEventListener('click', ()=>openCostModal(b.dataset.editCost)));
  vp.querySelectorAll('[data-toggle-cost]').forEach(b=> b.addEventListener('click', async ()=>{
    const c = STATE.costs.find(x=>x.id===b.dataset.toggleCost);
    if(!c) return;
    const mes = b.dataset.costMonth;
    const mesOrigem = c.vencimento ? c.vencimento.slice(0,7) : null;
    if(c.categoria==='FIXO' && mes && mes!==mesOrigem){
      if(!c.pagoPorMes) c.pagoPorMes = {};
      const estavaPago = costPagoNoMes(c, mes);
      c.pagoPorMes[mes] = estavaPago ? {pago:false} : {pago:true, data:todayISO()};
    } else {
      c.pago = !c.pago;
      c.dataPagamento = c.pago ? todayISO() : null;
    }
    await persist('costs'); renderAll();
  }));
  vp.querySelectorAll('[data-pagar-custo]').forEach(b=> b.addEventListener('click', async ()=>{
    const c = STATE.costs.find(x=>x.id===b.dataset.pagarCusto);
    if(!c) return;
    const mes = b.dataset.custoMonth;
    const mesOrigem = c.vencimento ? c.vencimento.slice(0,7) : null;
    if(mes && mes!==mesOrigem){
      if(!c.pagoPorMes) c.pagoPorMes = {};
      c.pagoPorMes[mes] = {pago:true, data:todayISO()};
    } else {
      c.pago = true;
      c.dataPagamento = todayISO();
    }
    await persist('costs'); renderAll();
  }));
  vp.querySelectorAll('[data-del-cost]').forEach(b=> b.addEventListener('click', ()=>{
    const repete = b.dataset.delCostRepete==='1';
    openConfirmModal({
      title:'Excluir custo', danger:true, confirmLabel:'Excluir',
      message: repete
        ? 'Este custo repete automaticamente todo mês. Excluir apaga o lançamento original e <strong>para a repetição a partir de agora</strong> (os meses já fechados no passado não mudam). Tem a certeza?'
        : 'Tem a certeza que deseja excluir este custo?',
      onConfirm: async ()=>{ STATE.costs = STATE.costs.filter(c=>c.id!==b.dataset.delCost); await persist('costs'); renderAll(); }
    });
  }));
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function renderAll(){
  try{
    if(!STATE.role){ renderLoginScreen('signin'); return; }
    renderNav();
    renderTopbar();
    renderSidebar();
    const vp = document.getElementById('viewport');
    if(STATE.view==='overview') vp.innerHTML = renderOverview();
    else if(STATE.view==='recurrences') vp.innerHTML = renderRecurrences();
    else if(STATE.view==='recurrences-paid') vp.innerHTML = renderRecurrencesPaid();
    else if(STATE.view==='recurrences-nodate') vp.innerHTML = renderRecurrencesNoDate();
    else if(STATE.view==='sales') vp.innerHTML = renderSales();
    else if(STATE.view==='ranking') vp.innerHTML = renderRanking();
    else if(STATE.view==='clientes') vp.innerHTML = renderClientes();
    else if(STATE.view==='seller-detail') vp.innerHTML = renderSellerDetail();
    else if(STATE.view==='config') vp.innerHTML = renderConfig();
    else if(STATE.view==='financeiro') vp.innerHTML = renderFinanceiro();
    else if(STATE.view==='my-panel') vp.innerHTML = renderMyPanel();
    else if(STATE.view==='my-funil') vp.innerHTML = renderMyFunil();
    wireViewportEvents();
  }catch(err){
    console.error(err);
    showErrorToast(err && err.message ? err.message : String(err));
  }
}

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('btnAddSeller').addEventListener('click', openAddSellerModal);
document.getElementById('btnLogout').addEventListener('click', async ()=>{
  await supa.auth.signOut();
  STATE.role=null; STATE.myOwnSellerId=null; STATE.myEmail=null;
  STATE.sales=[]; STATE.recurrences=[]; STATE.costs=[];
  renderLoginScreen('signin');
});

(async function init(){
  const { data: { session } } = await supa.auth.getSession();
  if(session){
    const profile = await resolveProfile();
    if(profile && profile.status==='approved'){
      STATE.role = profile.role;
      STATE.myOwnSellerId = profile.sellerId;
      STATE.myEmail = profile.email;
      await bootAfterLogin();
      return;
    }
    await supa.auth.signOut();
    if(profile && profile.status==='pending'){ renderLoginScreen('pending'); return; }
    if(profile && profile.status==='rejected'){ renderLoginScreen('rejected'); return; }
  }
  renderLoginScreen('signin');
})();
</script>
