<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/logo/favicon.png" />
  <title>Reservar — Aldeias Palace Hotel</title>
  <link rel="stylesheet" href="/src/tokens.css" />
  <link rel="stylesheet" href="/src/nav.css" />
  <style>
    body { margin: 0; background: var(--rc-page-bg); font-family: var(--rc-body-font); padding-top: 0; }
    .reserva-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 100px 24px 60px;
    }
    .reserva-wrap h1 {
      font-family: var(--rc-title-font);
      color: var(--rc-terracota);
      font-size: clamp(24px, 3.5vw, 34px);
      margin: 0 0 16px;
    }
    .reserva-wrap p {
      color: var(--rc-text-muted);
      font-size: 15px;
      max-width: 480px;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .reserva-wrap a.btn {
      background: linear-gradient(180deg, #EFC468, var(--rc-gold));
      color: var(--rc-forest-dk);
      text-decoration: none;
      padding: 15px 32px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14.5px;
      box-shadow: 0 10px 24px rgba(217, 164, 65, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }
    .reserva-wrap a.btn:hover { transform: translateY(-2px); }
    .reserva-wrap .voltar {
      margin-top: 20px;
      font-size: 13px;
      color: var(--rc-terracota);
    }
  </style>
</head>
<body>
  <div id="site-header-root"></div>

  <div class="reserva-wrap" id="reserva-content">
    <!-- preenchido via JS conforme RESERVA_URL estar configurado ou não -->
  </div>

  <div id="site-footer-root"></div>

  <script type="module">
    import { initHeader, initFooter } from '/src/nav.js';
    import { RESERVA_URL } from '/src/config.js';

    initHeader();
    initFooter();

    const el = document.getElementById('reserva-content');

    if (RESERVA_URL) {
      el.innerHTML = `
        <h1>Você será direcionado ao nosso sistema oficial de reservas</h1>
        <p>Em instantes você sai do site do Aldeias Palace e entra no sistema de reservas do hotel para conferir disponibilidade e confirmar sua estadia.</p>
        <a class="btn" href="${RESERVA_URL}">Ir para o sistema de reservas</a>
      `;
      setTimeout(() => { window.location.href = RESERVA_URL; }, 1800);
    } else {
      el.innerHTML = `
        <h1>Nosso sistema de reservas está sendo finalizado</h1>
        <p>Esse botão vai levar direto para o sistema oficial de reservas do hotel assim que o link estiver configurado. Por enquanto, entre em contato diretamente com a equipe do Aldeias Palace para confirmar disponibilidade.</p>
        <a class="btn" href="acomodacoes.html">Ver acomodações</a>
      `;
    }
  </script>
</body>
</html>
