<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/logo/favicon.png" />
  <title>Acomodação — Aldeias Palace Hotel</title>
  <link rel="stylesheet" href="/src/tokens.css" />
  <link rel="stylesheet" href="/src/rooms.css" />
  <link rel="stylesheet" href="/src/nav.css" />
  <link rel="stylesheet" href="/src/quarto.css" />
  <style>
    body { margin: 0; background: var(--rc-card-bg); }
  </style>
</head>
<body>
  <div id="site-header-root"></div>

  <main id="quarto-root"></main>

  <div id="site-footer-root"></div>

  <script type="module">
    import { initHeader, initFooter } from '/src/nav.js';
    import { renderQuartoPage } from '/src/quarto-render.js';
    import { animate } from 'animejs';

    initHeader();
    initFooter();
    renderQuartoPage('#quarto-root');

    document.querySelectorAll('.quarto-price-box__cta').forEach((btn) => {
      btn.addEventListener('mouseenter', () => animate(btn, { scale: 1.03, duration: 200, ease: 'outQuad' }));
      btn.addEventListener('mouseleave', () => animate(btn, { scale: 1, duration: 200, ease: 'outQuad' }));
    });
  </script>
</body>
</html>
